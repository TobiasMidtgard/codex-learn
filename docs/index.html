import time


def fib_naive(n):
    """Recursive definition, no caching. O(2^n)."""
    if n < 2:
        return n
    return fib_naive(n - 1) + fib_naive(n - 2)


def fib(n):
    """Fast version: iterative. O(n)."""
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a


start = time.time()

print(f"  took {time.time() - start:.3f}s")

start = time.time()
print("fib(90) =", fib(90))

## Git: a save system for projects

Git records snapshots (**commits**) of your whole project, with a message, an author and a timestamp. You can look back, compare, undo, and work on parallel versions without copying folders around.

```bash
git init                      # turn this folder into a repository (once)
git status                    # what changed since the last commit?
git add inventory.py          # stage: choose what goes in the next snapshot
git add .                     # ...or stage everything
git commit -m "Add low-stock report"
git log --oneline             # history
git diff                      # exactly what changed, line by line
```

The rhythm is `status → add → commit`, several times a day. Commit when one coherent thing works: "Add JSON persistence", not "stuff" and not a week of changes at once. Message convention: imperative mood, under ~60 characters, saying *what the commit does*.

## .gitignore

Some files don't belong in history: virtual environments, `node_modules/`, secrets, build output. List them in a `.gitignore` file at the repo root:

```text
venv/
node_modules/
__pycache__/
.env
dist/
```

`.env` in particular — that's where secrets live, and secrets in git history are practically public.

## Branches: parallel versions

A branch is a movable label on a line of commits. Work on features without touching the working version:

```bash
git switch -c report-feature   # create and switch to a branch
# ...commits...
git switch main
git merge report-feature       # bring the work into main
```

If both branches changed the same lines, git stops and marks a **conflict** in the file between `<<<<<<<` and `>>>>>>>`. Edit it to what it should be, `git add`, commit. Conflicts are normal, not emergencies.

## Remotes: GitHub and friends

A remote is a copy of the repository on a server.

```bash
git clone https://github.com/user/repo.git   # get a project
git pull                                     # fetch others' commits
git push                                     # publish yours
```

Team flow on GitHub: push a branch, open a **pull request**, teammates review the diff, then it merges into `main`. Even solo, PRs give you a place to review your own work before it lands.

## Undoing things

```bash
git restore file.py            # discard uncommitted changes to a file
git restore --staged file.py   # unstage, keep the changes
git revert abc123              # new commit that undoes an old one — safe on shared history
git stash                      # shelve work-in-progress; git stash pop brings it back
```

> Commit early, commit often, push daily. The only unrecoverable mistakes in git are in work you never committed.

## The terminal: talking to the computer directly

Every tool in this trade — git, package managers, servers, deploys — lives on the command line. The core moves:

```bash
pwd                # where am I?
ls                 # what's here?  (dir on Windows)
cd projects/shop   # go there;  cd .. goes up
mkdir tools        # make a folder
cat main.py        # print a file
python main.py     # run a program

```

Two keys do half the work: **Tab** completes names, **↑** replays previous commands. `Ctrl+C` stops a running program.

## Python projects: venv + pip

Different projects need different library versions, so each project gets its own **virtual environment**:

```bash
python -m venv venv               # create it (once per project)
source venv/bin/activate          # enter it (Windows: venv\Scripts\activate)
pip install requests fastapi      # install into it
pip freeze > requirements.txt     # write down exact versions
pip install -r requirements.txt   # ...so others can recreate it
```

The `venv/` folder itself stays out of git; `requirements.txt` goes in.

## JavaScript projects: npm

```bash
npm init -y                # creates package.json
npm install express        # adds it to package.json, installs into node_modules/
npm run dev                # runs a script defined in package.json
```

`package.json` is the project manifest: dependencies, scripts, metadata. `node_modules/` stays out of git; `package.json` and the lockfile go in.

## Environment variables

Configuration that changes between machines — database URLs, API keys, ports — lives in the **environment**, not in code:

```bash
export DATABASE_URL="sqlite:///shop.db"    # set for this shell
```

```python
import os
url = os.environ.get("DATABASE_URL", "sqlite:///dev.db")
```

Locally, a `.env` file (git-ignored) holds them and libraries like `python-dotenv` load it. In production, the hosting platform's dashboard sets them.

```text

├── README.md            what it is, how to run it
├── .gitignore
├── requirements.txt     (or package.json)
├── src/                 the code
│   ├── main.py

The README answers three questions in its first screen: what is this, how do I run it, how do I run the tests. Write it as if for a stranger — in six months, that stranger is you.

## Tests: code that checks your code

You already know what tests feel like — every task on this platform runs them against your work. Writing your own is the same idea: for each behaviour, a tiny function that calls your code and asserts on the result.

The standard Python tool is **pytest**. Files named `test_*.py`, functions named `test_*`, plain `assert` inside:

```python
# test_inventory.py
from inventory import Inventory, Item

def test_add_merges_duplicates():
    inv = Inventory()
    inv.add(Item("Torch", 249.0, 2))
    inv.add(Item("Torch", 249.0, 3))
    assert inv.items["Torch"].quantity == 5

def test_remove_unknown_item_raises():
    inv = Inventory()
    with pytest.raises(KeyError):
        inv.remove("Ghost", 1)
```

```bash
pip install pytest
pytest            # finds and runs everything, prints green dots or red details
```

Structure each test as **arrange, act, assert**: set up the world, do the one thing, check the outcome. One behaviour per test, named after the behaviour — a failing `test_remove_unknown_item_raises` tells you what broke before you read a line.

Test the boundaries: empty input, zero, one, the maximum, the thing that should raise. Bugs live at edges.

**The habit that compounds:** when you find a bug, first write a test that fails because of it, then fix the code until the test passes. That bug can never sneak back.

## Debugging: a method, not a mood

1. **Reproduce it.** Find the smallest input that triggers the problem, every time. Half of all bugs die during this step.
2. **Read the traceback, bottom-up.** Last line: what went wrong. First frame that's *your* file: where. The error is honest; start from what it literally says.
3. **Make the invisible visible.** `print(f"{order=}")` at suspicious points — the `=` inside f-strings prints name and value. Or run under a debugger (`breakpoint()` in Python, `debugger;` in JS with DevTools open) and step through, watching variables.
4. **Isolate.** Cut the failing behaviour out into a five-line script. If the bug follows, you've cornered it; if it doesn't, the problem is in what you removed.
5. **Explain it out loud** — to a colleague, or a rubber duck. Saying "it can't be the cache because—" is reliably the moment you hear it.

When it's fixed: delete the debug prints, keep the regression test, and log properly instead — `logging.warning("stock below zero for %s", name)` with timestamps beats `print` the moment code runs anywhere but your machine.

> Slow is smooth: guessing randomly at fixes feels fast and isn't. Every bug has a mechanism; your job is to see it, not to appease it.

/* ---------------------------------------------------------------- helpers */
function mem(n, kind, detail, doc, ret) {
  return { n: n, k: kind, detail: detail || '', doc: doc || '', ret: ret || '' };
}
function meth(n, detail, doc, ret) { return mem(n, K.METHOD, detail, doc, ret); }
function prop(n, detail, doc, ret) { return mem(n, K.PROP, detail, doc, ret); }
function fn(n, detail, doc, ret) { return mem(n, K.FN, detail, doc, ret); }

/* ================================================================ inference
 *
 * A real type checker is out of scope and would be the wrong tool anyway: the
 * buffer is usually half-written and syntactically invalid. This reads what is
 * there line by line and records what it can prove cheaply — assignments,
 * parameters, loop variables, imports, class attributes. Anything it cannot work
 * out simply has no type, and the caller falls back to the generic pool.
 */

const PY_LIT = [
  [/^(['"])/, 'str'], [/^[fF](['"])/, 'str'], [/^[rRbB](['"])/, 'str'],
  [/^\[/, 'list'], [/^\{[^:}]*:/, 'dict'], [/^\{/, 'set'],
  [/^\(/, 'tuple'], [/^\d+\.\d/, 'float'], [/^\d/, 'int'],
  [/^(True|False)\b/, 'bool'], [/^None\b/, 'None'],
];
const JS_LIT = [
  [/^(['"`])/, 'string'], [/^\[/, 'array'], [/^\{/, 'object'],
  [/^\d+\.\d/, 'number'], [/^\d/, 'number'],
  [/^(true|false)\b/, 'boolean'], [/^null\b/, 'null'], [/^new Map\b/, 'map'],
  [/^new Set\b/, 'set'], [/^new Promise\b/, 'promise'], [/^\/[^/]/, 'regexp'],
];

function langOf(lang) {
  if (lang === 'python') {
    return { types: PY_TYPES, globals: PY_GLOBALS.concat(PY_EXCEPTIONS), modules: PY_MODULES,
             snippets: PY_SNIPPETS, keywords: PY_KW_WORDS, lits: PY_LIT, id: /[A-Za-z_]\w*/ };
  }
  if (lang === 'js') {
    return { types: JS_TYPES, globals: JS_GLOBALS, modules: JS_MODULES,
             snippets: JS_SNIPPETS, keywords: JS_KW_WORDS, lits: JS_LIT, id: /[A-Za-z_$][\w$]*/ };
  }
  return null;
}

/* the declared return type of a call like `foo(...)` or `obj.method(...)` */
function returnTypeOf(L, expr, table) {
  const call = expr.match(/^([A-Za-z_$][\w$]*)\s*\(/);
  if (call) {
    const name = call[1];
    const local = table && table.funcs[name];
    if (local && local.ret) return local.ret;
    for (const g of L.globals) if (g.n === name && g.ret) return g.ret;
    if (L.types[name]) return name;                    /* str(x), list(x) */
    if (table && table.classes[name]) return '@' + name;
  }
  const dotted = expr.match(/^([A-Za-z_$][\w$]*)\.([A-Za-z_$][\w$]*)\s*\(/);
  if (dotted) {
    const mod = L.modules[dotted[1]] || (table && table.imports[dotted[1]] && L.modules[table.imports[dotted[1]]]);
    if (mod) { for (const m of mod) if (m.n === dotted[2] && m.ret) return m.ret; }

          if (pm) put(pm[1], '', K.PARAM, 'parameter');

      }
      if ((m = line.match(/^\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(.+?);?\s*$/))) {

    if (w.at === 'attr') {
      HTML_ATTRS.forEach(function (a) {
        add({ n: a.n, k: K.PROP, detail: a.v === false ? 'boolean attribute' : 'attribute',
              doc: HTML_ATTR_DOC[a.n] || '', insert: a.v === false ? a.n : a.n + '=""' });
      });
      return out;
    }
    /* plain text: tags at the start of a line, plus snippets */
    const ls = code.lastIndexOf('\n', ws - 1) + 1;
    if (!/^[ \t]*$/.test(code.slice(ls, ws)) || w.raw) return out;
    HTML_SNIPPETS.forEach(function (sn) { add({ n: sn.n, k: K.SNIP, detail: sn.detail, doc: sn.doc, body: sn.body }, 120); });
    HTML_TAGS.forEach(function (n) {
      add({ n: n, k: K.TYPE, detail: HTML_VOID[n] ? 'void element' : 'element', doc: HTML_TAG_DOC[n] || '' });
    });
    out.context = 'text';
    return out;
  }

  /* ================= css ================= */
  if (lang === 'css') {
    const li = Complete.lineInfo(code, ws);
    out.context = /:/.test(li.text) ? 'value' : 'property';
    if (out.context === 'property') {
      CSS_SNIPPETS.forEach(function (sn) { add({ n: sn.n, k: K.SNIP, detail: sn.detail, doc: sn.doc, body: sn.body }, 120); });
      CSS_PROPS.forEach(function (e) { add({ n: e.n, k: K.PROP, detail: e.detail, doc: e.doc, insert: e.n + ': ' }); });
    } else {
      const propName = (li.text.match(/([-\w]+)\s*:/) || [])[1];
      const decl = CSS_PROPS.find(function (e) { return e.n === propName; });
      if (decl) {
        decl.detail.split('|').map(function (x) { return x.trim(); })
          .filter(function (x) { return /^[a-z-]+$/.test(x); })
          .forEach(function (v) { add({ n: v, k: K.CONST, detail: propName, doc: decl.doc }); });
      }
    }
    out.items.sort(function (a, b) { return b.s - a.s; });
    out.items = out.items.slice(0, 60);
    return out;
  }

  if (!L) return out;
  if (Complete.inStringOrComment(code, ws, lang)) return out;

  const table = Complete.analyze(code + '\n' + (extraCode || ''), lang);
  const li = Complete.lineInfo(code, ws);

  /* ================= member access ================= */
  if (code[ws - 1] === '.') {
    out.context = 'member';
    const recv = Complete.receiverBefore(code, ws - 1, L);
    /* a module? */
    const modName = L.modules[recv] ? recv : (table.imports[recv] && L.modules[table.imports[recv]] ? table.imports[recv] : '');
    if (modName) {
      addAll(L.modules[modName]);
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
    if (/^(self|this)$/.test(recv)) {
      for (const k in table.attrs) add({ n: k, k: K.FIELD, detail: table.attrs[k].type || 'field', doc: 'Set on the instance.' });
      for (const k in table.funcs) add({ n: k, k: K.METHOD, detail: '(' + table.funcs[k].params.filter(function (p2) { return !/^(self|cls)$/.test(p2); }).join(', ') + ')', doc: 'Defined in this file.' });
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
    const t = Complete.typeOfExpr(L, recv, table);
    const pool = Complete.memberPool(L, t, table);
    if (pool) {
      addAll(pool);
      out.signature = t ? { label: recv + ': ' + ((L.types[t] && L.types[t].label) || t), doc: '' } : null;
    } else {
      /* unknown receiver — offer everything that exists on any known type, marked
         as such, rather than nothing at all */
      const seen = {};
      for (const tn in L.types) for (const m2 of L.types[tn].members) {
        if (seen[m2.n]) continue; seen[m2.n] = 1;
        add({ n: m2.n, k: m2.k, detail: m2.detail, doc: m2.doc });
      }
    }
    out.items.sort(function (a, b) { return b.s - a.s; });
    out.items = out.items.slice(0, 60);
    return out;
  }

  /* ================= python import ================= */
  if (lang === 'python') {
    let m;
    if ((m = li.text.match(/^\s*(?:from\s+([A-Za-z_]\w*)\s+)?import\s+[\w,\s]*$/))) {
      out.context = 'import';
      if (m[1]) addAll(L.modules[m[1]] || []);
      else for (const name in L.modules) add({ n: name, k: K.MOD, detail: 'module', doc: 'Standard library module.' });
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
    if (/^\s*from\s+[\w]*$/.test(li.text)) {
      out.context = 'import';
      for (const name in L.modules) add({ n: name, k: K.MOD, detail: 'module', doc: 'Standard library module.' });
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
    if (/\b(raise|except)\s+[\w]*$/.test(li.text)) {
      out.context = 'exception';
      addAll(PY_EXCEPTIONS, 200);
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
    if (/^\s*(def|class)\s+[\w]*$/.test(li.text)) { out.context = 'declaration'; return out; }
  } else {
    if (/^\s*(function|class)\s+[\w$]*$/.test(li.text)) { out.context = 'declaration'; return out; }
    if (/\bnew\s+[\w$]*$/.test(li.text)) {
      out.context = 'constructor';
      for (const g of L.globals) if (g.k === K.TYPE) add(g, 300);
      for (const c in table.classes) add({ n: c, k: K.TYPE, detail: 'class', doc: 'Defined in this file.' }, 400);
      out.items.sort(function (a, b) { return b.s - a.s; });
      return out;
    }
  }

  /* ================= inside a call ================= */
  const call = Complete.enclosingCall(code, pos);
  if (call) {
    const sig = Complete.lookupSignature(L, call.name, table);
    if (sig) {
      out.signature = { label: sig.label, doc: sig.doc, active: call.argIndex, params: sig.params };
      out.context = 'argument';
      /* python keyword arguments for this call */
      if (lang === 'python') {
        sig.params.forEach(function (p2) {
          const nm = p2.split('=')[0].trim().replace(/^\*+/, '');
          if (nm && /^[A-Za-z_]\w*$/.test(nm) && p2.indexOf('=') !== -1) {
            add({ n: nm + '=', k: K.PARAM, detail: p2, doc: 'Keyword argument of ' + call.name + '().' }, 260);
          }
        });
      }
    }
  }

  /* ================= everything in scope ================= */
  if (out.context === 'none') out.context = 'word';
  for (const name in table.vars) {
    const v = table.vars[name];
    add({ n: name, k: v.k, detail: v.detail || v.type || '', doc: v.k === K.PARAM ? 'A parameter of the enclosing function.' : 'Defined in this file.' }, 300);
  }
  for (const name in table.funcs) {
    add({ n: name, k: K.FN, detail: '(' + table.funcs[name].params.join(', ') + ')', doc: 'Defined in this file.' }, 320);
  }
  for (const name in table.classes) {
    add({ n: name, k: K.TYPE, detail: 'class', doc: 'Defined in this file.' }, 320);
  }
  for (const alias in table.imports) {
    add({ n: alias, k: K.MOD, detail: 'module ' + table.imports[alias], doc: 'Imported in this file.' }, 280);
  }
  addAll(L.globals, 100);
  L.keywords.forEach(function (kw) { add({ n: kw, k: K.KW, detail: 'keyword', doc: '' }, 40); });
  L.snippets.forEach(function (sn) { add({ n: sn.n, k: K.SNIP, detail: sn.detail, doc: sn.doc, body: sn.body }, 160); });

  /* de-duplicate, best score wins */
  const best = {};
  for (const it of out.items) {
    if (!best[it.n] || best[it.n].s < it.s) best[it.n] = it;
  }
  out.items = Object.keys(best).map(function (k2) { return best[k2]; });
  out.items.sort(function (a, b) { return b.s - a.s || a.n.length - b.n.length; });
  out.items = out.items.slice(0, 60);
  return out;
};

Complete.kindLabel = function (k) { return KIND_LABEL[k] || k; };
Complete.kindMark = function (k) { return KIND_MARK[k] || '\u25cb'; };

'use strict';

/* ---------- utilities ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function dedent(s) {
  const lines = String(s).replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
  let min = Infinity;
  for (const l of lines) { if (!l.trim()) continue; const n = l.match(/^[ \t]*/)[0].length; if (n < min) min = n; }
  if (!isFinite(min) || min === 0) return lines.join('\n');
  return lines.map(l => l.slice(min)).join('\n');
}
function debounce(fn, ms) { let t = null; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function langOfFile(name) {
  if (/\.py$/.test(name)) return 'python';
  if (/\.js$/.test(name)) return 'js';
  if (/\.css$/.test(name)) return 'css';
  if (/\.html?$/.test(name)) return 'html';
  return 'text';
}

/* ---------- content bundle ---------- */
let BUNDLE = {};
function parseBundle(raw) {
  const text = String(raw).replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--');
  const parts = text.split(/^@@[ \t]+(\S+)[ \t]*$/m);
  const map = {};
  for (let i = 1; i < parts.length; i += 2) {
    map[parts[i]] = parts[i + 1].replace(/^\n+/, '').replace(/\s+$/, '');
  }
  return map;
}
function bundleFile(key) {
  if (!(key in BUNDLE)) return '# missing: ' + key + '\n';

      const offset = prefix.split('\n').length - 1;
      return prefix.replace('OFFSET_PLACEHOLDER', String(offset)) +
        escScript(mainFile.content) + '\n' + SCRIPT_CLOSE + testTag + '</body></html>';
    }
    /* kind === 'web' */
    const mainFile = files.find(f => f.name === main) || files[0];
    let doc = mainFile.content;
    for (const f of files) {
      if (/\.css$/.test(f.name)) {
        doc = doc.replace(new RegExp('<link[^>]*href=["\']' + escapeReg(f.name) + '["\'][^>]*>', 'i'),
          function () { return '<style>\n' + f.content + '\n</style>'; });
      } else if (/\.js$/.test(f.name)) {
        doc = doc.replace(new RegExp('<scr' + 'ipt[^>]*src=["\']' + escapeReg(f.name) + '["\'][^>]*>\\s*<\\/scr' + 'ipt>', 'i'),
          function () { return SCRIPT_OPEN + '\n' + escScript(f.content) + '\n' + SCRIPT_CLOSE; });
      }
    }
    const inj = SCRIPT_OPEN + '(' + __cwHarness.toString() + ')(' + runId + ', 0);' + SCRIPT_CLOSE;
    if (/<head[^>]*>/i.test(doc)) doc = doc.replace(/<head[^>]*>/i, function (m) { return m + inj; });
    else doc = inj + doc;
    if (/<\/body>/i.test(doc)) doc = doc.replace(/<\/body>/i, function () { return testTag + '<\/body>'; });
    else doc = doc + testTag;
    return doc;
  }
  function run(opts) {
    const runId = ++seq;
    const mount = opts.mount;
    mount.innerHTML = '';
    const frame = document.createElement('iframe');
    frame.className = 'preview-frame';
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('title', 'Program output');
    let finished = false;
    const timeout = setTimeout(function () {
      if (finished) return;
      finished = true;
      delete handlers[runId];
      opts.onConsole('error', 'Tests did not finish within 10s — an infinite loop, or a very long timer?');
      opts.onDone(null);
    }, 10000);
    handlers[runId] = function (type, payload) {
      if (type === 'console') opts.onConsole(payload.level, payload.text);
      else if (type === 'tests') opts.onTests(payload);
      else if (type === 'done') {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        delete handlers[runId];
        opts.onDone(true);
      }
    };
    frame.srcdoc = buildDoc(opts.kind, opts.files, opts.main, opts.tests || [], runId);
    mount.appendChild(frame);
    return runId;
  }
  return { run: run };
})();

/* ---------- python runner (pyodide) ---------- */
const PyRunner = (function () {
  let py = null;
  let loadingPromise = null;
  let status = 'idle';
  const listeners = [];
  /* jsdelivr leads because it is the only mirror that serves the *packages*:
     cdnjs has the runtime but 404s pyodide-lock.json and CORS-blocks the wheels, so
     anything importing numpy or sympy failed there first and fell back anyway,
     costing a round trip and filling the console with errors on every lesson. */
  const SOURCES = [
    'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/',
    'https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.27.7/',
    'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/',
    'https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.26.4/',
    'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/',
  ];
  /* Sandboxed previews (e.g. artifact panes) relay fetch() to the host page via
     postMessage. Pyodide hands fetch URL objects, which cannot be structured-cloned
     ("DataCloneError: URL object could not be cloned") — so its .wasm download dies.
     hardenEnv() makes the runtime loadable there: every fetch input is reduced to a
     plain string, and wasm instantiation goes through an ArrayBuffer instead of
     streaming (streaming also breaks behind proxies that drop the wasm MIME type). */
  let hardened = false;
  function hardenEnv() {
    if (hardened) return;
    hardened = true;
    try {
      const origFetch = window.fetch;
      const PY_ASSET = /(cdnjs\.cloudflare\.com\/ajax\/libs\/pyodide\/|cdn\.jsdelivr\.net\/pyodide\/)/;
      function mirrorUrl(u) {
        let m = u.match(/cdnjs\.cloudflare\.com\/ajax\/libs\/pyodide\/([\d.]+)\/(.+)$/);
        if (m) return 'https://cdn.jsdelivr.net/pyodide/v' + m[1] + '/full/' + m[2];
        m = u.match(/cdn\.jsdelivr\.net\/pyodide\/v([\d.]+)\/full\/(.+)$/);
        if (m) return 'https://cdnjs.cloudflare.com/ajax/libs/pyodide/' + m[1] + '/' + m[2];
        return null;
      }
      function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
      if (origFetch) {
        window.fetch = function (resource, init) {
          try {
            if (typeof URL !== 'undefined' && resource instanceof URL) resource = resource.href;
            else if (typeof Request !== 'undefined' && resource instanceof Request && !init &&
                     !resource.body && (resource.method || 'GET').toUpperCase() === 'GET') {
              resource = resource.url;
            } else if (resource && typeof resource === 'object' && typeof resource.href === 'string' && typeof resource.toString === 'function') {
              resource = String(resource);
            }
          } catch (e) { /* pass the original through untouched */ }
          if (typeof resource !== 'string' || !PY_ASSET.test(resource)) {
            return origFetch.call(this, resource, init);
          }
          /* pyodide runtime asset: sanitized init + retries + mirror CDN.
             Relayed environments fail sporadically ("Failed to fetch") and their
             synthesized responses can't satisfy integrity checks. */
          if (init) {
            init = Object.assign({}, init);
            delete init.integrity;
            delete init.cache;
          }
          const self = this;
          const urls = [resource];
          const alt = mirrorUrl(resource);
          if (alt) urls.push(alt);
          return (async function () {
            let lastErr = null;
            for (const url of urls) {
              for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0 || url !== resource) await pause(250 * (attempt + 1));
                try {
                  const r = await origFetch.call(self, url, init);
                  if (r && (r.ok || r.status === 0 || r.type === 'opaque')) return r;
                  lastErr = new Error('HTTP ' + (r && r.status));
                } catch (e) { lastErr = e; }
              }
            }
            throw (lastErr || new Error('Failed to fetch ' + resource));
          })();
        };
      }
    } catch (e) {}
    try {
      if (typeof WebAssembly !== 'undefined' && WebAssembly.instantiate) {
        WebAssembly.instantiateStreaming = async function (source, imports) {
          const resp = await source;
          const buf = await resp.arrayBuffer();
          return WebAssembly.instantiate(buf, imports);
        };
        WebAssembly.compileStreaming = async function (source) {
          const resp = await source;
          const buf = await resp.arrayBuffer();
          return WebAssembly.compile(buf);
        };
      }
    } catch (e) {}
  }
  function setStatus(s) { status = s; listeners.forEach(function (fn) { try { fn(s); } catch (e) {} }); }
  function onStatus(fn) { listeners.push(fn); fn(status); }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const el = document.createElement('script');
      const timer = setTimeout(function () { reject(new Error('timeout')); }, 45000);
      el.src = src;
      el.onload = function () { clearTimeout(timer); resolve(); };
      el.onerror = function () { clearTimeout(timer); reject(new Error('load failed')); };
      document.head.appendChild(el);
    });
  }
  function ensure() {
    if (py) return Promise.resolve(py);
    if (!loadingPromise) {
      loadingPromise = (async function () {
        setStatus('loading');
        hardenEnv();
        const initNoise = [];
        function collectNoise(line) {
          initNoise.push(String(line));
          if (initNoise.length > 60) initNoise.shift();
        }
        for (const base of SOURCES) {
          try {
            await loadScript(base + 'pyodide.js');
            if (typeof loadPyodide !== 'function') continue;
            const p = await loadPyodide({ indexURL: base, stderr: collectNoise });
            try { p.setStderr(); } catch (e) {}
            py = p;
            setStatus('ready');
            return p;
          } catch (err) { collectNoise(String((err && err.message) || err)); /* next source */ }
        }
        setStatus('error');
        if (initNoise.length) {
          try { console.warn('[codewright] python runtime init failed — last messages:\n' + initNoise.slice(-8).join('\n')); } catch (e) {}
        }
        /* This used to say "download codewright.html and open it directly". That file
           is a local build artifact and has never been published, so the instruction
           was not actionable for anyone reading it on the site — and since the catalog
           was split out it would also be the wrong advice, because the published page
           fetches its courses and a file:// copy cannot. Name the actual cause. */
        throw new Error('The Python runtime could not be started here. Embedded previews sometimes block the ~10 MB download it needs from cdnjs.cloudflare.com — open this page in a normal browser tab rather than inside an embedded preview, then press Run again. Web and JavaScript lessons work everywhere either way.');
      })();
      loadingPromise.catch(function () { loadingPromise = null; });
    }
    return loadingPromise;
  }
  function formatPyError(e, mainName) {
    const msg = String((e && e.message) || e);
    const lines = msg.split('\n');
    const keep = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.indexOf('_pyodide/_base.py') !== -1 || l.indexOf('pyodide/webloop') !== -1 || l.indexOf('site-packages/pyodide') !== -1) {
        i++; /* skip its source line too */
        continue;
      }
      keep.push(l);
    }
    return keep.join('\n').split('File "<exec>"').join('File "' + mainName + '"').trim();
  }
  function pyTestMessage(e) {
    const lines = String((e && e.message) || e).trim().split('\n');
    const last = (lines[lines.length - 1] || 'failed').trim();
    if (last === 'AssertionError') return 'Assertion failed';
    if (last.indexOf('AssertionError: ') === 0) return last.slice(16);
    /* A check reads the learner's variables by name, so a NameError here means their
       program never created one — not that anything is broken. Raw Python wording
       ("name 'subtotal' is not defined. Did you mean: 'max'?") sends people hunting
       for a typo instead, so say what the check actually wanted. */
    const nameErr = last.match(/^NameError: name '([^']+)' is not defined/);
    if (nameErr) {
      return 'Your program never creates ' + nameErr[1] + '. This check reads your ' +
        'variables directly, so ' + nameErr[1] + ' needs a line of its own \u2014 ' +
        nameErr[1] + ' = \u2026 \u2014 rather than being computed inside the print.';
    }
    return last;
  }
  async function runOne(opts) {
    const p = await ensure();
    setStatus('running');
    try {
      try { await p.loadPackagesFromImports(opts.files.map(function (f) { return f.content; }).join('\n')); } catch (e) {}
      const dir = '/home/pyodide';
      for (const f of opts.files) {
        try { p.FS.writeFile(dir + '/' + f.name, f.content); } catch (e) {}
      }
      const mods = opts.files
        .filter(function (f) { return /\.py$/.test(f.name) && f.name !== opts.main; })
        .map(function (f) { return f.name.slice(0, -3); });
      p.runPython(
        'import sys, os, importlib\n' +
        'os.chdir(' + JSON.stringify(dir) + ')\n' +
        'if ' + JSON.stringify(dir) + ' not in sys.path:\n' +
        '    sys.path.insert(0, ' + JSON.stringify(dir) + ')\n' +
        'for _m in ' + JSON.stringify(mods) + ':\n' +
        '    sys.modules.pop(_m, None)\n' +
        'importlib.invalidate_caches()\n'
      );
      let out = '';
      p.setStdout({ batched: function (s) { out += s + '\n'; opts.onConsole('log', s); } });
      p.setStderr({ batched: function (s) { opts.onConsole('error', s); } });
      const mainFile = opts.files.find(function (f) { return f.name === opts.main; });
      const ns = p.globals.get('dict')();
      ns.set('__name__', '__main__');
      let ok = true;
      try {
        await p.runPythonAsync(mainFile.content, { globals: ns });
      } catch (e) {
        ok = false;
        opts.onConsole('error', formatPyError(e, opts.main));
      }
      p.setStdout();
      p.setStderr();
      const results = [];
      ns.set('_out', out);
      for (const t of (opts.tests || [])) {
        try {
          p.runPython(dedent(t.code), { globals: ns });
          results.push({ name: t.name, pass: true });
        } catch (e) {
          results.push({ name: t.name, pass: false, message: pyTestMessage(e) });
        }
      }
      try { ns.destroy(); } catch (e) {}
      return { ok: ok, results: results };
    } finally {
      setStatus('ready');
    }
  }
  /* One Pyodide instance, one set of global stdout/stderr hooks. Two overlapping
     runs would rebind each other's streams mid-flight, so output lands in the wrong
     panel and whichever finishes first unhooks the other. Callers no longer have to
     know that: runs queue. */
  let pyChain = Promise.resolve();
  function run(opts) {
    const next = pyChain.then(function () { return runOne(opts); },
                              function () { return runOne(opts); });
    pyChain = next.then(function () {}, function () {});
    return next;
  }
  return { run: run, ensure: ensure, onStatus: onStatus, getStatus: function () { return status; } };
})();

/* ---------- account sync ----------
   Optional by design. The app is a single file that has to keep working with no
   server at all, so every call here fails soft: if the API is not reachable the
   learner simply stays on local storage and is told so, rather than being blocked.

   The token goes in an Authorization header rather than a cookie. That keeps the app
   usable from a different origin than the server, and means no credential is ever
   sent ambiently — so there is nothing for a cross-site request to abuse. */
const Sync = (function () {
  const K_TOKEN = 'codex-learn-token';
  const K_BASE = 'codex-learn-server';
  const K_USER = 'codex-learn-user';
  const mem = {};

  function get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] || null) : v; } catch (e) { return mem[k] || null; } }
  function set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }

  function defaultBase() {
    if (typeof location === 'undefined') return '';
    return /^https?:$/.test(location.protocol) ? location.origin : '';
  }
  function base() { return (get(K_BASE) || defaultBase()).replace(/\/+$/, ''); }
  function setBase(url) {
    const u = String(url || '').trim().replace(/\/+$/, '');
    if (u) set(K_BASE, u); else del(K_BASE);
  }
  function token() { return get(K_TOKEN) || ''; }
  function user() { try { return JSON.parse(get(K_USER) || 'null'); } catch (e) { return null; } }
  function signedIn() { return !!token(); }
  function forget() { del(K_TOKEN); del(K_USER); }

  async function call(path, method, body, auth, timeoutMs) {
    const b = base();
    if (!b) throw new Error('No sync server configured.');
    const headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (auth) {
      const t = token();
      if (!t) throw new Error('Not signed in.');
      headers['Authorization'] = 'Bearer ' + t;
    }
    /* A machine that cannot see the server must not be able to hold the app hostage:
       an unreachable host can leave fetch pending for a minute or more, and the boot
       path awaits this. Everything here is bounded. */
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs || 12000);
    let res;
    try {
      res = await fetch(b + path, {
        method: method,
        headers: headers,
        body: body === undefined ? undefined : JSON.stringify(body),
        credentials: 'omit',
        signal: ctrl ? ctrl.signal : undefined,
      });
    } catch (e) {
      throw new Error((e && e.name === 'AbortError')
        ? 'The sync server did not answer in time.'
        : 'Could not reach the sync server.');
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
      err.status = res.status;
      if (res.status === 401) forget();          /* the session is gone; drop the stale token */
      throw err;
    }
    return data || {};
  }

  async function health(timeoutMs) {
    if (!base()) return { ok: false, reason: 'none' };
    try {
      const r = await call('/api/health', 'GET', undefined, false, timeoutMs || 4000);
      return { ok: !!r.ok };
    } catch (e) {
      return { ok: false, reason: 'unreachable' };
    }
  }

  function device() {
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    const m = ua.match(/(Windows|Macintosh|Linux|Android|iPhone|iPad)/);
    return m ? m[1] : 'device';
  }

  async function register(email, password) {
    const r = await call('/api/register', 'POST', { email: email, password: password, device: device() });
    set(K_TOKEN, r.token);
    set(K_USER, JSON.stringify(r.user));
    return r.user;
  }
  async function login(email, password) {
    const r = await call('/api/login', 'POST', { email: email, password: password, device: device() });
    set(K_TOKEN, r.token);
    set(K_USER, JSON.stringify(r.user));
    return r.user;
  }
  async function logout() {
    try { await call('/api/logout', 'POST', {}, true); } catch (e) {}
    forget();
  }
  async function pull() { return call('/api/progress', 'GET', undefined, true); }
  async function push(progress, timeoutMs) { return call('/api/progress', 'PUT', { progress: progress }, true, timeoutMs); }

  return {
    base: base, setBase: setBase, hasDefaultBase: function () { return !!defaultBase(); },
    signedIn: signedIn, user: user, forget: forget,
    health: health, register: register, login: login, logout: logout,
    pull: pull, push: push,
  };
})();

/* ---------- persistent store ---------- */
const Store = (function () {
  const KEY = 'codewright-progress-v1';
  const mem = {};
  /* Which backend actually took the last write, so the app can tell the truth about
     whether progress survives a reload instead of silently dropping it. */
  let mode = 'unknown';        /* 'backend' | 'local' | 'memory' */
  let lastError = '';
  function localAvailable() {
    try {
      localStorage.setItem(KEY + ':probe', '1');
      localStorage.removeItem(KEY + ':probe');
      return true;
    } catch (e) {
      lastError = String((e && e.name) || e);
      return false;
    }
  }
  async function backendGet() {
    if (typeof window !== 'undefined' && window.storage && window.storage.get) {
      try {
        const r = await window.storage.get(KEY);
        return r && r.value ? r.value : null;
      } catch (e) { /* missing key or unavailable */ }
    }
    try { return localStorage.getItem(KEY); } catch (e) {}
    return mem[KEY] || null;
  }
  async function backendSet(value) {
    let saved = false;
    if (typeof window !== 'undefined' && window.storage && window.storage.set) {
      try {
        const r = await window.storage.set(KEY, value);
        saved = !!r;
        if (saved) mode = 'backend';
      } catch (e) { saved = false; lastError = String((e && e.message) || e); }
    }
    try {
      localStorage.setItem(KEY, value);
      saved = true;
      if (mode !== 'backend') mode = 'local';
    } catch (e) {
      lastError = String((e && e.name) || e);
    }
    mem[KEY] = value;
    if (!saved) mode = 'memory';
    return saved;
  }
  async function load() {
    try {
      const raw = await backendGet();
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  async function save(obj) {
    try { return await backendSet(JSON.stringify(obj)); } catch (e) { return false; }
  }
  /* Called before the first save so the UI can warn straight away rather than after
     the learner has already earned progress they are about to lose. */
  function status() {
    if (mode === 'unknown') {
      if (typeof window !== 'undefined' && window.storage && window.storage.set) mode = 'backend';
      else mode = localAvailable() ? 'local' : 'memory';
    }
    return {
      mode: mode,
      persistent: mode !== 'memory',
      error: lastError,
      fromFile: (typeof location !== 'undefined' && location.protocol === 'file:'),
    };
  }
  return { load: load, save: save, status: status, key: KEY };
})();

/* ============ studio: mathematics, checking, sandboxes ============
 *
 * The three things a graduate engineering unit needs that a code lesson does not:
 * mathematics you can read, answers that can be checked as mathematics rather than
 * as strings, and a picture you can push on before any of it is formalised.
 *
 *   MathML     a LaTeX subset rendered to native MathML — no library, no fonts
 *   MathCheck  SymPy-backed equivalence, with diagnostics for the usual mistakes
 *   Sandbox    a canvas + parameter framework for the intuition visualisers
 */

/* ---------------------------------------------------------------- MathML

 * always see what was written, and it is obvious that it was not understood.

     can fall back to showing the source rather than a half-rendered expression. */

      if (i < toks.length && toks[i].t === '{') {
        i++;

        return '<mrow>' + rows + '</mrow>';
      }
      return atom();
    }

    function scripts(base) {
      let sub = null, sup = null;
      for (;;) {
        if (toks[i] && toks[i].t === '_' && sub === null) { i++; sub = group(); continue; }
        if (toks[i] && toks[i].t === '^' && sup === null) { i++; sup = group(); continue; }
        break;
      }
      if (sub !== null && sup !== null) return '<msubsup>' + base + sub + sup + '</msubsup>';
      if (sub !== null) return '<msub>' + base + sub + '</msub>';
      if (sup !== null) return '<msup>' + base + sup + '</msup>';
      return base;
    }

    function bigOp(name) {
      const glyph = BIG[name];
      const isWord = /^[a-z]{2,}$/.test(glyph);
      const base = isWord ? '<mo movablelimits="true">' + glyph + '</mo>'
                          : '<mo largeop="true">' + glyph + '</mo>';
      let under = null, over = null;
      for (;;) {
        if (toks[i] && toks[i].t === '_' && under === null) { i++; under = group(); continue; }
        if (toks[i] && toks[i].t === '^' && over === null) { i++; over = group(); continue; }

      const stack = display && name !== 'int' && name !== 'oint' && name !== 'iint';
      if (under !== null && over !== null) {
        return stack ? '<munderover>' + base + under + over + '</munderover>'
                     : '<msubsup>' + base + under + over + '</msubsup>';
      }
      if (under !== null) {
        return stack ? '<munder>' + base + under + '</munder>' : '<msub>' + base + under + '</msub>';
      }
      if (over !== null) {
        return stack ? '<mover>' + base + over + '</mover>' : '<msup>' + base + over + '</msup>';
      }

    }

    function matrix(env) {
      const fence = MATRIX_FENCE[env];
      const rows = [];
      let cells = [];
      let cell = '';
      for (;;) {
        if (i >= toks.length) return fail();
        const t = toks[i];
        if (t.t === 'cmd' && t.v === 'end') {
          i++;
          if (toks[i] && toks[i].t === '{') {
            i++;
            let name = '';
            while (toks[i] && toks[i].t !== '}') { name += (toks[i].v || ''); i++; }
            if (toks[i]) i++;

          break;
        }

      }
      cells.push(cell);
      rows.push(cells);

        return '<mtr>' + r.map(function (c) { return '<mtd>' + (c || '') + '</mtd>'; }).join('') + '</mtr>';
      }).join('') + '</mtable>';

      return '<mrow><mo stretchy="true">' + esc2(fence[0]) + '</mo>' + body +
             '<mo stretchy="true">' + esc2(fence[1]) + '</mo></mrow>';
    }

    function command(name) {
      if (GREEK[name]) return '<mi>' + GREEK[name] + '</mi>';
      if (OPS[name]) return '<mo>' + esc2(OPS[name]) + '</mo>';
      if (BIG[name]) return bigOp(name);
      if (FUNCS.indexOf(name) !== -1) return '<mi mathvariant="normal">' + name + '</mi>';

        const a = group();
        return '<mover accent="true">' + a + '<mo>' + esc2(ACCENT[name]) + '</mo></mover>';
      }

          const a = group(), b = group();
          return '<mfrac>' + a + b + '</mfrac>';
        }
        case 'sqrt': {
          if (toks[i] && toks[i].t === 'op' && toks[i].v === '[') {
            i++;
            let idx = '';
            while (toks[i] && !(toks[i].t === 'op' && toks[i].v === ']')) idx += atomWithScripts();
            if (toks[i]) i++;
            return '<mroot>' + group() + '<mrow>' + idx + '</mrow></mroot>';
          }
          return '<msqrt>' + group() + '</msqrt>';
        }
        case 'text': case 'mathrm': case 'mathbf': case 'mathit': case 'mathsf': case 'operatorname': {
          if (!toks[i] || toks[i].t !== '{') return fail();
          i++;
          let txt = '';
          let depth = 1;
          while (i < toks.length) {
            const t = toks[i];
            if (t.t === '{') depth++;
            if (t.t === '}') { depth--; if (!depth) break; }
            txt += (t.v !== undefined ? t.v : (t.t === '^' || t.t === '_' ? t.t : ' '));
            i++;
          }
          if (toks[i]) i++;
          const variant = name === 'mathbf' ? ' mathvariant="bold"'
            : name === 'mathit' ? ' mathvariant="italic"'
            : name === 'mathsf' ? ' mathvariant="sans-serif"' : '';
          if (name === 'text') return '<mtext>' + esc2(txt) + '</mtext>';
          return '<mi mathvariant="normal"' + variant.replace(' mathvariant="normal"', '') + '>' + esc2(txt) + '</mi>';
        }
        case 'left': case 'right': {
          const t = toks[i];
          if (!t) return fail();
          i++;
          const ch = t.v === '.' ? '' : (t.v || '');
          return ch ? '<mo stretchy="true">' + esc2(ch) + '</mo>' : '';
        }
        case 'begin': {
          if (!toks[i] || toks[i].t !== '{') return fail();
          i++;
          let env = '';
          while (toks[i] && toks[i].t !== '}') { env += (toks[i].v || ''); i++; }
          if (toks[i]) i++;
          if (!MATRIX_FENCE[env]) return fail();
          return matrix(env);

        case 'quad': return '<mspace width="1em"/>';
        case 'qquad': return '<mspace width="2em"/>';
        case ',': return '<mspace width="0.17em"/>';
        case ';': return '<mspace width="0.28em"/>';
        case '!': return '<mspace width="-0.17em"/>';
        case '\\': return '';

      }
    }

    function atom() {
      const t = toks[i];
      if (!t) return '';
      if (t.t === 'num') { i++; return '<mn>' + t.v + '</mn>'; }
      if (t.t === 'id') { i++; return '<mi>' + t.v + '</mi>'; }
      if (t.t === 'op') {
        i++;
        if (t.v === '(' || t.v === ')' || t.v === '[' || t.v === ']' || t.v === '|') {
          return '<mo stretchy="false">' + esc2(t.v) + '</mo>';
        }
        return '<mo>' + esc2(t.v) + '</mo>';
      }
      if (t.t === 'cmd') { i++; return command(t.v); }
      if (t.t === '{') return group();
      return fail();
    }

    function atomWithScripts() { return scripts(atom()); }

    function list(stop) {
      let out = '';
      while (i < toks.length && !failed) {
        if (stop && toks[i].t === stop) break;
        if (toks[i].t === '}' && !stop) break;
        out += atomWithScripts();
      }
      return out;
    }

    const body = list(null);
    return failed ? null : body;
  }

  function render(latex, display) {
    const src = String(latex == null ? '' : latex);

  /* $…$ inline and $$…$$ display, leaving \$ alone */
  function inText(text) {
    return String(text).replace(/(^|[^\\])\$\$([\s\S]+?)\$\$/g, function (m, pre, body) {
      return pre + render(body, true);
    }).replace(/(^|[^\\])\$([^$\n]+?)\$/g, function (m, pre, body) {
      return pre + render(body, false);
    }).replace(/\\\$/g, '$');
  }

  return { render: render, inText: inText };
})();

/* ---------------------------------------------------------------- MathCheck
 *
 * An answer to "what is the transfer function" is not a string, and grading it as
 * one teaches the learner to match the book's algebra rather than to do their own.
 * SymPy decides equivalence, so 1/(1+sRC) and (1/RC)/(s+1/RC) both pass.
 *
 * The diagnostics matter more than the verdict. When an answer is wrong the checker
 * asks *how* it is wrong — by testing the usual transformations against it — so the
 * learner is told "you have the reciprocal" or "that is in Hz, the question asked
 * for rad/s" rather than being shown the answer and learning nothing.
 */
const MathCheck = (function () {

  /* LaTeX the learner typed -> something SymPy can parse. Deliberately small: the
     same subset MathML renders, so anything that displays can also be checked. */
  /* Python keywords that are also perfectly ordinary symbol names in engineering */
  const PY_RESERVED = ['lambda', 'is', 'in', 'not', 'or', 'and', 'if', 'else', 'for',
    'while', 'class', 'def', 'from', 'import', 'as', 'return', 'None', 'True',
    'False', 'del', 'pass', 'global', 'assert', 'raise', 'with', 'yield'];

  const GREEK_NAMES = ['alpha','beta','gamma','delta','epsilon','zeta','eta','theta',
    'iota','kappa','lambda','mu','nu','xi','rho','sigma','tau','upsilon','phi','chi',
    'psi','omega','Gamma','Delta','Theta','Lambda','Xi','Pi','Sigma','Phi','Psi','Omega'];

  /* returned instead of a mangled expression when the LaTeX is outside the subset */
  const UNSUPPORTED = '\u0000unsupported';

  function latexToPy(src, vars) {
    let t = String(src == null ? '' : src);

    /* Scripts first. \sqrt{1-\zeta^{2}} has braces inside its argument, and a
       {…} pattern that cannot nest would miss the whole root and silently drop it —
       which reads to the learner as "your correct answer is wrong". Collapsing
       scripts to brace-free forms first means the later passes only ever meet the
       nesting they can actually handle. */
    for (let g = 0; g < 8; g++) {
      const next = t.replace(/_\s*\{([^{}]*)\}/g, function (m, x) {
        return '_' + x.replace(/\\[A-Za-z]+|[^A-Za-z0-9]/g, '');
      });
      if (next === t) break;
      t = next;
    }
    for (let g = 0; g < 8; g++) {
      const next = t.replace(/\^\s*\{([^{}]*)\}/g, '**($1)');
      if (next === t) break;
      t = next;
    }

    /* The argument-taking commands, to a fixpoint — as one group, not one after
       another. Each pattern is brace-free by necessity, so \frac{a}{\sqrt{b}} cannot
       match until the radical inside it has been resolved. Running the passes
       sequentially left that fraction unresolved, and the catch-all below then
       stripped the command and its braces, turning a division into an implicit
       multiplication: \frac{\sqrt{a}}{b} came out as sqrt(a)*b. A wrong answer that
       looks like a right one is the worst possible failure here, so the loop repeats
       until nothing changes and anything still unresolved is reported instead. */
    for (let pass = 0; pass < 24; pass++) {
      const before = t;
      t = t.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, ' (($1)/($2)) ');
      t = t.replace(/\\sqrt\s*\[([^\]]*)\]\s*\{([^{}]*)\}/g, ' (($2)**(1/($1))) ');
      t = t.replace(/\\sqrt\s*\{([^{}]*)\}/g, ' sqrt($1) ');
      t = t.replace(/\\(?:mathrm|mathbf|mathit|text|operatorname)\s*\{([^{}]*)\}/g, ' $1 ');
      if (t === before) break;
    }
    /* Anything left is nesting the subset does not cover. Fail loudly. */
    if (/\\(?:[dt]?frac|sqrt|mathrm|mathbf|mathit|text|operatorname)\b/.test(t)) {
      return UNSUPPORTED;
    }

    t = t.replace(/\\left|\\right/g, ' ');
    t = t.replace(/\\cdot|\\times/g, ' * ');
    t = t.replace(/\\div/g, ' / ');
    t = t.replace(/\\infty/g, ' oo ');
    t = t.replace(/\\pi\b/g, ' pi ');
    GREEK_NAMES.forEach(function (g) {
      t = t.replace(new RegExp('\\\\' + g + '(?![A-Za-z])', 'g'), ' ' + g);
    });
    t = t.replace(/_\s*([A-Za-z0-9])/g, '_$1');
    t = t.replace(/\^/g, '**');
    t = t.replace(/\\,|\\;|\\!|\\quad|\\qquad/g, ' ');
    t = t.replace(/\\[A-Za-z]+/g, ' ');            /* anything left is unsupported */
    t = t.replace(/\{|\}/g, ' ');
    return explicitMul(t.trim(), vars);
  }

  /* Implicit multiplication binds tighter than division.
     Written mathematics reads 1/RC as 1/(RC); Python reads it as (1/R)*C. Handing
     the raw text to SymPy therefore marks a correct answer wrong — and it is the
     first thing anyone types for a first-order pole. So the products are made
     explicit here, and a run of them after a division is bracketed as one
     denominator. Symbol names the lesson declares are matched whole, so V_out stays
     one symbol while RC becomes R*C. */
  const KEEP_WHOLE = ['sqrt', 'exp', 'log', 'ln', 'sin', 'cos', 'tan', 'sinh', 'cosh',
    'tanh', 'asin', 'acos', 'atan', 'atan2', 'abs', 'Abs', 're', 'im', 'conjugate',
    'pi', 'oo', 'I', 'E']
    /* A name that arrived as \sigma is one symbol whether or not the lesson
       remembered to declare it. Splitting it into s*i*g*m*a is never what was
       meant, and the failure looks like a broken answer rather than a missing
       declaration. */
    .concat(GREEK_NAMES);

  function explicitMul(text, vars) {
    const names = (vars || []).filter(Boolean).concat(KEEP_WHOLE)
      .sort(function (a, b) { return b.length - a.length; });
    const toks = [];
    let i = 0;
    while (i < text.length) {
      const c = text[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9]/.test(c)) {
        const m = /^\d+(?:\.\d+)?/.exec(text.slice(i));
        toks.push({ t: 'val', v: m[0] });
        i += m[0].length;
        continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let name = null;
        for (const n of names) {
          if (text.startsWith(n, i) && !/[A-Za-z0-9_]/.test(text[i + n.length] || '')) { name = n; break; }
        }
        if (!name) {
          const guess = /^[A-Za-z](?:_[A-Za-z0-9]+)?/.exec(text.slice(i));
          if (!guess) { i++; continue; }        /* a stray underscore, not a symbol */
          name = guess[0];
        }
        const rest = text.slice(i + name.length);
        const isFn = KEEP_WHOLE.indexOf(name) !== -1 && /^\s*\(/.test(rest);
        /* `lambda` is the obvious name for an eigenvalue and a Python keyword. Rename
           it here, once the whole name is known — doing it earlier, on the raw text,
           left `lambda_` in place of a name the matcher knew, so it fell through to
           the single-letter path and \lambda became l*a*m*b*d*a. Both sides of a
           comparison get the same rewrite, so equivalence is unaffected. */
        const safe = PY_RESERVED.indexOf(name) === -1 ? name : name + '_';
        toks.push({ t: isFn ? 'fn' : 'val', v: safe });
        i += name.length;
        continue;
      }
      if (text.startsWith('**', i)) { toks.push({ t: 'op', v: '**' }); i += 2; continue; }
      toks.push({ t: 'op', v: c });
      i++;

    /* insert the multiplications the writer left out */
    const out = [];
    for (let k = 0; k < toks.length; k++) {
      const prev = out[out.length - 1];
      const cur = toks[k];
      const opens = cur.t === 'fn' || cur.t === 'val' || (cur.t === 'op' && cur.v === '(');
      const closes = prev && (prev.t === 'val' || (prev.t === 'op' && prev.v === ')'));

        if (t.t === 'op' && t.v === ')') {

          depth--; seen.push(t); j++; continue;

        if (t.t === 'val' || t.t === 'fn') { factors++; seen.push(t); j++; continue; }

          seen.push(t); j++;
          if (out[j]) { seen.push(out[j]); j++; }

        break;
      }
      if (factors > 1) {
        res.push({ t: 'op', v: '(' });
        seen.forEach(function (t) { res.push(t); });
        res.push({ t: 'op', v: ')' });
        k = j - 1;
      }
    }

    return res.map(function (t) { return t.v; }).join(' ');
  }

  function pyStr(s) { return JSON.stringify(String(s)); }

  function program(studentPy, expectedPy, vars, mode, tol) {
    return [
      'import json',
      'import sympy as sp',
      'from sympy.parsing.sympy_parser import (parse_expr, standard_transformations,',
      '    implicit_multiplication_application, convert_xor, split_symbols)',

      '_local = {n: sp.Symbol(n) for n in _names}',
      '_T = standard_transformations + (convert_xor, split_symbols, implicit_multiplication_application)',

      '    print(json.dumps({"ok": False, "kind": "unparsed", "detail": str(e)})); raise SystemExit',
      '',

      '    # a relation cannot be subtracted; compare it as a relation',
      '    if isinstance(a, sp.core.relational.Relational) or isinstance(b, sp.core.relational.Relational):',
      '        if not (isinstance(a, sp.core.relational.Relational) and isinstance(b, sp.core.relational.Relational)):',
      '            return False',
      '        try:',
      '            return bool(sp.simplify(a) == sp.simplify(b))',
      '        except Exception:',
      '            return False',

      '    except Exception:',

      '    except Exception:',

      'elif isinstance(_got, sp.core.relational.Relational) or isinstance(_exp, sp.core.relational.Relational):',

      '    # assume, and running them on one throws rather than diagnosing anything.',
      '    if not isinstance(_got, sp.core.relational.Relational):',

      '        except Exception:',

      '            _res = {"ok": False, "kind": "wrong",',
      '                    "detail": "That condition is not the one being asked for."}',

      '    _pi = sp.pi',
      '    _probes = [',
      '        ("sign",       -_got,            "Check the sign \u2014 every term is negated."),',
      '        ("reciprocal", 1/_got,           "That is the reciprocal of what was asked for."),',
      '        ("radians",    _got/(2*_pi),     "Those are radians per second; the question asked in Hz. Divide by 2\u03c0."),',
      '        ("hertz",      _got*2*_pi,       "Those are hertz; the question asked in rad/s. Multiply by 2\u03c0."),',
      '        ("half",       _got/2,           "You are a factor of two high."),',
      '        ("double",     _got*2,           "You are a factor of two low."),',
      '        ("squared",    _got**2,          "Compare the power and amplitude forms \u2014 one of them is squared."),',
