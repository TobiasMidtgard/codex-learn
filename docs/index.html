.quiz-q .qt code{color:var(--lime);background:var(--lime-08);padding:1px 5px;border-radius:4px;font-size:.9em}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);
  font-size:13.5px;line-height:1.5;color:var(--ink-2);transition:all .16s;
}
.opt:hover:not(:disabled){border-color:var(--line-3);background:rgba(255,255,255,.04)}
.opt .k{font-family:var(--mono);font-size:10.5px;font-weight:700;min-width:19px;height:19px;flex:none;margin-top:1px;
  border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-4)}
.opt code{color:var(--lime);background:var(--lime-08);padding:0 4px;border-radius:3px;font-size:.9em}
.opt.correct{border-color:var(--lime-30);background:var(--lime-08)}
.opt.correct .k{background:var(--lime-12);border-color:var(--lime-30);color:var(--lime)}
.opt.wrong{border-color:rgba(255,138,148,.32);background:rgba(255,138,148,.07)}
.explain{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.explain.good{border-color:var(--lime-30);background:var(--lime-08)}
.explain.bad{border-color:rgba(255,138,148,.28);background:rgba(255,138,148,.07)}
.quiz-result{border:1px solid var(--lime-30);background:var(--lime-08);border-radius:var(--r-lg);padding:22px;margin:12px 0 0;animation:popIn .45s var(--pop) both}
.quiz-result .score{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.quiz-result p{margin:8px 0 14px;color:var(--ink-3);font-size:13px}

/* ---------- profile ---------- */
.prof-head{display:flex;align-items:center;gap:22px;margin-bottom:28px;flex-wrap:wrap}
.prof-av{
  width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));color:#0B0C0E;
  font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--line-3);animation:popIn .5s var(--pop) both;
}
.prof-id{flex:1;min-width:260px}
.prof-id .eyebrow{margin-bottom:6px}
.prof-name{
  width:100%;max-width:420px;background:none;border:0;border-bottom:1px solid var(--line-2);
  color:var(--ink);font:600 26px/1.2 var(--sans);letter-spacing:-.03em;padding:2px 0 6px;outline:none;
  transition:border-color .16s;
}
.prof-name::placeholder{color:var(--ink-5)}
.prof-name:focus{border-bottom-color:var(--lime)}
.prof-sub{margin:10px 0 0;font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.pcard{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:20px 22px;margin:0 0 14px;max-width:760px;
}
.pcard-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pcard-h b{font-size:14.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.pcard p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-3);max-width:64ch;text-wrap:pretty}
.pcard .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-4)}
.pcard.good{border-color:var(--lime-22)}
.pcard.good .dot{background:var(--lime);box-shadow:var(--lime-glow)}
.pcard.warn{border-color:var(--amber-22);background:var(--amber-08)}
.pcard.warn .dot{background:var(--amber);box-shadow:0 0 10px rgba(255,198,109,.6)}
.pcard-acts{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.prof-warn{font-family:var(--mono);font-size:11px;color:var(--amber)}
.acc-form{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acc-in{flex:1;min-width:200px;height:34px;padding:0 12px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font:13px var(--sans);outline:none;transition:border-color .16s}
[data-theme=light] .acc-in{background:rgba(15,25,5,0.03)}
.acc-in::placeholder{color:var(--ink-5)}
.acc-in:focus{border-color:var(--lime-30)}
.sync-line{font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.pcard code{font-family:var(--mono);font-size:.88em;color:var(--lime);
  background:var(--lime-08);padding:1px 5px;border-radius:4px}

/* ---------- lesson: code (split) ---------- */
.lesson-code{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);height:100%;min-height:0;animation:fadeIn .35s both}
.task-pane{overflow:auto;padding:22px 28px 40px;border-right:1px solid var(--line);background:rgba(11,12,15,0.60)}
[data-theme=light] .task-pane{background:rgba(255,255,255,.5)}
.task-pane .article{font-size:14.5px;line-height:1.7}
.task-pane .article h2{font-size:17px;margin:22px 0 8px}
.task-pane .article h3{font-size:15px;margin:18px 0 6px}
.task-pane .lesson-title h1{font-size:23px;letter-spacing:-.025em}

.checks{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.checks h3{display:flex;justify-content:space-between;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.checks h3 b{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:600}
.checks h3 b.allgood{color:var(--lime)}
.check{display:grid;grid-template-columns:28px 1fr;align-items:start;padding:9px 14px 9px 10px;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .gmark{margin-top:3px}
.check .name{color:var(--ink-2)}
.check.pass .name{color:var(--ink)}
.check .msg{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.check.pass{animation:fadeIn .3s ease}

.helpers{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.helper{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.helper>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 15px;text-align:left;font-size:13.5px;font-weight:600}
.helper>button:hover{background:rgba(255,255,255,.03)}
.helper>button span.k{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);font-weight:500}
.helper .hint-body{padding:0 15px 13px;font-size:13.5px;color:var(--ink-2)}
.hint-item{padding:10px 12px;margin:7px 0 0;border-left:2px solid var(--amber);background:var(--amber-08);border-radius:0 8px 8px 0;line-height:1.6}
.helper .sol-body{padding:0 15px 13px}
.helper .sol-body .fname{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin:10px 0 6px}
/* the solution viewer emits a bare <pre class=md-code>, outside any .cbx, so it
   needs the frame that moved onto the wrapper */
.helper .sol-body .md-code{border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk)}
.sol-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* workbench */
.workbench{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--editor)}
.wb-bar{display:flex;align-items:center;gap:6px;min-height:42px;padding:5px 10px 5px 8px;border-bottom:1px solid var(--line);background:rgba(16,18,22,.70);flex-wrap:wrap}
.ftabs{display:flex;gap:2px;flex:1;min-width:0;overflow:auto}
.ftab{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--ink-4);white-space:nowrap;transition:all .16s}
.ftab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
.ftab:hover{color:var(--ink-2);background:rgba(255,255,255,.04)}
.ftab.active{color:var(--ink);background:rgba(255,255,255,.06)}
.ftab.active::before{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.8)}
.ftab.ro{opacity:.65}
.ftab .ro-tag{font-size:9.5px;color:var(--ink-5)}
.wb-actions{display:flex;gap:7px;align-items:center}
.wb-actions .btn{height:30px;padding:0 13px;font-size:12px}
.rt-status{display:flex;align-items:center;gap:6px;padding:0 6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.rt-status i{width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
.rt-status.ready i{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.8)}
.rt-status.loading i{background:var(--amber);animation:blink 1s steps(1) infinite}
.rt-status.error i{background:var(--bad)}
.wb-editor{flex:1 1 58%;min-height:140px;position:relative}
.wb-panel{flex:0 0 42%;min-height:130px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:rgba(13,15,18,.80)}
.wb-resize{height:6px;flex:none;cursor:row-resize;margin:-3px 0;position:relative;z-index:2;background:transparent}
.wb-resize:hover{background:var(--lime-22)}
.ptabs{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line)}
.ptab{height:26px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-4);display:flex;align-items:center;transition:all .16s}
.ptab:hover{color:var(--ink-2)}
.ptab.active{color:var(--ink);background:rgba(255,255,255,.06)}
.ptab .badge{font-family:var(--mono);font-size:10px;margin-left:7px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--ink-3)}
.ptab .badge.good{background:var(--lime);color:var(--on-lime)}
.ptab .badge.bad{background:rgba(255,138,148,.2);color:var(--bad)}
.ptabs .spacer{flex:1}
.ptabs .note{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);padding-right:6px}
.pbody{flex:1;min-height:0;position:relative}
.console{position:absolute;inset:0;overflow:auto;padding:12px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.console .ln{display:block}
.console .ln.error,.cb-console .ln.error{color:var(--bad)}
.console .ln.warn,.cb-console .ln.warn{color:var(--amber)}
.console .ln.info,.cb-console .ln.info{color:var(--blue)}
.console .ln.sys,.cb-console .ln.sys{color:var(--ink-4);font-style:italic}
.console .ln.ok,.cb-console .ln.ok{color:var(--lime)}
.console .empty{color:var(--ink-5);font-style:italic}
.preview-wrap{position:absolute;inset:0;background:#fff}
.preview-frame{width:100%;height:100%;border:0;display:block;background:#fff}
.checks-mini{position:absolute;inset:0;overflow:auto;padding:8px 12px}
.checks-mini .check{grid-template-columns:26px 1fr;border-bottom-color:var(--line)}
.wb-foot{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:rgba(16,18,22,.7);font-size:12px;color:var(--ink-4);flex-wrap:wrap}
.wb-foot .spacer{flex:1}
.mobile-tabs{display:none;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(16,18,22,.7)}
.mobile-tabs button{flex:1;height:30px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);background:rgba(255,255,255,.05)}
.mobile-tabs button.active{background:var(--lime);color:var(--on-lime)}
.mobile-tabs .badge{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.85}

/* editor */
.cw-editor{position:absolute;inset:0;display:flex;background:var(--editor)}
.ed-gutter{width:54px;flex:none;padding:14px 18px 14px 0;text-align:right;user-select:none;overflow:hidden;
  color:var(--ink-5);font-family:var(--mono);font-size:12.5px;line-height:1.62}
.ed-gutter div{height:21.9px}
.ed-body{position:relative;flex:1;min-width:0}
.ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:14px 18px 14px 2px;border:0;border-radius:0;
  font-family:var(--mono);font-size:13.5px;line-height:1.62;white-space:pre;overflow:auto;tab-size:4;
  letter-spacing:0;word-break:normal;overflow-wrap:normal}
.ed-hl{pointer-events:none;overflow:hidden;color:var(--ink-2);background:transparent}
.ed-ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--lime);outline:0;resize:none;appearance:none}
.ed-ta::selection{background:rgba(199,247,81,.22)}
.ed-ta.ro{caret-color:transparent}

/* syntax — the design's own palette */
/* ---------- syntax palette ----------
   Roles, not shapes. Declarations and control flow are different colours because
   they answer different questions; a name being defined is brighter than the same
   name being read; parameters, properties and methods each stay recognisable. The
   accent lime is reserved for strings so literal data always reads as data. */
.tk-kw-ctl{color:#FF8AB8}                 /* if for return while — flow */
.tk-kw-decl{color:#A78BFA}                /* def class const import — binding */
.tk-kw-op{color:#C084FC;font-style:italic}/* in not and typeof — word operators */
.tk-const{color:#FFC66D}                  /* True None NaN UPPER_CASE */
.tk-self{color:#FF9E64;font-style:italic} /* self this cls */
.tk-str{color:#C7F751}
.tk-str-esc{color:#8FD32B;font-weight:600}
.tk-interp-b{color:#FFC66D;font-weight:600}
.tk-num{color:#FFC66D}
.tk-unit{color:#D8A657}
.tk-color{color:#FFC66D;text-decoration:underline dotted}
.tk-cm{color:#565C68;font-style:italic}
.tk-cm-doc{color:#6E7787;font-style:italic}
.tk-fn{color:#6E9BFF}                     /* a call */
.tk-fn-def{color:#8FD3FF;font-weight:600} /* the name being defined */
.tk-method{color:#6E9BFF}
.tk-prop{color:#9CD5FF}
.tk-param{color:#FFB4A2;font-style:italic}
.tk-var-def{color:#E6E9F0}
.tk-type{color:#7FDBFF}
.tk-type-def{color:#7FDBFF;font-weight:600}
.tk-bi{color:#7FDBFF}
.tk-dec{color:#C084FC}
.tk-op{color:#B7BCC6}
.tk-bracket{color:#8A909C}
.tk-punc{color:#6E7787}
.tk-tag{color:#FF8A94}
.tk-attr{color:#FFC66D}
.tk-attr-val{color:#C7F751}
.tk-entity{color:#C084FC}
.tk-at-rule{color:#A78BFA}
.tk-css-prop{color:#9CD5FF}
.tk-css-var{color:#FFB4A2}
.tk-selector{color:#FF8A94}
.tk-pseudo{color:#C084FC}
[data-theme=light]{
  --tk-dim:#6B7280;
}
[data-theme=light] .tk-kw-ctl{color:#B0126B}
[data-theme=light] .tk-kw-decl{color:#6D28D9}
[data-theme=light] .tk-kw-op{color:#7C3AED}
[data-theme=light] .tk-const{color:#9A5B00}
[data-theme=light] .tk-self{color:#B4530A}
[data-theme=light] .tk-str{color:#3F6212}
[data-theme=light] .tk-str-esc{color:#2C4A0B}
[data-theme=light] .tk-interp-b{color:#9A5B00}
[data-theme=light] .tk-num{color:#9A5B00}
[data-theme=light] .tk-unit{color:#8A5A12}
[data-theme=light] .tk-color{color:#9A5B00}
[data-theme=light] .tk-cm{color:var(--tk-dim)}
[data-theme=light] .tk-cm-doc{color:#5B6472}
[data-theme=light] .tk-fn,[data-theme=light] .tk-method{color:#1D4ED8}
[data-theme=light] .tk-fn-def{color:#1E40AF}
[data-theme=light] .tk-prop{color:#0E63A8}
[data-theme=light] .tk-param{color:#B4432A}
[data-theme=light] .tk-var-def{color:#131712}
[data-theme=light] .tk-type,[data-theme=light] .tk-type-def,[data-theme=light] .tk-bi{color:#0B6E80}
[data-theme=light] .tk-dec{color:#7C3AED}
[data-theme=light] .tk-op{color:#3D4539}
[data-theme=light] .tk-bracket{color:#616B59}
[data-theme=light] .tk-punc{color:#7A8474}
[data-theme=light] .tk-tag,[data-theme=light] .tk-selector{color:#B3261E}
[data-theme=light] .tk-attr{color:#9A5B00}
[data-theme=light] .tk-attr-val{color:#3F6212}
[data-theme=light] .tk-entity,[data-theme=light] .tk-pseudo,[data-theme=light] .tk-at-rule{color:#7C3AED}
[data-theme=light] .tk-css-prop{color:#0E63A8}
[data-theme=light] .tk-css-var{color:#B4432A}

/* ---------- completion ---------- */
.ac-menu{
  position:absolute;z-index:9;min-width:260px;max-width:420px;max-height:250px;overflow:auto;
  padding:4px;border-radius:10px;border:1px solid var(--line-3);background:var(--surface-solid);
  box-shadow:0 18px 46px rgba(0,0,0,.55);font-family:var(--mono);font-size:12.5px;
  animation:fadeIn .1s both;scrollbar-width:thin;
}
[data-theme=light] .ac-menu{box-shadow:0 18px 46px rgba(15,25,5,.16)}
.ac-item{
  display:grid;grid-template-columns:18px minmax(0,auto) minmax(0,1fr);gap:8px;align-items:center;
  padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.ac-item.sel{background:var(--lime-12);color:var(--ink)}
.ac-item:hover:not(.sel){background:rgba(255,255,255,.05)}
[data-theme=light] .ac-item:hover:not(.sel){background:rgba(15,25,5,.05)}
.ac-ic{width:18px;text-align:center;font-size:11px;line-height:1;flex:none}
.ac-n{overflow:hidden;text-overflow:ellipsis}
.ac-n b{color:var(--lime);font-weight:700}
.ac-item.sel .ac-n b{color:var(--lime-hi)}
.ac-d{color:var(--ink-5);font-size:11px;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ac-item.sel .ac-d{color:var(--ink-4)}

## A program is a list of instructions

Python reads your file from the top and does what each line says, one line at a time. That is the whole trick. Everything else — loops, functions, classes — is a way of organising those instructions.

```python
print("Hello, world")
print("This runs second")
```

`print()` writes whatever is inside the parentheses to the screen. The text in quotes is called a **string**.

## Comments

A line that starts with `#` is a comment. Python ignores it completely; it exists for the humans reading the code.

```python
# Explain *why* the code does something, not what it does.
total = price * 1.25  # price including 25% VAT
```

## Strings and numbers are different things

```python
print("40" + "2")   # 402  — joins two strings together
print(40 + 2)       # 42   — adds two numbers
print(7 * 6)        # 42   — Python does the maths, then prints the result
```

Quotes make a string. No quotes makes a number (or a name — more on that next lesson). Mixing them is one of the first errors everyone meets:

```python
print("Total: " + 42)   # TypeError: can only concatenate str (not "int") to str
```

## Errors are normal

When Python cannot follow an instruction it stops and prints a **traceback**:

```text
Traceback (most recent call last):
  File "main.py", line 3, in <module>
    print(nmae)
NameError: name 'nmae' is not defined
```

Read it from the bottom: the last line names the error and explains it. The line above points to where it happened. You will read hundreds of these — they are Python helping you, not judging you.

## How this platform works

Every lesson is one of three things: **reading** (like this one), a **quiz**, or a **task** with a code editor. Tasks come with *checks*: small tests that run against your code when you press **Run** (or `Ctrl`+`Enter`). When every check passes, the lesson is complete.

Press "Try in playground" on any code block to run it yourself.

## Variables are names for values

A variable is a label you stick on a value so you can use it later.

```python
price = 120.0
quantity = 2
subtotal = price * quantity
print(subtotal)   # 240.0
```

Names can contain letters, digits and underscores, and cannot start with a digit. By convention Python uses `snake_case`: `total_price`, not `TotalPrice`. Constants that never change are written in capitals: `TAX_RATE = 0.25`.

## Every value has a type

| Type | Example | What it is for |
|---|---|---|
| `int` | `42` | whole numbers |
| `float` | `3.14` | numbers with decimals |
| `str` | `"hello"` | text |
| `bool` | `True`, `False` | yes/no answers |

`type()` tells you which one you have, and you can convert between them:

```python
print(type(42))          # <class 'int'>
print(int("12") + 3)     # 15   — string to int
print(str(12) + "3")     # 123  — int to string
print(float("2.5") * 2)  # 5.0
```

## Arithmetic

```python
print(10 + 3)    # 13
print(10 - 3)    # 7
print(10 * 3)    # 30
print(10 / 3)    # 3.3333333333333335  — division always gives a float
print(10 // 3)   # 3   — floor division: whole part only
print(10 % 3)    # 1   — modulo: the remainder
print(2 ** 10)   # 1024 — power
```

`%` looks odd but is everywhere: `n % 2 == 0` is how you check whether a number is even.

## f-strings: putting values inside text

Put an `f` before the opening quote and any expression inside `{}` is evaluated and inserted:

```python
name = "Ada"
items = 3
print(f"{name} bought {items} items")          # Ada bought 3 items
print(f"Next year she'll have {items + 1}")    # expressions work too
print(f"Total: {240.0:.2f} kr")                # Total: 240.00 kr  — format with 2 decimals
```

`:.2f` means "as a float with 2 decimals". You will use it for money constantly.

## A few string methods

```python
s = "  Wiper Blades  "
print(s.strip())          # "Wiper Blades"   — remove surrounding whitespace
print(s.lower())          # "  wiper blades  "
print(s.upper())
print(s.strip().replace("Blades", "Fluid"))
print(len("hello"))       # 5
print("a,b,c".split(","))  # ['a', 'b', 'c']
print("hello"[0])         # h    — index from 0
print("hello"[1:3])       # el   — slice: start included, end excluded
```

> **Rule of thumb:** methods are called *on* a value with a dot (`s.upper()`), functions take the value as an argument (`len(s)`).

## Decisions: if, elif, else

```python
temperature = 23

if temperature > 28:
    print("Hot")
elif temperature > 18:
    print("Nice")
else:
    print("Cold")
```

The block that runs is the first one whose condition is `True`. Everything indented under the `if` belongs to it — **indentation is how Python knows where a block starts and ends**. Four spaces is the convention.

Comparisons produce booleans:

| Operator | Meaning |
|---|---|
| `==` `!=` | equal, not equal (note: `=` is assignment, `==` is comparison) |
| `<` `>` `<=` `>=` | less / greater than (or equal) |
| `and` `or` `not` | combine conditions |
| `in` | membership: `"a" in "cat"`, `3 in [1, 2, 3]` |

```python
age = 20
has_licence = True
if age >= 18 and has_licence:
    print("Can rent a car")
```

Empty things count as `False`: `""`, `[]`, `0` and `None` are all "falsy". So `if name:` means "if name is not empty".

## Repeating work: for

A `for` loop runs a block once for each item in a sequence.

```python
for tool in ["wrench", "jack", "torch"]:
    print("Pack the", tool)

for i in range(5):        # 0, 1, 2, 3, 4  — stop is not included
    print(i)

for i in range(2, 10, 3): # 2, 5, 8       — start, stop, step
    print(i)
```

The accumulator pattern shows up everywhere:

```python
total = 0
for n in [4, 8, 15]:
    total += n         # same as total = total + n
print(total)           # 27
```

`enumerate` gives you the index and the item together:

```python
for index, name in enumerate(["Ada", "Linus"]):
    print(index, name)   # 0 Ada, 1 Linus
```

## Repeating while a condition holds

```python
attempts = 0
while attempts < 3:
    print("Trying...")
    attempts += 1
```

If the condition never becomes `False` the loop never ends — in this browser that will freeze the page, so always make sure something inside the loop changes the condition.

## break and continue

```python
for n in [3, 8, -1, 5]:
    if n < 0:
        break          # leave the loop entirely
    if n % 2 == 0:
        continue       # skip the rest of this iteration
    print(n)           # prints 3, then stops at -1
```

> **Tip:** when logic gets tangled, write the conditions as English first: "if it is divisible by both, then by three, then by five, otherwise the number". The order of the checks matters.

def fizzbuzz(n):
    """Return a list of strings for the numbers 1..n."""
    result = []
    for i in range(1, n + 1):
        if i % 15 == 0:
            result.append("FizzBuzz")
        elif i % 3 == 0:
            result.append("Fizz")
        elif i % 5 == 0:
            result.append("Buzz")
        else:
            result.append(str(i))
    return result

def letter_grade(score):
    """Return "A", "B", "C", "D" or "F" for a score 0-100."""
    if score >= 90:
        return "A"
    elif score >= 80:
        return "B"
    elif score >= 70:
        return "C"
    elif score >= 60:
        return "D"
    return "F"


def count_grades(scores):
    """Return a dict with counts for every letter."""
    counts = {"A": 0, "B": 0, "C": 0, "D": 0, "F": 0}
    for score in scores:
        counts[letter_grade(score)] += 1
    return counts


print(letter_grade(85))
print(count_grades([95, 82, 71, 64, 33, 88]))

## Functions: give a piece of work a name

A function packages a few lines of code so you can run them by name, as often as you like, with different inputs.

```python
def greet(name):
    return f"Hello, {name}!"

message = greet("Ada")   # call it; the result comes back
print(message)
print(greet("Linus"))
```

- `def` starts the definition, `name` is a **parameter** — a placeholder for whatever the caller passes in.
- `return` hands a value back to the caller *and* ends the function immediately.
- Defining a function runs nothing. Only calling it does.

## return is not print

`print` shows something to a human. `return` gives a value to the rest of your program. A function that only prints cannot be used in a calculation:

```python
def double(n):
    print(n * 2)       # shows 8, but returns None

result = double(4) + 1   # TypeError: None + 1
```

If a function has no `return`, it returns `None`. The checks in this platform call your functions and inspect the return value, so `return` is what they see.

## Defaults and keyword arguments

```python
def price_with_tax(price, rate=0.25):
    return price * (1 + rate)

print(price_with_tax(100))          # 125.0 — uses the default rate
print(price_with_tax(100, 0.15))    # 115.0
print(price_with_tax(rate=0.1, price=50))  # keywords can go in any order
```

## Scope: variables live inside the function

```python
def add_fee(total):
    fee = 20            # only exists inside this function
    return total + fee

print(add_fee(100))     # 120
print(fee)              # NameError — fee is gone
```

Read variables from outside freely, but pass values in as parameters instead of relying on globals. It makes functions testable and reusable.

## Early returns keep code flat

```python
def describe(n):
    if n < 0:
        return "negative"
    if n == 0:
        return "zero"
    return "positive"
```

## Returning more than one thing

```python
def min_max(numbers):
    return min(numbers), max(numbers)   # a tuple

low, high = min_max([4, 9, 1])          # unpack it
```

## Docstrings and type hints

```python
def area(width: float, height: float) -> float:
    """Return the area of a rectangle."""
    return width * height
```

Hints don't change how the code runs; they tell readers (and editors) what you intended.

## Lists: ordered, changeable

```python
tools = ["wrench", "jack"]
tools.append("torch")         # add to the end
tools.insert(0, "gloves")     # insert at position 0
print(tools[0], tools[-1])    # gloves torch  — negative index counts from the end
print(len(tools))             # 4
print("jack" in tools)        # True
tools.remove("jack")          # remove by value
last = tools.pop()            # remove and return the last item
print(tools[1:3])             # slice: items 1 and 2
```

Sorting: `sorted(items)` returns a **new** sorted list; `items.sort()` sorts in place and returns `None`. Both accept `key=` and `reverse=`:

```python
words = ["pear", "fig", "banana"]
print(sorted(words, key=len))            # ['fig', 'pear', 'banana']
print(sorted(words, reverse=True))
```

## Tuples: like lists, but frozen

```python
point = (3, 4)
x, y = point           # unpacking
```

Use them for fixed groups of values — coordinates, a (name, score) pair — and as dictionary keys.

## Dictionaries: look things up by key

```python
stock = {"wrench": 12, "jack": 3}
stock["torch"] = 8                 # add or overwrite
print(stock["jack"])               # 3
print(stock.get("hammer", 0))      # 0 — default instead of KeyError
print("jack" in stock)             # True — checks keys

for name, qty in stock.items():    # loop over key/value pairs
    print(name, qty)
```

The counting pattern is worth memorising:

```python
counts = {}
for word in ["a", "b", "a"]:
    counts[word] = counts.get(word, 0) + 1
print(counts)   # {'a': 2, 'b': 1}
```

Sorting a dict by its values:

```python
ranked = sorted(stock.items(), key=lambda pair: pair[1], reverse=True)
print(ranked)   # [('wrench', 12), ('torch', 8), ('jack', 3)]
```

`lambda pair: pair[1]` is a tiny anonymous function that says "sort by the second element".

## Sets: unique values, fast membership

```python
seen = set()
seen.add("ada")
seen.add("ada")
print(len(seen))     # 1
print(set([1, 2, 2, 3]))  # {1, 2, 3}
```

## Comprehensions: build a collection in one line

```python
squares = [n * n for n in range(5)]                 # [0, 1, 4, 9, 16]
evens = [n for n in range(10) if n % 2 == 0]        # [0, 2, 4, 6, 8]
lengths = {w: len(w) for w in ["fig", "pear"]}      # {'fig': 3, 'pear': 4}
```

## Strings ↔ lists

```python
parts = "a,b,c".split(",")     # ['a', 'b', 'c']
line = "-".join(parts)         # 'a-b-c'
words = "the quick  fox".split()   # split on any whitespace: ['the', 'quick', 'fox']
```

`zip` pairs up two sequences: `for name, score in zip(names, scores):`.

## Exceptions: how Python reports problems

When something goes wrong at runtime Python *raises an exception*. Unhandled, it crashes the program with a traceback. Handled, it becomes a normal part of the flow.

```python
try:
    number = int("abc")
except ValueError:
    print("That wasn't a number")
```

Catch the **specific** exception you expect. A bare `except:` swallows everything — including bugs you would rather know about.

## The full shape

```python
try:
    f = open("config.json")
except FileNotFoundError:
    print("No config yet, using defaults")
else:
    print("Loaded")      # runs only if no exception happened
finally:
    print("Done")        # runs no matter what — cleanup goes here
```

## Raising your own

Functions should refuse bad input loudly instead of returning nonsense:

```python
def withdraw(balance, amount):
    if amount <= 0:
        raise ValueError("Amount must be positive")
    if amount > balance:
        raise ValueError("Insufficient funds")
    return balance - amount
```

Callers can decide what to do:

```python
try:
    balance = withdraw(balance, 500)
except ValueError as err:
    print("Refused:", err)
```

## Common exceptions you will meet

| Exception | Typical cause |
|---|---|
| `NameError` | using a name that isn't defined (often a typo) |
| `TypeError` | wrong type: `"a" + 1`, calling something that isn't a function |
| `ValueError` | right type, bad value: `int("abc")` |
| `KeyError` | dictionary key that doesn't exist |
| `IndexError` | list index out of range |
| `ZeroDivisionError` | dividing by zero |
| `FileNotFoundError` | opening a path that doesn't exist |
| `AttributeError` | `thing.method()` where thing has no such method |

## Custom exceptions

```python
class OutOfStock(Exception):
    pass

raise OutOfStock("No more wiper blades")
```

Your own exception types let callers catch exactly your errors and nothing else.

> **Python's style is "ask forgiveness, not permission":** try the operation and handle the failure, rather than checking every precondition first.

class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self.balance += amount

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Withdrawal must be positive")
        if amount > self.balance:
            raise ValueError("Insufficient funds")
        self.balance -= amount

    def __str__(self):
        return f"{self.owner}: {self.balance:.2f} kr"


def safe_withdraw(account, amount):
    """Return True if the withdrawal succeeded, False if it was refused."""
    try:
        account.withdraw(amount)
        return True
    except ValueError:
        return False

## Classes: data and behaviour together

A class is a blueprint. Each object built from it has its own data (**attributes**) and shares the same behaviour (**methods**).

```python
class Car:
    wheels = 4                           # class attribute: shared by all cars

    def __init__(self, plate, km=0):     # runs when you create a Car
        self.plate = plate               # instance attributes: this car's data
        self.km = km

    def drive(self, distance):
        self.km += distance
        return self.km

    def __str__(self):                   # what print() shows
        return f"{self.plate} ({self.km} km)"


golf = Car("AB 12345")
golf.drive(120)
print(golf)          # AB 12345 (120 km)
```

`self` is the object the method was called on. Python passes it automatically: `golf.drive(120)` becomes `Car.drive(golf, 120)`.

A `@classmethod` receives the class instead of an instance — handy for alternative constructors like `Inventory.load(path)`. A `@property` makes a method look like an attribute.

## Modules: splitting code across files

Any `.py` file is a module. Import what you need:

```python
import math
print(math.sqrt(16))

from random import randint
print(randint(1, 6))

# your own file inventory.py in the same folder:
from inventory import Inventory
```

Keep code that *defines things* (classes, functions) in modules and code that *runs things* in a `main.py`. The guard below lets a file be both importable and runnable:

```python
if __name__ == "__main__":
    main()
```

## Files

```python
with open("notes.txt", "w") as f:        # "w" write (overwrite), "a" append, "r" read
    f.write("first line\n")

with open("notes.txt") as f:
    for line in f:
        print(line.strip())
```

`with` closes the file for you, even if something goes wrong inside the block. Reading a path that doesn't exist raises `FileNotFoundError`.

## JSON: the universal data format

```python
import json

data = {"ada": 90, "linus": 75}
text = json.dumps(data, indent=2)        # dict -> string
print(text)
back = json.loads(text)                  # string -> dict

with open("scores.json", "w") as f:      # straight to a file
    json.dump(data, f)

with open("scores.json") as f:
    loaded = json.load(f)
```

JSON knows strings, numbers, booleans, `null`, lists and objects (dicts with string keys). Anything else — dates, your own classes — you convert yourself.

> In this browser the files live in a virtual folder that resets when you reload the page. Everything else behaves exactly like on your own machine.

import json


class Item:
    def __init__(self, name, price, quantity):
        self.name = name
        self.price = price
        self.quantity = quantity


class Inventory:
    def __init__(self):
        self.items = {}   # name -> Item

    def add(self, item):
        existing = self.items.get(item.name)
        if existing:
            existing.quantity += item.quantity
        else:
            self.items[item.name] = item

    def remove(self, name, quantity):
        if name not in self.items:
            raise KeyError(name)
        item = self.items[name]
        if quantity > item.quantity:
            raise ValueError(f"Only {item.quantity} {name} in stock")
        item.quantity -= quantity
        if item.quantity == 0:
            del self.items[name]

    def find(self, query):
        q = query.lower()
        hits = [item for item in self.items.values() if q in item.name.lower()]
        return sorted(hits, key=lambda item: item.name)

    def total_value(self):
        return sum(item.price * item.quantity for item in self.items.values())

    def low_stock(self, threshold=5):
        hits = [item for item in self.items.values() if item.quantity < threshold]
        return sorted(hits, key=lambda item: item.name)

    def save(self, path):
        data = [
            {"name": i.name, "price": i.price, "quantity": i.quantity}
            for i in self.items.values()
        ]
        with open(path, "w") as f:
            json.dump(data, f)

    @classmethod
    def load(cls, path):
        inv = cls()
        with open(path) as f:
            for row in json.load(f):
                inv.add(Item(row["name"], row["price"], row["quantity"]))
        return inv

    def report(self):
        lines = [f"{'Item':<20}{'Qty':>5}{'Price':>10}"]
        for item in sorted(self.items.values(), key=lambda i: i.name):
            lines.append(f"{item.name:<20}{item.quantity:>5}{item.price:>10.2f}")
        lines.append(f"Total: {self.total_value():.2f}")
        return "\n".join(lines)

## What happens when you open a page

1. The browser asks a server for a URL.
2. The server answers with an **HTML** document.
3. The browser reads it and builds the **DOM** — a tree of elements it can draw and that JavaScript can change.
4. Linked **CSS** decides how it looks; linked **JavaScript** decides how it behaves.

You write the three languages; the browser combines them.

## HTML is made of elements

```html
<p class="intro">Wiper blades, <strong>fitted while you wait</strong>.</p>
```

- `<p>` is the opening tag, `</p>` the closing tag, everything between is the content.
- `class="intro"` is an **attribute**: extra information on the opening tag.
- Elements nest: the `<strong>` lives inside the `<p>`. Close them in the reverse order you opened them.

A few elements have no content and no closing tag: `<img>`, `<br>`, `<input>`.

## The skeleton every page has

```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Shown in the browser tab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <\!-- everything visible goes here -->
  </body>
</html>
```

`<\!-- -->` is a comment.

## The elements you will use most

| Element | Job |
|---|---|
| `<h1>` … `<h6>` | headings; one `<h1>` per page, then `<h2>` for sections |
| `<p>` | a paragraph |
| `<a href="https://…">` | a link — `href` is where it goes |
| `<img src="photo.jpg" alt="…">` | an image; `alt` describes it for screen readers and when it fails to load |
| `<ul>` `<ol>` `<li>` | unordered / ordered lists and their items |
| `<button>` | something to click |
| `<input>` `<form>` `<label>` | collecting input |
| `<div>` `<span>` | generic boxes (block / inline) when nothing more specific fits |

## Semantic layout elements

Instead of a page of `<div>`s, describe the structure:

```html
<header>  site name, navigation </header>
<nav>     links </nav>
<main>    the page's actual content </main>
<section> a thematic group </section>
<article> a self-contained piece: a post, a product card </article>
<aside>   related but secondary </aside>
<footer>  contact, copyright </footer>
```

Screen readers, search engines and future-you all benefit.

## Attributes worth knowing

- `id="x"` — unique name for one element (JavaScript and CSS use it)
- `class="a b"` — reusable labels; an element can have many
- `alt`, `href`, `src`, `type`, `placeholder`, `disabled`

> **Open the developer tools** in your own browser (F12 or right-click → Inspect) and look at any page's Elements panel. Everything you see there is the DOM you are about to learn to build.

## Connecting CSS to HTML

```html
<link rel="stylesheet" href="style.css">
```

A stylesheet is a list of **rules**. Each rule picks elements with a *selector* and sets *properties*:

```css
h1 {
  color: #1b1f2a;
  font-size: 2rem;
}
```

## Selectors

| Selector | Matches |
|---|---|
| `p` | every `<p>` |
| `.card` | anything with `class="card"` |
| `#main-nav` | the one element with `id="main-nav"` |
| `.card h2` | an `<h2>` anywhere inside `.card` |
| `a:hover` | a link while the mouse is over it |
| `.card, .panel` | either |

When rules conflict, the more specific selector wins (`#id` beats `.class` beats `p`), and among equals the last one written wins.

## The box model

Every element is a box: **content**, wrapped in **padding**, wrapped in a **border**, wrapped in **margin** (space outside).

```css
.card {
  padding: 16px;          /* inside the border */
  border: 1px solid #ddd;
  margin: 24px auto;      /* outside; auto left/right centres a block with a width */
  max-width: 480px;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
}
```

Add this once to every project and widths will behave the way you expect:

```css
* { box-sizing: border-box; }
```

## Colour and type

```css
body {
  font-family: system-ui, sans-serif;
  line-height: 1.5;
  color: #222;
  background: #f5f6f8;
}
```

Colours: named (`tomato`), hex (`#f26a1b`), `rgb(242, 106, 27)`, or with alpha `rgba(0,0,0,.1)`. Sizes: `px` for exact, `rem` for "relative to the base font size" (good for text), `%` for relative to the parent.

## Layout: flexbox

Flexbox lays out children in a row (or column) and makes alignment easy.

```css
nav {
  display: flex;
  justify-content: space-between;   /* spread along the main axis */
  align-items: center;              /* centre on the cross axis */
  gap: 16px;                        /* space between children */
}
.skills { display: flex; flex-wrap: wrap; gap: 8px; }
```

## Layout: grid

Grid is for two dimensions — columns *and* rows.

```css
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* three equal columns */
  gap: 12px;
}
```

## Responsive: react to screen size

```css
@media (max-width: 600px) {
  .gallery { grid-template-columns: 1fr; }
}
```

Rules inside a media query only apply when the condition holds. Start with the mobile layout and add columns as the screen grows, or the reverse — just pick one and be consistent.

## Custom properties

```css
:root { --accent: #f26a1b; }
button { background: var(--accent); }
```

Change the colour in one place, everything updates.

## Where JavaScript goes

```html
<script src="app.js"><\/script>   <\!-- just before </body>, so the page exists when it runs -->
```

Open the browser console (F12 → Console) — `console.log(...)` prints there, and errors show up with line numbers.

## Variables

```js
const taxRate = 0.25;      // cannot be reassigned — use this by default
let total = 0;             // can be reassigned
total = total + 10;
```

Forget `var`; it exists for old code.

## Types and strings

```js
typeof 42          // "number"   (integers and decimals are the same type)
typeof "hi"        // "string"
typeof true        // "boolean"
typeof undefined   // "undefined" — a variable with no value yet
null               // "no value", on purpose

const name = "Ada";
console.log(`Hello, ${name}! Total: ${total * 2}`);   // template literal: backticks + ${}
```

Always compare with `===` (and `!==`). The two-equals version converts types and surprises people: `"5" == 5` is `true`.

## Functions

```js
function greet(name) {
  return `Hello, ${name}`;
}

const double = (n) => n * 2;                 // arrow function: implicit return for one expression
const describe = (item) => {                 // braces when you need statements
  const label = item.name.toUpperCase();
  return `${label}: ${item.price}`;
};
```

## Conditionals and loops

```js
if (score >= 90) {
  grade = "A";
} else if (score >= 80) {
  grade = "B";
} else {
  grade = "F";
}

for (let i = 0; i < 3; i++) { console.log(i); }        // 0 1 2
for (const tool of ["wrench", "jack"]) { console.log(tool); }
while (attempts < 3) { attempts++; }
```

## Arrays

```js
const prices = [120, 899, 249];
prices.push(15);
prices.length;                          // 4
prices.includes(899);                   // true

prices.map(p => p * 1.25);              // new array, each transformed
prices.filter(p => p > 200);            // new array, only those that pass
prices.reduce((sum, p) => sum + p, 0);  // fold into one value: 1283
prices.find(p => p > 200);              // first match or undefined
prices.forEach(p => console.log(p));    // loop with no result
```

`map`, `filter` and `reduce` return new arrays and never change the original. Chain them.

## Objects

```js
const item = { name: "Jack", price: 899, qty: 2 };
item.price;                 // 899
item["name"];               // "Jack"
item.qty = 3;               // update
const { name, price } = item;   // destructuring into variables

for (const [key, value] of Object.entries(item)) { console.log(key, value); }
```

## Common mistakes

- `Uncaught ReferenceError: x is not defined` — typo or the variable isn't in scope.
- `Cannot read properties of undefined` — you called `.something` on a value that doesn't exist yet (often a `querySelector` that found nothing).
- Forgetting `return` in a function with braces.

function cartTotal(items) {
  return items.reduce((sum, item) => sum + item.price * item.qty, 0);
}

function formatPrice(amount) {
  return `$${amount.toFixed(2)}`;
}

function applyDiscount(total, code) {
  const normalized = (code || "").toUpperCase();
  if (normalized === "SAVE10") return total * 0.9;
  if (normalized === "HALF") return total * 0.5;
  return total;
}

function inStock(items) {
  return items.filter(item => item.qty > 0).map(item => item.name);
}

];

## Finding elements

The DOM is the browser's live model of your HTML. JavaScript reads and changes it.

```js
const title = document.querySelector("h1");          // first match, CSS selector syntax
const button = document.querySelector("#add");       // by id
const items = document.querySelectorAll(".item");    // all matches (a NodeList — loop with forEach or for...of)
```

`querySelector` returns `null` when nothing matches. Guard against it while you're getting a page set up.

## Reading and changing content

```js
title.textContent = "Inventory";          // text only — safe for anything a user typed
title.innerHTML = "<em>Inventory</em>";   // parses HTML — never put user input here
input.value                               // what's typed in an <input>
img.src = "photo.jpg";                    // attributes are properties
el.classList.add("done");                 // add / remove / toggle / contains
el.style.color = "tomato";                // inline style (prefer classes)
el.dataset.id                             // data-id="…" attributes
```

## Creating and removing elements

```js
const li = document.createElement("li");
li.textContent = "Torch";
list.append(li);          // add to the end (prepend for the start)
li.remove();              // delete it
list.innerHTML = "";      // empty a container
```

## Events

```js
button.addEventListener("click", () => {
  count += 1;
  render();
});

input.addEventListener("input", (event) => {
  console.log(event.target.value);   // the element that fired the event
});

form.addEventListener("submit", (event) => {
  event.preventDefault();            // stop the page from reloading
  addTask(input.value);
});
```

Listen for `click` on buttons, `input` on text fields as the user types, `change` on selects and checkboxes, `submit` on forms, `keydown` for keyboard shortcuts.

## The state → render pattern

Keep your data in plain JavaScript variables and write one function that draws the page from that data. Events change the data and call `render()`. This scales from a counter to a whole app.

```js
let tasks = [];

function render() {
  list.innerHTML = "";
  for (const task of tasks) {
    const li = document.createElement("li");
    li.textContent = task.title;
    li.classList.toggle("done", task.done);
    list.append(li);
  }
  remaining.textContent = tasks.filter(t => !t.done).length;
}
```

## Event delegation

Instead of a listener per item, put one on the container and look at `event.target`:

```js
list.addEventListener("click", (event) => {
  const li = event.target.closest("li");
  if (!li) return;
  toggle(li.dataset.id);
});
```

This keeps working for elements you add later.

const form = document.querySelector("#task-form");
const input = document.querySelector("#new-task");
const list = document.querySelector("#tasks");
const remaining = document.querySelector("#remaining");

let tasks = [];   // { title: "...", done: false }

function render() {
  list.innerHTML = "";
  tasks.forEach((task, index) => {
    const li = document.createElement("li");
    li.textContent = task.title;
    li.dataset.index = index;
    li.classList.toggle("done", task.done);
    list.append(li);
  });
  remaining.textContent = tasks.filter(t => !t.done).length;
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const title = input.value.trim();
  if (!title) return;
  tasks.push({ title, done: false });
  input.value = "";
  render();
});

list.addEventListener("click", (event) => {
  const li = event.target.closest("li");
  if (!li) return;
  const task = tasks[Number(li.dataset.index)];
  task.done = !task.done;
  render();
});

render();

## Some things take time

Reading a file, asking a server, waiting for a timer — the browser refuses to freeze the page while it waits. Instead the work runs *asynchronously*: you hand over a function to call **later**.

```js
setTimeout(() => console.log("two seconds later"), 2000);
console.log("this prints first");
```

## Promises

A **Promise** is an object standing in for a value that isn't ready yet. It will either *resolve* with the value or *reject* with an error.

```js
fetch("/api/users")
  .then(response => response.json())
  .then(users => console.log(users))
  .catch(error => console.error("Failed:", error));
```

Each `.then` runs when the previous step finishes and passes its result along.

## async / await: the readable version

```js
async function loadUsers() {
  try {
    const response = await fetch("/api/users");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const users = await response.json();
    return users;
  } catch (error) {
    console.error("Failed:", error);
    return [];
  }
}
```

- `await` pauses *this function* until the promise settles, without freezing the page.
- `await` only works inside a function marked `async`.
- An `async` function always returns a promise — so callers `await loadUsers()` too.

## fetch and JSON

`fetch(url)` sends an HTTP request and resolves with a `Response`. `response.json()` parses the body — it is *also* asynchronous. A 404 does **not** reject the promise; check `response.ok` yourself.

Sending data:

```js
await fetch("/api/todos", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ title: "Buy oil" }),
});
```

## The UI pattern

1. Show a loading state.
2. Await the data.
3. Render it — or render the error.

```js
status.textContent = "Loading…";
const users = await loadUsers();
render(users);
status.textContent = `Loaded ${users.length} users`;
```

## CORS, in one paragraph

Browsers only let a page call servers that explicitly allow it (via the `Access-Control-Allow-Origin` header). When a `fetch` to someone else's API fails with a CORS error, it isn't your code — the server hasn't opted in. You'll learn to set that header in the backend track.

> This sandbox can't reach the internet, so the next task gives you `fakeFetch`, a stand-in that behaves like `fetch` but answers from memory after a short delay.

const board = document.querySelector(".board");
const form = document.querySelector("#new-card");
const input = document.querySelector("#card-title");

const ORDER = ["todo", "doing", "done"];
let cards = [];       // { id, title, status }
let nextId = 1;

function render() {
  for (const status of ORDER) {
    const column = board.querySelector(`.column[data-status="${status}"]`);
    const list = column.querySelector(".cards");
    const inColumn = cards.filter(c => c.status === status);
    list.innerHTML = "";
    for (const card of inColumn) {
      const li = document.createElement("li");
      li.className = "card";
      li.dataset.id = card.id;

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = card.title;
      li.append(title);

      if (status !== "done") {
        const move = document.createElement("button");
        move.className = "move";
        move.textContent = "→";
        move.title = "Move to next column";
        li.append(move);
      }

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "✕";
      del.title = "Delete";
      li.append(del);

      list.append(li);
    }
    column.querySelector(".count").textContent = inColumn.length;
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const title = input.value.trim();
  if (!title) return;
  cards.push({ id: nextId++, title, status: "todo" });
  input.value = "";
  render();
});

board.addEventListener("click", (event) => {
  const cardEl = event.target.closest(".card");
  if (!cardEl) return;
  const card = cards.find(c => c.id === Number(cardEl.dataset.id));
  if (!card) return;

  if (event.target.closest(".move")) {
    const next = ORDER[ORDER.indexOf(card.status) + 1];
    if (next) card.status = next;
  } else if (event.target.closest(".delete")) {
    cards = cards.filter(c => c !== card);
  }
  render();
});

render();

## Client, server, and the conversation between them

Every backend does the same job: receive a **request**, do some work, send back a **response**. HTTP is the protocol both sides agree on.

A request has four parts:

```text
POST /todos HTTP/1.1              <- method and path
Host: api.example.com             <- headers: metadata
Content-Type: application/json
                                  <- blank line
{"title": "Order brake pads"}     <- body (optional)
```

A response mirrors it:

```text
HTTP/1.1 201 Created
Content-Type: application/json

{"id": 7, "title": "Order brake pads", "done": false}
```

The server keeps no memory of the conversation between requests — HTTP is **stateless**. Anything that must survive between requests lives in a database, a session store, or the token the client sends along.

## Methods: the verbs

| Method | Meaning | Body? | Safe to retry? |
|---|---|---|---|
| `GET` | read data | no | yes |
| `POST` | create something new | yes | no — retrying creates duplicates |
| `PUT` | replace something entirely | yes | yes |
| `PATCH` | change part of something | yes | usually |
| `DELETE` | remove something | no | yes |

"Safe to retry" is called **idempotency**: sending the same `DELETE /todos/7` twice leaves the world in the same state.

## Status codes: the one-glance answer

| Code | Meaning | When |
|---|---|---|
| `200 OK` | here's your data | successful reads and updates |
| `201 Created` | made it | successful `POST` |
| `204 No Content` | done, nothing to say | successful `DELETE` |
| `301` / `302` | it moved | redirects |
| `400 Bad Request` | your request makes no sense | validation failures |
| `401 Unauthorized` | who are you? | missing/bad credentials |
| `403 Forbidden` | I know who you are — no | permissions |
| `404 Not Found` | no such thing | wrong path or id |
| `405 Method Not Allowed` | not that verb here | `DELETE /todos` on a collection |
| `409 Conflict` | can't, current state forbids it | buying more stock than exists |
| `500 Internal Server Error` | we crashed | your bug, not theirs |

Rule of thumb: **4xx — the client got it wrong. 5xx — the server did.**

## REST: naming things sensibly

REST is a set of conventions for shaping URLs and verbs around **resources** (nouns), not actions:

```text
GET    /books           list books
POST   /books           create a book
GET    /books/42        one book
PUT    /books/42        replace it
DELETE /books/42        remove it
GET    /books?author=le+guin&sort=title     filtering via query string
```

Not `GET /getBooks` or `POST /deleteBook` — the verb is already in the method.

Path parameters (`/books/42`) identify a resource; query parameters (`?author=…`) filter or modify a listing.

## JSON in, JSON out

Modern APIs speak JSON both ways, declared with `Content-Type: application/json`. Try one from a terminal:

```bash
curl -X POST https://api.example.com/todos \
  -H "Content-Type: application/json" \
  -d '{"title": "Order brake pads"}'
```

> You'll build exactly this shape of API in the next task — first as a plain Python function, so nothing hides how requests map to responses. Frameworks come later; they wrap this pattern, they don't replace it.

TODOS = []
_id_counter = 0


def next_id():
    global _id_counter
    _id_counter += 1
    return _id_counter


def find_todo(todo_id):
    for todo in TODOS:
        if todo["id"] == todo_id:
            return todo
    return None


def handle_request(method, path, body=None):
    """Return a (status, data) tuple for the to-do API."""
    parts = [p for p in path.split("/") if p]

    if parts == ["todos"]:
        if method == "GET":
            return (200, TODOS)
        if method == "POST":
            title = (body or {}).get("title")
            if not title:
                return (400, {"error": "title is required"})
            todo = {"id": next_id(), "title": title, "done": False}
            TODOS.append(todo)
            return (201, todo)
        return (405, {"error": "method not allowed"})

    if len(parts) == 2 and parts[0] == "todos" and parts[1].isdigit():
        todo = find_todo(int(parts[1]))
        if todo is None:
            return (404, {"error": "not found"})
        if method == "GET":
            return (200, todo)
        if method == "PATCH":
            if body and "done" in body:
                todo["done"] = bool(body["done"])
            return (200, todo)
        if method == "DELETE":
            TODOS.remove(todo)
            return (204, None)
        return (405, {"error": "method not allowed"})

    return (404, {"error": "not found"})


print(handle_request("POST", "/todos", {"title": "Order brake pads"}))
print(handle_request("GET", "/todos"))

## Why a database and not a file?

A JSON file works until two requests write it at the same time, or it grows past what fits in memory, or you need "all orders from Oslo over 500 kr, newest first" without reading everything. Databases exist to make those things safe and fast: **transactions** (all-or-nothing changes), **indexes** (fast lookups), and a **query language** so the database does the searching.

**SQLite** is a full SQL database in a single file, built into Python. It's what you'll use here, and it's genuinely what many production apps ship with.

## Tables, rows, columns

```sql
CREATE TABLE customers (
  id    INTEGER PRIMARY KEY,
  name  TEXT NOT NULL,
  city  TEXT
);
```

A **primary key** uniquely identifies each row. Other tables point at it with a **foreign key** — `orders.customer_id` refers to `customers.id`. That link is what makes it *relational*.

## The queries you'll write every week

```sql
INSERT INTO customers (name, city) VALUES ('Ada', 'Oslo');

SELECT * FROM customers;
SELECT name, city FROM customers WHERE city = 'Oslo';
SELECT * FROM orders WHERE amount > 100 ORDER BY amount DESC LIMIT 5;

UPDATE customers SET city = 'Bergen' WHERE id = 2;
DELETE FROM orders WHERE id = 7;
```

`WHERE` filters rows, `ORDER BY … DESC` sorts, `LIMIT` caps. Without a `WHERE`, `UPDATE` and `DELETE` hit **every row** — the classic Friday-afternoon incident.

## Aggregates: let the database count

```sql
SELECT COUNT(*) FROM orders;
SELECT SUM(amount) FROM orders;
SELECT city, SUM(amount) AS total
FROM customers JOIN orders ON orders.customer_id = customers.id
GROUP BY city
ORDER BY total DESC;
```

`GROUP BY` collapses rows that share a value so aggregates run per group. `JOIN … ON` stitches two tables together where the keys match.

## SQLite from Python

```python
import sqlite3

conn = sqlite3.connect(":memory:")        # or "shop.db" for a real file
conn.execute("CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, price REAL)")
conn.execute("INSERT INTO items (name, price) VALUES (?, ?)", ("Jack", 899.0))
conn.commit()

rows = conn.execute("SELECT name, price FROM items WHERE price > ?", (100,)).fetchall()
for name, price in rows:                  # each row is a tuple
    print(name, price)

one = conn.execute("SELECT COUNT(*) FROM items").fetchone()
print(one[0])                             # fetchone() -> a single tuple or None
```

The `?` placeholders are **parameters** — the only correct way to put Python values into SQL. Never build queries with f-strings; the security module shows you exactly why.

## Indexes, in one paragraph

`CREATE INDEX idx_orders_customer ON orders(customer_id);` builds a lookup structure so filtering by that column stops being a full-table scan. Index the columns you search and join on; every index slightly slows writes, so don't index everything.

> Real projects version their schema with **migrations** (numbered scripts that evolve the database) and often wrap SQL in an **ORM** like SQLAlchemy or Prisma. Learn raw SQL first — it's what the ORM generates, and what you'll read when things go slow.

import sqlite3


def setup(conn):
    conn.executescript("""
        CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);
        CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);
        INSERT INTO customers VALUES
            (1, 'Ada', 'Oslo'), (2, 'Linus', 'Bergen'),
            (3, 'Grace', 'Oslo'), (4, 'Ken', 'Trondheim');
        INSERT INTO orders (customer_id, amount) VALUES
            (1, 120.0), (1, 80.0), (2, 300.0), (3, 50.0),
            (3, 75.5), (4, 20.0), (2, 10.0);
    """)


def total_revenue(conn):
    """Sum of all order amounts."""
    return conn.execute("SELECT SUM(amount) FROM orders").fetchone()[0]


def orders_by_city(conn):
    """[(city, total), ...] highest total first."""
    return conn.execute("""
        SELECT c.city, SUM(o.amount) AS total
        FROM customers c JOIN orders o ON o.customer_id = c.id
        GROUP BY c.city
        ORDER BY total DESC
    """).fetchall()


def top_customers(conn, n):
    """[(name, total), ...] for the n biggest spenders, highest first."""
    return conn.execute("""
        SELECT c.name, SUM(o.amount) AS total
        FROM customers c JOIN orders o ON o.customer_id = c.id
        GROUP BY c.id
        ORDER BY total DESC
        LIMIT ?
    """, (n,)).fetchall()


def add_order(conn, customer_id, amount):
    """Insert an order with ? parameters; return the new id."""
    cursor = conn.execute(
        "INSERT INTO orders (customer_id, amount) VALUES (?, ?)",
        (customer_id, amount),
    )
    conn.commit()
    return cursor.lastrowid


conn = sqlite3.connect(":memory:")
setup(conn)
print("Revenue:", total_revenue(conn))
print("By city:", orders_by_city(conn))
print("Top 2:", top_customers(conn, 2))

## Rule zero: never store the password

When someone registers, you must be able to *check* their password later without being able to *read* it. That's what a **hash** is: a one-way fingerprint. Same input → same hash; hash → input is computationally infeasible.

```python
import hashlib
hashlib.sha256("hunter2".encode()).hexdigest()
# 'f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7'
```

Verification is: hash what they typed, compare fingerprints. If your database leaks, attackers get fingerprints, not passwords.

## Salt: same password, different hash

Without salt, everyone using `hunter2` shares a hash, and attackers use precomputed tables to reverse common ones. A **salt** is a random value stored *next to* the hash and mixed into it, so every user's hash is unique:

```python
import secrets
salt = secrets.token_hex(16)                 # cryptographically random
digest = hashlib.sha256((salt + password).encode()).hexdigest()
stored = f"{salt}${digest}"                  # store both, e.g. "a41f…$9c2e…"
```

`secrets` is the random module for security; plain `random` is predictable.

One more upgrade for production: sha256 is *fast*, and fast is bad here — attackers can try billions of guesses per second. Real systems use deliberately slow hashes: **bcrypt**, **argon2**, or `hashlib.pbkdf2_hmac`. The salt-and-verify structure you build in the next task is identical; only the hash function swaps out.

## Sessions and tokens: staying logged in

HTTP forgets you between requests, so after login the server hands the client something to show next time:

- **Session cookie** — the server stores "session `a8f3` = user 42" and the browser sends the cookie automatically. Easy to revoke; server keeps state.
- **Token (JWT)** — the server signs `{"user": 42, "exp": …}` into a token the client sends in an `Authorization: Bearer …` header. The server verifies the signature instead of looking anything up; stateless, but revocation is harder.

Either way: **401** when credentials are missing or wrong, **403** when the user is known but not allowed.

## SQL injection: the classic

Build queries by gluing strings and users can rewrite your SQL:

```python
# NEVER do this
conn.execute(f"SELECT * FROM users WHERE name = '{username}'")
```

If `username` is `' OR '1'='1`, the query becomes `WHERE name = '' OR '1'='1'` — true for every row. Log in as anyone; with a `;` they can do worse. The fix is the parameter placeholder, which sends the value *separately* from the SQL so it can never become code:

```python
conn.execute("SELECT * FROM users WHERE name = ?", (username,))
```

## The rest of the checklist

- **Validate input** at the boundary: types, lengths, ranges. Reject with `400` and a clear error.
- **XSS**: never insert user text into HTML with `innerHTML` — that's injection in the browser.
- **HTTPS always** — otherwise passwords and cookies cross the network readable.
- **Secrets in environment variables**, never in code or git.
- **Rate-limit** login endpoints; attackers script them.

import hashlib
import secrets


def hash_password(password):
    """Return 'salt$hash' with a fresh random salt."""
    salt = secrets.token_hex(16)
    digest = hashlib.sha256((salt + password).encode()).hexdigest()
    return f"{salt}${digest}"


def verify_password(password, stored):
    """True if password matches the stored 'salt$hash'."""
    salt, expected = stored.split("$", 1)
    digest = hashlib.sha256((salt + password).encode()).hexdigest()
    return digest == expected


stored = hash_password("hunter2")
print(stored)
print(verify_password("hunter2", stored))
print(verify_password("wrong", stored))

import sqlite3


def setup(conn):
    conn.executescript("""
        CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, email TEXT);
        INSERT INTO users (name, email) VALUES
            ('ada', 'ada@example.com'),
            ('grace', 'grace@example.com');

    """Safe: the value travels separately from the SQL."""
    return conn.execute(
        "SELECT name, email FROM users WHERE name = ?", (username,)
    ).fetchone()


def create_user(conn, username, email):
    """Insert a user with parameters; validate first."""
    if not username or not username.strip():
        raise ValueError("username is required")
    if "@" not in email:
        raise ValueError("invalid email")
    cursor = conn.execute(
        "INSERT INTO users (name, email) VALUES (?, ?)", (username, email)
    )
    conn.commit()
    return cursor.lastrowid


conn = sqlite3.connect(":memory:")
setup(conn)

## You already wrote a framework's core

Your `handle_request(method, path, body)` from module 1 *is* what web frameworks do — they parse the raw HTTP for you, route to your function, and serialise your return value. Compare the same to-do API in two popular frameworks.

## FastAPI (Python)

```python
from fastapi import FastAPI, HTTPException
from pydantic import BaseModel

app = FastAPI()
TODOS = []

class TodoIn(BaseModel):
    title: str

@app.get("/todos")
def list_todos():
    return TODOS

@app.post("/todos", status_code=201)
def create_todo(todo: TodoIn):
    new = {"id": len(TODOS) + 1, "title": todo.title, "done": False}
    TODOS.append(new)
    return new

@app.get("/todos/{todo_id}")
def get_todo(todo_id: int):
    for t in TODOS:
        if t["id"] == todo_id:
            return t
    raise HTTPException(404, "not found")
```

Run it with `uvicorn main:app --reload` and FastAPI also generates interactive docs at `/docs`. The `BaseModel` gives you validation for free: a request without `title` becomes a 422 before your code runs. (Flask is the older, smaller sibling — same idea, `@app.route("/todos")` and you handle validation yourself.)

## Express (JavaScript / Node)

```js
const express = require("express");
const app = express();
app.use(express.json());

const TODOS = [];

app.get("/todos", (req, res) => res.json(TODOS));

app.post("/todos", (req, res) => {
  if (!req.body.title) return res.status(400).json({ error: "title is required" });
  const todo = { id: TODOS.length + 1, title: req.body.title, done: false };
  TODOS.push(todo);
  res.status(201).json(todo);
});

app.listen(3000);
```

Same verbs, same status codes, same shape. Pick the language your team already writes.

## What production adds around this

- **Environment variables** for anything that differs between machines: `DATABASE_URL`, `SECRET_KEY`, `PORT`. Read them with `os.environ` / `process.env`; keep a `.env` file locally and out of git.
- **Logging** — every request, every error, with timestamps. When something breaks at 02:00, logs are all you have.
- **A health check** — a `GET /health` returning 200, so load balancers and uptime monitors know you're alive.
- **A reverse proxy** (nginx, Caddy) or the platform's router terminates HTTPS in front of your app.
- **Docker** wraps your app and its exact dependencies into an image that runs the same everywhere: a `Dockerfile` lists the steps (`FROM python:3.12`, `COPY`, `RUN pip install…`, `CMD`), and hosts run the image.
- **Hosting** — platforms like Fly.io, Railway and Render take a repo or an image, set env vars in their dashboard, and give you a URL. Deployment is `git push`.

> The capstone next: the module-1 handler pattern plus the module-2 database plus the module-3 validation — one API, cleanly split across files.

@@ be-5-1.solution.api.py
def row_to_book(row):
    """(id, title, author, price, stock) -> dict."""
    return {
        "id": row[0], "title": row[1], "author": row[2],
        "price": row[3], "stock": row[4],
    }


def validate(body):
    """Return an error string, or None if the body is a valid book."""
    body = body or {}
    title = body.get("title")
    author = body.get("author")
    price = body.get("price")
    stock = body.get("stock")
    if not isinstance(title, str) or not title.strip():
        return "title is required"
    if not isinstance(author, str) or not author.strip():
        return "author is required"
    if not isinstance(price, (int, float)) or isinstance(price, bool) or price < 0:
        return "price must be a number >= 0"
    if not isinstance(stock, int) or isinstance(stock, bool) or stock < 0:
        return "stock must be an integer >= 0"
    return None


def get_book(conn, book_id):
    row = conn.execute(
        "SELECT id, title, author, price, stock FROM books WHERE id = ?",
        (book_id,),
    ).fetchone()
    return row_to_book(row) if row else None


def handle_request(conn, method, path, body=None):
    """Route a request to the right SQL and return (status, data)."""
    path, _, query = path.partition("?")
    parts = [p for p in path.split("/") if p]

    if parts == ["books"]:
        if method == "GET":
            if query.startswith("author="):
                author = query[len("author="):].replace("+", " ")
                rows = conn.execute(
                    "SELECT id, title, author, price, stock FROM books "
                    "WHERE LOWER(author) = LOWER(?) ORDER BY id",
                    (author,),
                ).fetchall()
            else:
                rows = conn.execute(
                    "SELECT id, title, author, price, stock FROM books ORDER BY id"
                ).fetchall()
            return (200, [row_to_book(r) for r in rows])
        if method == "POST":
            error = validate(body)
            if error:
                return (400, {"error": error})
            cursor = conn.execute(
                "INSERT INTO books (title, author, price, stock) VALUES (?, ?, ?, ?)",
                (body["title"], body["author"], body["price"], body["stock"]),
            )
            conn.commit()
            return (201, get_book(conn, cursor.lastrowid))
        return (405, {"error": "method not allowed"})

    if len(parts) >= 2 and parts[0] == "books" and parts[1].isdigit():
        book_id = int(parts[1])
        book = get_book(conn, book_id)

        if len(parts) == 3 and parts[2] == "purchase" and method == "POST":
            if book is None:
                return (404, {"error": "not found"})
            quantity = (body or {}).get("quantity")
            if not isinstance(quantity, int) or isinstance(quantity, bool) or quantity < 1:
                return (400, {"error": "quantity must be an integer >= 1"})
            if book["stock"] < quantity:
                return (409, {"error": "insufficient stock"})
            conn.execute(
                "UPDATE books SET stock = stock - ? WHERE id = ?",
                (quantity, book_id),
            )
            conn.commit()
            return (200, get_book(conn, book_id))

        if len(parts) == 2:
            if book is None:
                return (404, {"error": "not found"})
            if method == "GET":
                return (200, book)
            if method == "PUT":
                error = validate(body)
                if error:
                    return (400, {"error": error})
                conn.execute(
                    "UPDATE books SET title = ?, author = ?, price = ?, stock = ? "
                    "WHERE id = ?",
                    (body["title"], body["author"], body["price"], body["stock"], book_id),
                )
                conn.commit()
                return (200, get_book(conn, book_id))
            if method == "DELETE":
                conn.execute("DELETE FROM books WHERE id = ?", (book_id,))
                conn.commit()
                return (204, None)
            return (405, {"error": "method not allowed"})

    return (404, {"error": "not found"})

## Counting the work, not the seconds

Two correct programs can differ absurdly in speed. **Big O** notation describes how the amount of work grows as the input grows — the shape of the cost, ignoring constants.

| Growth | Name | Feel at n = 1,000,000 |
|---|---|---|
| `O(1)` | constant | instant, always |
| `O(log n)` | logarithmic | ~20 steps |
| `O(n)` | linear | a million steps — fine |
| `O(n log n)` | linearithmic | ~20 million — still fine |
| `O(n²)` | quadratic | a trillion — minutes to hours |
| `O(2ⁿ)` | exponential | forget it past n ≈ 40 |

## Reading code for its shape

```python
def total(prices):            # O(n): one pass
    result = 0
    for p in prices:
        result += p
    return result

def has_duplicate(items):     # O(n²): a pass inside a pass
    for i in range(len(items)):
        for j in range(i + 1, len(items)):
            if items[i] == items[j]:
                return True
    return False

def has_duplicate_fast(items):   # O(n): one pass + O(1) set lookups
    seen = set()
    for item in items:
        if item in seen:
            return True
        seen.add(item)
    return False
```

A loop over the input is `O(n)`. A loop *inside* a loop over the same input is `O(n²)`. Halving the problem each step — like binary search — is `O(log n)`.

## The lookup table every Python dev carries around

| Operation | Cost |
|---|---|
| `my_list[i]`, `my_list.append(x)` | O(1) |
| `x in my_list`, `my_list.remove(x)` | O(n) — scans |
| `x in my_set`, `my_dict[key]` | O(1) — hashed |
| `my_list.insert(0, x)` | O(n) — shifts everything |
| `sorted(my_list)` | O(n log n) |

The single most common real-world fix: a membership test inside a loop using a **list** (`O(n²)` overall) rewritten with a **set** (`O(n)`). Same code shape, thousand-fold speedup.

## Space counts too

`seen = set()` above trades `O(n)` extra memory for the speed. Most optimisations are exactly this trade; name it when you make it.

> Big O is a ceiling for *growth*, not a stopwatch. For n = 10, the "slow" version is often faster and clearer. Reach for the analysis when inputs can get big — which, in real systems, they eventually do.

def binary_search(items, target):
    """Return the index of target in the sorted list, or -1."""
    low = 0
    high = len(items) - 1
    while low <= high:
        mid = (low + high) // 2
        value = items[mid]
        if value == target:
            return mid
        if value < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1


print(binary_search([1, 3, 5, 7, 9, 11], 7))    # 3
print(binary_search([1, 3, 5, 7, 9, 11], 4))    # -1

## Stack: last in, first out

A stack is a pile — you only touch the top. Python lists already are one:

```python
stack = []
stack.append("a")     # push
stack.append("b")
top = stack.pop()     # "b" — pop returns the most recent
```

Undo history, the browser's back button, matching brackets, and the *call stack* your functions live on — all stacks. When you see "most recent thing first", think stack.

## Queue: first in, first out

A queue is a line at the till. `list.pop(0)` works but is O(n); use `deque`:

```python
from collections import deque
queue = deque()
queue.append("first")        # join the back
queue.append("second")
next_up = queue.popleft()    # "first" — O(1)
```

Print jobs, message processing, breadth-first search. "Fairness / arrival order" → queue.

## Hash maps: why dict is O(1)

A dict runs the key through a **hash function** to compute *where* the value sits, so lookup doesn't scan — it jumps. That's why `in` on a dict or set is O(1) while `in` on a list is O(n), and why keys must be immutable (strings, numbers, tuples — not lists).

```python
index = {}
for i, word in enumerate(words):
    index.setdefault(word, []).append(i)   # word -> every position it appears
```

Grouping, counting, caching, de-duplicating: hash maps are the answer to most "make it faster" questions.

## Recursion: functions that call themselves

A recursive function solves a problem by solving a smaller version of it, until the version is trivial.

```python
def countdown(n):
    if n == 0:            # base case: where it stops
        print("Lift off")
        return
    print(n)
    countdown(n - 1)      # recursive case: smaller problem
```

Two rules: there must be a **base case**, and every call must move **toward** it. Miss either and you get `RecursionError: maximum recursion depth exceeded` — the call stack's polite version of an infinite loop.

Recursion shines on recursive *data*: trees, nested folders, JSON of unknown depth.

## Memoization: don't solve the same subproblem twice

Naive recursive Fibonacci recomputes the same values exponentially many times:

```python
def fib(n):                      # O(2^n) — fib(35) already crawls
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
```

Cache results and it collapses to O(n):

```python
from functools import lru_cache

@lru_cache(maxsize=None)
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
```

Or skip recursion entirely and iterate with two variables. You'll do both in the next tasks — and *measure* the difference.

def is_balanced(text):
    """True if all (), [] and {} in text are balanced."""
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for char in text:
        if char in "([{":
            stack.append(char)
        elif char in pairs:
            if not stack or stack[-1] != pairs[char]:
                return False
            stack.pop()
    return len(stack) == 0


print(is_balanced("(a[b]{c})"))   # True
print(is_balanced("(]"))          # False
