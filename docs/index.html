[data-theme=light]{
--ground:#F4F6F1;
--surface:rgba(255,255,255,0.88);
--surface-solid:#FFFFFF;
--surface-2:rgba(15,20,10,0.02);

--head:rgba(255,255,255,0.72);
--editor:#12151A;

--ink:#131712;

--ink-3:#616B59;
--ink-4:#69725F;

--line:rgba(15,25,5,0.09);
--line-2:rgba(15,25,5,0.14);
--line-3:rgba(15,25,5,0.22);
--lime:#5F8A0B;
--lime-hi:#4C7005;
--lime-deep:#87C22A;
--on-lime:#0A0C07;
--lime-05:rgba(95,138,11,0.05);
--lime-08:rgba(95,138,11,0.09);
--lime-12:rgba(95,138,11,0.13);
--lime-22:rgba(95,138,11,0.22);
--lime-30:rgba(95,138,11,0.32);
--lime-glow:0 0 12px rgba(135,194,42,0.35);
--blue:#2C5BD0; --purple:#6D48C7; --amber:#8A5A12; --rose:#C1373F;
--sky:#0B6382;
--teal:#0B6B5E;
--pink:#A81F6B;
--blue-12:rgba(44,91,208,0.10);
--blue-28:rgba(44,91,208,0.28);
--purple-12:rgba(109,72,199,0.10);
--purple-28:rgba(109,72,199,0.28);
--amber-08:rgba(138,90,18,0.08);
--amber-22:rgba(138,90,18,0.22);
--sky-12:rgba(11,99,130,0.10);
--sky-28:rgba(11,99,130,0.28);
--teal-12:rgba(11,107,94,0.10);
--teal-28:rgba(11,107,94,0.28);
--pink-12:rgba(168,31,107,0.10);
--pink-28:rgba(168,31,107,0.28);

--bad-28:rgba(193,55,63,0.28);
--bad-32:rgba(193,55,63,0.32);
--code-ink:#3F6212;
--link:#4C7005;
--accent-ink:#4C7005;
--on-avatar:#FFFFFF;
--mark-idle:#8C8C8C;
--bad:#C1373F;
color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
background:var(--ground);color:var(--ink);
font-family:var(--sans);font-size:var(--t-body);line-height:1.6;
-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
button[aria-disabled=true],.is-busy{cursor:default;opacity:.5}
a{color:var(--accent-ink);text-decoration:none}
a:hover{color:var(--lime-hi)}
::selection{background:rgba(199,247,81,0.25)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ed-ta:focus-visible{outline:none}
code,pre,kbd{font-family:var(--mono)}
[hidden]{display:none!important}
input{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:10px;border:3px solid var(--ground)}
::-webkit-scrollbar-track{background:transparent}
[data-theme=light] ::-webkit-scrollbar-thumb{background:rgba(15,25,5,0.16)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{from{stroke-dashoffset:999}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes barGrow{from{width:0}}
.app{display:grid;grid-template-columns:var(--rail-icon) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;position:relative;overflow:hidden}
.skip{position:absolute;left:8px;top:-60px;z-index:20;height:34px;display:inline-flex;align-items:center;
padding:0 14px;border-radius:var(--r);font-size:var(--t-ui);font-weight:600;
background:var(--lime);color:var(--on-lime);text-decoration:none;
transition:top .16s var(--ease)}
.skip:focus{top:8px}
.skip:hover{color:var(--on-lime)}
#main:focus{outline:none}
.blob{position:absolute;pointer-events:none;z-index:0}
.blob.a{top:-260px;left:180px;width:820px;height:520px;filter:blur(30px);
background:radial-gradient(ellipse at center,rgba(199,247,81,0.10),transparent 62%);
animation:drift 22s ease-in-out infinite}
.blob.b{bottom:-300px;right:-120px;width:760px;height:600px;filter:blur(40px);
background:radial-gradient(ellipse at center,rgba(110,155,255,0.10),transparent 62%);
animation:drift 28s ease-in-out infinite reverse}
[data-theme=light] .blob{opacity:.55}
.iconrail{
grid-row:1/-1;width:var(--rail-icon);border-right:1px solid var(--line);
background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;gap:22px;
position:relative;z-index:6;
}
.logo{
width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
background:linear-gradient(150deg,var(--lime),var(--lime-deep));
box-shadow:0 6px 22px color-mix(in srgb,var(--lime) 30%,transparent);
animation:popIn .5s var(--pop) both;
}
.logo span{font-family:var(--mono);font-weight:700;font-size:var(--t-title);color:var(--on-lime)}
.iconnav{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.inav{
position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
color:var(--ink-4);transition:color .18s,background .18s;
}
.inav:hover{color:var(--ink);background:rgba(255,255,255,0.05)}
[data-theme=light] .inav:hover{background:rgba(15,25,5,0.06)}
.inav.active{color:var(--accent-ink);background:var(--lime-22)}
.inav.active::before{
content:"";position:absolute;left:-17px;top:50%;transform:translateY(-50%);
width:2px;height:20px;border-radius:2px;background:var(--lime);
box-shadow:0 0 10px color-mix(in srgb,var(--lime) 80%,transparent);
}
.inav svg{width:19px;height:19px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail-foot .div{width:30px;height:1px;background:var(--line-2)}
.avatar{
width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
background:linear-gradient(140deg,var(--blue),var(--purple));
font-size:var(--t-meta);font-weight:600;color:var(--on-avatar);border:1px solid var(--line-3);
cursor:pointer;flex:none;
}
.avatar[aria-current]{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--lime)}
.frame{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--topbar-h) auto auto minmax(0,1fr) auto;min-width:0;min-height:0;position:relative;z-index:2}
.topbar{
height:var(--topbar-h);display:flex;align-items:center;gap:var(--topbar-gap);padding:0 var(--topbar-pad);
border-bottom:1px solid var(--line);background:var(--head);
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.screen-id{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.screen-id b{font-size:var(--t-read);font-weight:600;letter-spacing:-.01em;white-space:nowrap;
min-width:0;overflow:hidden;text-overflow:ellipsis}
.screen-id span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.search{
display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;width:220px;
border-radius:var(--r);border:1px solid var(--line-2);background:rgba(255,255,255,0.03);
}
[data-theme=light] .search{background:rgba(15,25,5,0.03)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:var(--t-ui)}
.search input::placeholder{color:var(--ink-4)}
.search .kbd{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);border:1px solid var(--line-2);border-radius:4px;padding:1px 4px}
.search-wrap{position:relative}
.omni-list{position:absolute;top:calc(100% + 6px);right:0;width:min(460px,calc(100vw - 40px));z-index:30;
padding:6px;border-radius:var(--r-md);border:1px solid var(--line-3);background:var(--surface-solid);
box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:min(60vh,520px);overflow-y:auto;animation:fadeIn .12s both}
[data-theme=light] .omni-list{box-shadow:0 18px 50px rgba(15,25,5,.16)}
.omni-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:var(--r);
background:none;color:var(--ink-2);text-align:left;cursor:pointer;font:inherit}
.omni-opt:hover,.omni-opt.on{background:var(--lime-08);color:var(--ink)}
.omni-opt .chip{flex:none;min-width:60px;justify-content:center}
.omni-t{display:flex;flex-direction:column;min-width:0;gap:1px}
.omni-t b{font-weight:600;font-size:var(--t-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni-t span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni-more,.omni-none{padding:8px 10px 4px;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.metric{display:flex;align-items:center;gap:6px;height:32px;padding:0 var(--metric-pad,12px);
border-radius:var(--r);white-space:nowrap;flex:none}
.metric.streak{border:1px solid var(--amber-22);background:var(--amber-08)}
.metric.streak b{font-family:var(--mono);font-size:var(--t-meta);font-weight:700;color:var(--amber)}
.metric.streak .fl{font-size:var(--t-ui);display:inline-block;animation:flame 2.4s ease-in-out infinite}
.metric.xp{border:1px solid var(--lime-22);background:var(--lime-08)}
.metric.xp b{font-family:var(--mono);font-size:var(--t-meta);font-weight:700;color:var(--accent-ink)}
.metric span{font-size:var(--t-label);color:var(--ink-3)}
.tbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);
color:var(--ink-3);font-size:var(--t-read);flex:none}
.tbtn:hover{background:rgba(255,255,255,0.06);color:var(--ink)}
[data-theme=light] .tbtn:hover{background:rgba(15,25,5,0.06)}
.save-state{font-size:var(--t-label);font-family:var(--mono);color:var(--ink-4);min-width:44px;text-align:right;flex:none}
.save-state.bad{color:var(--amber);font-weight:600}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip-path:inset(50%);white-space:nowrap;border:0}
.menu-btn{display:none;width:32px;height:32px;border-radius:var(--r);place-items:center;color:var(--ink-3);flex:none}
.rail-btn{flex:none;color:var(--ink-4)}
.rail-btn svg{width:17px;height:17px}
.rail-btn.on{color:var(--accent-ink);background:var(--lime-22)}
@media (max-width:980px){.rail-btn{display:none}}
.menu-btn svg{width:18px;height:18px}
.body{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0;min-width:0;overflow:hidden}
.body.no-rail{grid-template-columns:minmax(0,1fr)}
.body.no-rail .rail{display:none}
.rail{
border-right:1px solid var(--line);overflow:auto;padding:14px 0 30px;
background:rgba(11,12,15,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
[data-theme=light] .rail{background:rgba(255,255,255,0.5)}
.main{min-width:0;min-height:0;overflow:auto}
.main.bleed{overflow:hidden;padding:0}
.main.split{overflow:hidden}
.scrim{display:none;position:fixed;inset:0;background:rgba(4,5,7,.6);z-index:8}
.rail-sec{
margin:6px 0 4px;padding:10px 18px 6px;display:flex;align-items:center;gap:9px;
font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--accent-ink);
}
.rail-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rail-track{margin:1px 0}
.rail-track>button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;text-align:left;
border-radius:0;transition:background .15s var(--ease)}
.rail-track>button:hover{background:rgba(255,255,255,0.06)}
[data-theme=light] .rail-track>button:hover{background:rgba(15,25,5,0.06)}
.rail-track .t-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:var(--t-ui);flex:none;
background-color:var(--surface-2);
background-image:linear-gradient(color-mix(in srgb,var(--tt,transparent) 18%,transparent),
color-mix(in srgb,var(--tt,transparent) 18%,transparent));
border:1px solid var(--line)}
.rail-track .t-name{font-weight:600;font-size:var(--t-read);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-track .t-pct{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.rail-module{padding:4px 0 6px}
.rail-sub>button .cid{font-size:var(--t-label)}
.rail-module.sub{padding:2px 0 4px}
.rail-module.sub h4{margin-left:67px}
.rail-module.sub .rail-lesson{padding-left:12px}
.rail-module h4{margin:9px 18px 5px 55px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.rail-lesson,.rail-course{
display:grid;align-items:center;width:100%;text-align:left;font-size:var(--t-ui);color:var(--ink-3);
padding:5px 16px;border-left:2px solid transparent;
transition:background .15s var(--ease),color .15s var(--ease);
}
.rail-lesson{grid-template-columns:41px 22px minmax(0,1fr)}
.rail-course{grid-template-columns:55px 22px minmax(0,1fr) auto}
.rail-lesson:hover,.rail-course:hover{background:rgba(255,255,255,0.06);color:var(--ink)}
[data-theme=light] .rail-lesson:hover,[data-theme=light] .rail-course:hover{background:rgba(15,25,5,0.06)}
.rail-lesson.active,.rail-course.active{background:var(--lime-22);color:var(--ink);border-left-color:var(--lime)}
.rail-lesson .num,.rail-course .cid{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);text-align:right;padding-right:8px;overflow:hidden}
.rail-lesson .ttl,.rail-course .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-course .lk{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);padding-left:6px}
.rail-miss{padding:6px 14px 12px;font-size:var(--t-meta);color:var(--ink-3);font-style:italic}
.gmark{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--mark-idle);display:inline-block;justify-self:center;position:relative;flex:none}
.gmark.done{background:var(--lime);border-color:var(--lime);box-shadow:0 0 8px color-mix(in srgb,var(--lime) 35%,transparent)}
.gmark.done::after{content:"";position:absolute;left:3.5px;top:1.5px;width:3px;height:6px;border:solid var(--on-lime);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.gmark.now{border-color:var(--lime);background:var(--lime);box-shadow:0 0 0 3px var(--lime-12)}
.gmark.part{border-color:var(--lime);background:linear-gradient(90deg,var(--lime) 50%,transparent 50%)}
.gmark.fail{border-color:var(--bad);background:var(--bad)}

kbd{font-family:var(--mono);font-size:var(--t-label);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-4)}

## A program is a list of instructions

Python reads your file from the top and does what each line says, one line at a time. That is the whole trick. Everything else — loops, functions, classes — is a way of organising those instructions.

```python
print("Hello, world")
print("This runs second")
```

`print()` writes whatever is inside the parentheses to the screen. The text in quotes is called a **string**.

## Comments

A line that starts with `#` is a comment. Python ignores it completely; it exists for the humans reading the code.

```python
# Explain *why* the code does something, not what it does.
total = price * 1.25  # price including 25% VAT
```

def letter_grade(score):
    """Return "A", "B", "C", "D" or "F" for a score 0-100."""

        return "B"

## Exceptions: how Python reports problems

When something goes wrong at runtime Python *raises an exception*. Unhandled, it crashes the program with a traceback. Handled, it becomes a normal part of the flow.

```python
try:
    number = int("abc")
except ValueError:
    print("That wasn't a number")
```

Catch the **specific** exception you expect. A bare `except:` swallows everything — including bugs you would rather know about.

## The full shape

```python
try:
    f = open("config.json")
except FileNotFoundError:
    print("No config yet, using defaults")
else:
    print("Loaded")      # runs only if no exception happened
finally:
    print("Done")        # runs no matter what — cleanup goes here
```

## Raising your own

Functions should refuse bad input loudly instead of returning nonsense:

```python
def withdraw(balance, amount):
    if amount <= 0:
        raise ValueError("Amount must be positive")
    if amount > balance:
        raise ValueError("Insufficient funds")
    return balance - amount
```

Callers can decide what to do:

```python
try:
    balance = withdraw(balance, 500)
except ValueError as err:
    print("Refused:", err)
```

## Common exceptions you will meet

| Exception | Typical cause |
|---|---|
| `NameError` | using a name that isn't defined (often a typo) |
| `TypeError` | wrong type: `"a" + 1`, calling something that isn't a function |
| `ValueError` | right type, bad value: `int("abc")` |
| `KeyError` | dictionary key that doesn't exist |
| `IndexError` | list index out of range |
| `ZeroDivisionError` | dividing by zero |
| `FileNotFoundError` | opening a path that doesn't exist |
| `AttributeError` | `thing.method()` where thing has no such method |

## Custom exceptions

```python
class OutOfStock(Exception):
    pass

raise OutOfStock("No more wiper blades")
```

Your own exception types let callers catch exactly your errors and nothing else.

> **Python's style is "ask forgiveness, not permission":** try the operation and handle the failure, rather than checking every precondition first.

class BankAccount:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self.balance += amount

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Withdrawal must be positive")
        if amount > self.balance:
            raise ValueError("Insufficient funds")
        self.balance -= amount

    def __str__(self):
        return f"{self.owner}: {self.balance:.2f} kr"


def safe_withdraw(account, amount):
    """Return True if the withdrawal succeeded, False if it was refused."""
    try:
        account.withdraw(amount)
        return True
    except ValueError:
        return False

acc.deposit(50)

## Classes: data and behaviour together

A class is a blueprint. Each object built from it has its own data (**attributes**) and shares the same behaviour (**methods**).

```python
class Car:
    wheels = 4                           # class attribute: shared by all cars

    def __init__(self, plate, km=0):     # runs when you create a Car
        self.plate = plate               # instance attributes: this car's data
        self.km = km

    def drive(self, distance):
        self.km += distance
        return self.km

    def __str__(self):                   # what print() shows
        return f"{self.plate} ({self.km} km)"

golf.drive(120)
print(golf)          # AB 12345 (120 km)
```

`self` is the object the method was called on. Python passes it automatically: `golf.drive(120)` becomes `Car.drive(golf, 120)`.

A `@classmethod` receives the class instead of an instance — handy for alternative constructors like `Inventory.load(path)`. A `@property` makes a method look like an attribute.

- `add(item)` — adds the item. If an item with the same name already exists, increase its quantity instead of storing a duplicate.

Get `Item`, `add` and `find` working first, then `remove`, then the calculations, then `save`/`load`, then `report`. Run the checks after every step — they are ordered the same way.

@@ py-5-1.solution.inventory.py
import json


class Item:
    def __init__(self, name, price, quantity):
        self.name = name
        self.price = price
        self.quantity = quantity


class Inventory:
    def __init__(self):
        self.items = {}   # name -> Item

    def add(self, item):
        existing = self.items.get(item.name)
        if existing:
            existing.quantity += item.quantity
        else:
            self.items[item.name] = item

    def remove(self, name, quantity):
        if name not in self.items:
            raise KeyError(name)
        item = self.items[name]
        if quantity > item.quantity:
            raise ValueError(f"Only {item.quantity} {name} in stock")
        item.quantity -= quantity
        if item.quantity == 0:
            del self.items[name]

    def find(self, query):
        q = query.lower()
        hits = [item for item in self.items.values() if q in item.name.lower()]
        return sorted(hits, key=lambda item: item.name)

    def total_value(self):
        return sum(item.price * item.quantity for item in self.items.values())

    def low_stock(self, threshold=5):
        hits = [item for item in self.items.values() if item.quantity < threshold]
        return sorted(hits, key=lambda item: item.name)

    def save(self, path):
        data = [
            {"name": i.name, "price": i.price, "quantity": i.quantity}
            for i in self.items.values()
        ]
        with open(path, "w") as f:
            json.dump(data, f)

    @classmethod
    def load(cls, path):
        inv = cls()
        with open(path) as f:
            for row in json.load(f):
                inv.add(Item(row["name"], row["price"], row["quantity"]))
        return inv

    def report(self):
        lines = [f"{'Item':<20}{'Qty':>5}{'Price':>10}"]
        for item in sorted(self.items.values(), key=lambda i: i.name):
            lines.append(f"{item.name:<20}{item.quantity:>5}{item.price:>10.2f}")
        lines.append(f"Total: {self.total_value():.2f}")
        return "\n".join(lines)

## What happens when you open a page

1. The browser asks a server for a URL.
2. The server answers with an **HTML** document.
3. The browser reads it and builds the **DOM** — a tree of elements it can draw and that JavaScript can change.
4. Linked **CSS** decides how it looks; linked **JavaScript** decides how it behaves.

You write the three languages; the browser combines them.

## HTML is made of elements

```html
<p class="intro">Wiper blades, <strong>fitted while you wait</strong>.</p>
```

- `<p>` is the opening tag, `</p>` the closing tag, everything between is the content.
- `class="intro"` is an **attribute**: extra information on the opening tag.
- Elements nest: the `<strong>` lives inside the `<p>`. Close them in the reverse order you opened them.

A few elements have no content and no closing tag: `<img>`, `<br>`, `<input>`.

## The skeleton every page has

```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Shown in the browser tab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <\!-- everything visible goes here -->
  </body>
</html>
```

`<\!-- -->` is a comment.

## The elements you will use most

| Element | Job |
|---|---|
| `<h1>` … `<h6>` | headings; one `<h1>` per page, then `<h2>` for sections |
| `<p>` | a paragraph |
| `<a href="https://…">` | a link — `href` is where it goes |
| `<img src="photo.jpg" alt="…">` | an image; `alt` describes it for screen readers and when it fails to load |
| `<ul>` `<ol>` `<li>` | unordered / ordered lists and their items |
| `<button>` | something to click |
| `<input>` `<form>` `<label>` | collecting input |
| `<div>` `<span>` | generic boxes (block / inline) when nothing more specific fits |

## Semantic layout elements

Instead of a page of `<div>`s, describe the structure:

```html
<header>  site name, navigation </header>
<nav>     links </nav>
<main>    the page's actual content </main>
<section> a thematic group </section>
<article> a self-contained piece: a post, a product card </article>
<aside>   related but secondary </aside>
<footer>  contact, copyright </footer>
```

Screen readers, search engines and future-you all benefit.

## Attributes worth knowing

- `id="x"` — unique name for one element (JavaScript and CSS use it)
- `class="a b"` — reusable labels; an element can have many
- `alt`, `href`, `src`, `type`, `placeholder`, `disabled`

> **Open the developer tools** in your own browser (F12 or right-click → Inspect) and look at any page's Elements panel. Everything you see there is the DOM you are about to learn to build.

## Connecting CSS to HTML

```html
<link rel="stylesheet" href="style.css">
```

A stylesheet is a list of **rules**. Each rule picks elements with a *selector* and sets *properties*:

```css
h1 {
  color: #1b1f2a;
  font-size: 2rem;
}
```

## Selectors

| Selector | Matches |
|---|---|
| `p` | every `<p>` |
| `.card` | anything with `class="card"` |
| `#main-nav` | the one element with `id="main-nav"` |
| `.card h2` | an `<h2>` anywhere inside `.card` |
| `a:hover` | a link while the mouse is over it |
| `.card, .panel` | either |

When rules conflict, the more specific selector wins (`#id` beats `.class` beats `p`), and among equals the last one written wins.

## The box model

Every element is a box: **content**, wrapped in **padding**, wrapped in a **border**, wrapped in **margin** (space outside).

```css
.card {
  padding: 16px;          /* inside the border */
  border: 1px solid #ddd;
  margin: 24px auto;      /* outside; auto left/right centres a block with a width */
  max-width: 480px;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
}
```

Add this once to every project and widths will behave the way you expect:

```css
* { box-sizing: border-box; }
```

## Colour and type

```css
body {
  font-family: system-ui, sans-serif;
  line-height: 1.5;
  color: #222;
  background: #f5f6f8;
}
```

Colours: named (`tomato`), hex (`#f26a1b`), `rgb(242, 106, 27)`, or with alpha `rgba(0,0,0,.1)`. Sizes: `px` for exact, `rem` for "relative to the base font size" (good for text), `%` for relative to the parent.

## Layout: flexbox

Flexbox lays out children in a row (or column) and makes alignment easy.

```css
nav {
  display: flex;
  justify-content: space-between;   /* spread along the main axis */
  align-items: center;              /* centre on the cross axis */
  gap: 16px;                        /* space between children */
}
.skills { display: flex; flex-wrap: wrap; gap: 8px; }
```

## Layout: grid

Grid is for two dimensions — columns *and* rows.

```css
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* three equal columns */
  gap: 12px;
}
```

## Responsive: react to screen size

```css
@media (max-width: 600px) {
  .gallery { grid-template-columns: 1fr; }
}
```

Rules inside a media query only apply when the condition holds. Start with the mobile layout and add columns as the screen grows, or the reverse — just pick one and be consistent.

## Custom properties

```css
:root { --accent: #f26a1b; }
button { background: var(--accent); }
```

Change the colour in one place, everything updates.

```html
<script src="app.js"><\/script>   <\!-- just before </body>, so the page exists when it runs -->
```

Open the browser console (F12 → Console) — `console.log(...)` prints there, and errors show up with line numbers.

## Variables

```js
const taxRate = 0.25;      // cannot be reassigned — use this by default
let total = 0;             // can be reassigned
total = total + 10;
```

Forget `var`; it exists for old code.

## Types and strings

```js
typeof 42          // "number"   (integers and decimals are the same type)
typeof "hi"        // "string"
typeof true        // "boolean"
typeof undefined   // "undefined" — a variable with no value yet
null               // "no value", on purpose

const name = "Ada";
console.log(`Hello, ${name}! Total: ${total * 2}`);   // template literal: backticks + ${}
```

Always compare with `===` (and `!==`). The two-equals version converts types and surprises people: `"5" == 5` is `true`.

## Functions

```js
function greet(name) {
  return `Hello, ${name}`;
}

const double = (n) => n * 2;                 // arrow function: implicit return for one expression
const describe = (item) => {                 // braces when you need statements
  const label = item.name.toUpperCase();
  return `${label}: ${item.price}`;
};
```

## Conditionals and loops

```js
if (score >= 90) {
  grade = "A";
} else if (score >= 80) {
  grade = "B";
} else {
  grade = "F";
}

for (let i = 0; i < 3; i++) { console.log(i); }        // 0 1 2
for (const tool of ["wrench", "jack"]) { console.log(tool); }
while (attempts < 3) { attempts++; }
```

## Arrays

```js
const prices = [120, 899, 249];
prices.push(15);
prices.length;                          // 4
prices.includes(899);                   // true

prices.map(p => p * 1.25);              // new array, each transformed
prices.filter(p => p > 200);            // new array, only those that pass
prices.reduce((sum, p) => sum + p, 0);  // fold into one value: 1283
prices.find(p => p > 200);              // first match or undefined
prices.forEach(p => console.log(p));    // loop with no result
```

`map`, `filter` and `reduce` return new arrays and never change the original. Chain them.

## Objects

```js

item.price;                 // 899
item["name"];               // "Jack"
item.qty = 3;               // update
const { name, price } = item;   // destructuring into variables

for (const [key, value] of Object.entries(item)) { console.log(key, value); }

- `Uncaught ReferenceError: x is not defined` — typo or the variable isn't in scope.
- `Cannot read properties of undefined` — you called `.something` on a value that doesn't exist yet (often a `querySelector` that found nothing).

function cartTotal(items) {
  return items.reduce((sum, item) => sum + item.price * item.qty, 0);

  return total;

## Finding elements

The DOM is the browser's live model of your HTML. JavaScript reads and changes it.

```js
const title = document.querySelector("h1");          // first match, CSS selector syntax
const button = document.querySelector("#add");       // by id
const items = document.querySelectorAll(".item");    // all matches (a NodeList — loop with forEach or for...of)
```

`querySelector` returns `null` when nothing matches. Guard against it while you're getting a page set up.

## Reading and changing content

```js
title.textContent = "Inventory";          // text only — safe for anything a user typed
title.innerHTML = "<em>Inventory</em>";   // parses HTML — never put user input here
input.value                               // what's typed in an <input>
img.src = "photo.jpg";                    // attributes are properties
el.classList.add("done");                 // add / remove / toggle / contains
el.style.color = "tomato";                // inline style (prefer classes)
el.dataset.id                             // data-id="…" attributes
```

## Creating and removing elements

```js
const li = document.createElement("li");
li.textContent = "Torch";
list.append(li);          // add to the end (prepend for the start)
li.remove();              // delete it
list.innerHTML = "";      // empty a container
```

## Events

```js
button.addEventListener("click", () => {
  count += 1;
  render();
});

input.addEventListener("input", (event) => {
  console.log(event.target.value);   // the element that fired the event
});

form.addEventListener("submit", (event) => {
  event.preventDefault();            // stop the page from reloading
  addTask(input.value);
});
```

Listen for `click` on buttons, `input` on text fields as the user types, `change` on selects and checkboxes, `submit` on forms, `keydown` for keyboard shortcuts.

## The state → render pattern

Keep your data in plain JavaScript variables and write one function that draws the page from that data. Events change the data and call `render()`. This scales from a counter to a whole app.

```js
let tasks = [];

function render() {
  list.innerHTML = "";
  for (const task of tasks) {
    const li = document.createElement("li");
    li.textContent = task.title;
    li.classList.toggle("done", task.done);
    list.append(li);
  }
  remaining.textContent = tasks.filter(t => !t.done).length;
}
```

## Event delegation

Instead of a listener per item, put one on the container and look at `event.target`:

```js
list.addEventListener("click", (event) => {
  const li = event.target.closest("li");
  if (!li) return;
  toggle(li.dataset.id);
});
```

This keeps working for elements you add later.

## Some things take time

Reading a file, asking a server, waiting for a timer — the browser refuses to freeze the page while it waits. Instead the work runs *asynchronously*: you hand over a function to call **later**.

```js
setTimeout(() => console.log("two seconds later"), 2000);
console.log("this prints first");
```

## Promises

A **Promise** is an object standing in for a value that isn't ready yet. It will either *resolve* with the value or *reject* with an error.

```js
fetch("/api/users")
  .then(response => response.json())
  .then(users => console.log(users))
  .catch(error => console.error("Failed:", error));
```

Each `.then` runs when the previous step finishes and passes its result along.

## async / await: the readable version

```js
async function loadUsers() {
  try {
    const response = await fetch("/api/users");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const users = await response.json();
    return users;
  } catch (error) {
    console.error("Failed:", error);
    return [];
  }
}
```

- `await` pauses *this function* until the promise settles, without freezing the page.
- `await` only works inside a function marked `async`.
- An `async` function always returns a promise — so callers `await loadUsers()` too.

## fetch and JSON

`fetch(url)` sends an HTTP request and resolves with a `Response`. `response.json()` parses the body — it is *also* asynchronous. A 404 does **not** reject the promise; check `response.ok` yourself.

Sending data:

```js
await fetch("/api/todos", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ title: "Buy oil" }),
});
```

## The UI pattern

1. Show a loading state.
2. Await the data.
3. Render it — or render the error.

```js
status.textContent = "Loading…";
const users = await loadUsers();
render(users);
status.textContent = `Loaded ${users.length} users`;
```

## CORS, in one paragraph

Browsers only let a page call servers that explicitly allow it (via the `Access-Control-Allow-Origin` header). When a `fetch` to someone else's API fails with a CORS error, it isn't your code — the server hasn't opted in. You'll learn to set that header in the backend track.

> This sandbox can't reach the internet, so the next task gives you `fakeFetch`, a stand-in that behaves like `fetch` but answers from memory after a short delay.

const board = document.querySelector(".board");
const form = document.querySelector("#new-card");
const input = document.querySelector("#card-title");

const ORDER = ["todo", "doing", "done"];
let cards = [];       // { id, title, status }
let nextId = 1;

function render() {
  for (const status of ORDER) {
    const column = board.querySelector(`.column[data-status="${status}"]`);
    const list = column.querySelector(".cards");
    const inColumn = cards.filter(c => c.status === status);
    list.innerHTML = "";
    for (const card of inColumn) {
      const li = document.createElement("li");
      li.className = "card";
      li.dataset.id = card.id;

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = card.title;
      li.append(title);

      if (status !== "done") {
        const move = document.createElement("button");
        move.className = "move";
        move.textContent = "→";
        move.title = "Move to next column";
        li.append(move);
      }

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "✕";
      del.title = "Delete";
      li.append(del);

      list.append(li);
    }
    column.querySelector(".count").textContent = inColumn.length;
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const title = input.value.trim();
  if (!title) return;
  cards.push({ id: nextId++, title, status: "todo" });
  input.value = "";
  render();
});

board.addEventListener("click", (event) => {
  const cardEl = event.target.closest(".card");
  if (!cardEl) return;
  const card = cards.find(c => c.id === Number(cardEl.dataset.id));
  if (!card) return;

  if (event.target.closest(".move")) {
    const next = ORDER[ORDER.indexOf(card.status) + 1];
    if (next) card.status = next;
  } else if (event.target.closest(".delete")) {
    cards = cards.filter(c => c !== card);
  }
  render();
});

render();

## Client, server, and the conversation between them

Every backend does the same job: receive a **request**, do some work, send back a **response**. HTTP is the protocol both sides agree on.

A request has four parts:

```text
POST /todos HTTP/1.1              <- method and path
Host: api.example.com             <- headers: metadata
Content-Type: application/json
                                  <- blank line
{"title": "Order brake pads"}     <- body (optional)
```

A response mirrors it:

```text
HTTP/1.1 201 Created
Content-Type: application/json

{"id": 7, "title": "Order brake pads", "done": false}
```

The server keeps no memory of the conversation between requests — HTTP is **stateless**. Anything that must survive between requests lives in a database, a session store, or the token the client sends along.

## Methods: the verbs

| Method | Meaning | Body? | Safe to retry? |
|---|---|---|---|
| `GET` | read data | no | yes |
| `POST` | create something new | yes | no — retrying creates duplicates |
| `PUT` | replace something entirely | yes | yes |
| `PATCH` | change part of something | yes | usually |
| `DELETE` | remove something | no | yes |

"Safe to retry" is called **idempotency**: sending the same `DELETE /todos/7` twice leaves the world in the same state.

## Status codes: the one-glance answer

| Code | Meaning | When |
|---|---|---|
| `200 OK` | here's your data | successful reads and updates |
| `201 Created` | made it | successful `POST` |
| `204 No Content` | done, nothing to say | successful `DELETE` |
| `301` / `302` | it moved | redirects |
| `400 Bad Request` | your request makes no sense | validation failures |
| `401 Unauthorized` | who are you? | missing/bad credentials |
| `403 Forbidden` | I know who you are — no | permissions |
| `404 Not Found` | no such thing | wrong path or id |
| `405 Method Not Allowed` | not that verb here | `DELETE /todos` on a collection |
| `409 Conflict` | can't, current state forbids it | buying more stock than exists |
| `500 Internal Server Error` | we crashed | your bug, not theirs |

Rule of thumb: **4xx — the client got it wrong. 5xx — the server did.**

## REST: naming things sensibly

REST is a set of conventions for shaping URLs and verbs around **resources** (nouns), not actions:

```text
GET    /books           list books
POST   /books           create a book
GET    /books/42        one book
PUT    /books/42        replace it
DELETE /books/42        remove it
GET    /books?author=le+guin&sort=title     filtering via query string
```

Not `GET /getBooks` or `POST /deleteBook` — the verb is already in the method.

Path parameters (`/books/42`) identify a resource; query parameters (`?author=…`) filter or modify a listing.

## JSON in, JSON out

Modern APIs speak JSON both ways, declared with `Content-Type: application/json`. Try one from a terminal:

```bash
curl -X POST https://api.example.com/todos \
  -H "Content-Type: application/json" \
  -d '{"title": "Order brake pads"}'
```

> You'll build exactly this shape of API in the next task — first as a plain Python function, so nothing hides how requests map to responses. Frameworks come later; they wrap this pattern, they don't replace it.

def handle_request(method, path, body=None):
    """Return a (status, data) tuple for the to-do API."""
    parts = [p for p in path.split("/") if p]

    if parts == ["todos"]:
        if method == "GET":
            return (200, TODOS)
        if method == "POST":
            title = (body or {}).get("title")
            if not title:
                return (400, {"error": "title is required"})
            todo = {"id": next_id(), "title": title, "done": False}
            TODOS.append(todo)
            return (201, todo)
        return (405, {"error": "method not allowed"})

    if len(parts) == 2 and parts[0] == "todos" and parts[1].isdigit():
        todo = find_todo(int(parts[1]))
        if todo is None:
            return (404, {"error": "not found"})
        if method == "GET":
            return (200, todo)
        if method == "PATCH":
            if body and "done" in body:
                todo["done"] = bool(body["done"])
            return (200, todo)
        if method == "DELETE":
            TODOS.remove(todo)
            return (204, None)
        return (405, {"error": "method not allowed"})

    return (404, {"error": "not found"})

## Why a database and not a file?

A JSON file works until two requests write it at the same time, or it grows past what fits in memory, or you need "all orders from Oslo over 500 kr, newest first" without reading everything. Databases exist to make those things safe and fast: **transactions** (all-or-nothing changes), **indexes** (fast lookups), and a **query language** so the database does the searching.

**SQLite** is a full SQL database in a single file, built into Python. It's what you'll use here, and it's genuinely what many production apps ship with.

## Tables, rows, columns

```sql
CREATE TABLE customers (
  id    INTEGER PRIMARY KEY,
  name  TEXT NOT NULL,
  city  TEXT
);
```

A **primary key** uniquely identifies each row. Other tables point at it with a **foreign key** — `orders.customer_id` refers to `customers.id`. That link is what makes it *relational*.

## The queries you'll write every week

```sql
INSERT INTO customers (name, city) VALUES ('Ada', 'Oslo');

SELECT * FROM customers;
SELECT name, city FROM customers WHERE city = 'Oslo';
SELECT * FROM orders WHERE amount > 100 ORDER BY amount DESC LIMIT 5;

UPDATE customers SET city = 'Bergen' WHERE id = 2;
DELETE FROM orders WHERE id = 7;
```

`WHERE` filters rows, `ORDER BY … DESC` sorts, `LIMIT` caps. Without a `WHERE`, `UPDATE` and `DELETE` hit **every row** — the classic Friday-afternoon incident.

## Aggregates: let the database count

```sql
SELECT COUNT(*) FROM orders;
SELECT SUM(amount) FROM orders;
SELECT city, SUM(amount) AS total
FROM customers JOIN orders ON orders.customer_id = customers.id
GROUP BY city
ORDER BY total DESC;
```

`GROUP BY` collapses rows that share a value so aggregates run per group. `JOIN … ON` stitches two tables together where the keys match.

## SQLite from Python

```python
import sqlite3

conn = sqlite3.connect(":memory:")        # or "shop.db" for a real file
conn.execute("CREATE TABLE items (id INTEGER PRIMARY KEY, name TEXT, price REAL)")
conn.execute("INSERT INTO items (name, price) VALUES (?, ?)", ("Jack", 899.0))
conn.commit()

rows = conn.execute("SELECT name, price FROM items WHERE price > ?", (100,)).fetchall()
for name, price in rows:                  # each row is a tuple
    print(name, price)

one = conn.execute("SELECT COUNT(*) FROM items").fetchone()
print(one[0])                             # fetchone() -> a single tuple or None
```

The `?` placeholders are **parameters** — the only correct way to put Python values into SQL. Never build queries with f-strings; the security module shows you exactly why.

## Indexes, in one paragraph

`CREATE INDEX idx_orders_customer ON orders(customer_id);` builds a lookup structure so filtering by that column stops being a full-table scan. Index the columns you search and join on; every index slightly slows writes, so don't index everything.

> Real projects version their schema with **migrations** (numbered scripts that evolve the database) and often wrap SQL in an **ORM** like SQLAlchemy or Prisma. Learn raw SQL first — it's what the ORM generates, and what you'll read when things go slow.

import sqlite3


def setup(conn):
    conn.executescript("""
        CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);
        CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL);
        INSERT INTO customers VALUES
            (1, 'Ada', 'Oslo'), (2, 'Linus', 'Bergen'),
            (3, 'Grace', 'Oslo'), (4, 'Ken', 'Trondheim');
        INSERT INTO orders (customer_id, amount) VALUES
            (1, 120.0), (1, 80.0), (2, 300.0), (3, 50.0),
            (3, 75.5), (4, 20.0), (2, 10.0);
    """)


def total_revenue(conn):
    """Sum of all order amounts."""
    return conn.execute("SELECT SUM(amount) FROM orders").fetchone()[0]


def orders_by_city(conn):
    """[(city, total), ...] highest total first."""
    return conn.execute("""
        SELECT c.city, SUM(o.amount) AS total
        FROM customers c JOIN orders o ON o.customer_id = c.id
        GROUP BY c.city
        ORDER BY total DESC
    """).fetchall()


def top_customers(conn, n):
    """[(name, total), ...] for the n biggest spenders, highest first."""
    return conn.execute("""
        SELECT c.name, SUM(o.amount) AS total
        FROM customers c JOIN orders o ON o.customer_id = c.id
        GROUP BY c.id
        ORDER BY total DESC
        LIMIT ?
    """, (n,)).fetchall()


def add_order(conn, customer_id, amount):
    """Insert an order with ? parameters; return the new id."""
    cursor = conn.execute(
        "INSERT INTO orders (customer_id, amount) VALUES (?, ?)",
        (customer_id, amount),
    )
    conn.commit()
    return cursor.lastrowid


conn = sqlite3.connect(":memory:")
setup(conn)
print("Revenue:", total_revenue(conn))
print("By city:", orders_by_city(conn))
print("Top 2:", top_customers(conn, 2))

## Rule zero: never store the password

When someone registers, you must be able to *check* their password later without being able to *read* it. That's what a **hash** is: a one-way fingerprint. Same input → same hash; hash → input is computationally infeasible.

```python
import hashlib
hashlib.sha256("hunter2".encode()).hexdigest()
# 'f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7'
```

Verification is: hash what they typed, compare fingerprints. If your database leaks, attackers get fingerprints, not passwords.

## Salt: same password, different hash

Without salt, everyone using `hunter2` shares a hash, and attackers use precomputed tables to reverse common ones. A **salt** is a random value stored *next to* the hash and mixed into it, so every user's hash is unique:

```python
import secrets
salt = secrets.token_hex(16)                 # cryptographically random
digest = hashlib.sha256((salt + password).encode()).hexdigest()
stored = f"{salt}${digest}"                  # store both, e.g. "a41f…$9c2e…"
```

`secrets` is the random module for security; plain `random` is predictable.

One more upgrade for production: sha256 is *fast*, and fast is bad here — attackers can try billions of guesses per second. Real systems use deliberately slow hashes: **bcrypt**, **argon2**, or `hashlib.pbkdf2_hmac`. The salt-and-verify structure you build in the next task is identical; only the hash function swaps out.

## Sessions and tokens: staying logged in

HTTP forgets you between requests, so after login the server hands the client something to show next time:

- **Session cookie** — the server stores "session `a8f3` = user 42" and the browser sends the cookie automatically. Easy to revoke; server keeps state.
- **Token (JWT)** — the server signs `{"user": 42, "exp": …}` into a token the client sends in an `Authorization: Bearer …` header. The server verifies the signature instead of looking anything up; stateless, but revocation is harder.

Either way: **401** when credentials are missing or wrong, **403** when the user is known but not allowed.

## SQL injection: the classic

Build queries by gluing strings and users can rewrite your SQL:

```python
# NEVER do this
conn.execute(f"SELECT * FROM users WHERE name = '{username}'")
```

If `username` is `' OR '1'='1`, the query becomes `WHERE name = '' OR '1'='1'` — true for every row. Log in as anyone; with a `;` they can do worse. The fix is the parameter placeholder, which sends the value *separately* from the SQL so it can never become code:

```python
conn.execute("SELECT * FROM users WHERE name = ?", (username,))
```

## The rest of the checklist

- **Validate input** at the boundary: types, lengths, ranges. Reject with `400` and a clear error.
- **XSS**: never insert user text into HTML with `innerHTML` — that's injection in the browser.
- **HTTPS always** — otherwise passwords and cookies cross the network readable.
- **Secrets in environment variables**, never in code or git.
- **Rate-limit** login endpoints; attackers script them.

import hashlib
import secrets


def hash_password(password):
    """Return 'salt$hash' with a fresh random salt."""
    salt = secrets.token_hex(16)
    digest = hashlib.sha256((salt + password).encode()).hexdigest()
    return f"{salt}${digest}"


def verify_password(password, stored):
    """True if password matches the stored 'salt$hash'."""
    salt, expected = stored.split("$", 1)
    digest = hashlib.sha256((salt + password).encode()).hexdigest()
    return digest == expected


stored = hash_password("hunter2")
print(stored)

## You already wrote a framework's core

Your `handle_request(method, path, body)` from module 1 *is* what web frameworks do — they parse the raw HTTP for you, route to your function, and serialise your return value. Compare the same to-do API in two popular frameworks.

## FastAPI (Python)

```python
from fastapi import FastAPI, HTTPException
from pydantic import BaseModel

app = FastAPI()
TODOS = []

class TodoIn(BaseModel):
    title: str

@app.get("/todos")
def list_todos():
    return TODOS

@app.post("/todos", status_code=201)
def create_todo(todo: TodoIn):
    new = {"id": len(TODOS) + 1, "title": todo.title, "done": False}
    TODOS.append(new)
    return new

@app.get("/todos/{todo_id}")
def get_todo(todo_id: int):
    for t in TODOS:
        if t["id"] == todo_id:
            return t
    raise HTTPException(404, "not found")
```

Run it with `uvicorn main:app --reload` and FastAPI also generates interactive docs at `/docs`. The `BaseModel` gives you validation for free: a request without `title` becomes a 422 before your code runs. (Flask is the older, smaller sibling — same idea, `@app.route("/todos")` and you handle validation yourself.)

## Express (JavaScript / Node)

```js
const express = require("express");
const app = express();
app.use(express.json());

const TODOS = [];

app.get("/todos", (req, res) => res.json(TODOS));

app.post("/todos", (req, res) => {
  if (!req.body.title) return res.status(400).json({ error: "title is required" });
  const todo = { id: TODOS.length + 1, title: req.body.title, done: false };
  TODOS.push(todo);
  res.status(201).json(todo);
});

app.listen(3000);
```

Same verbs, same status codes, same shape. Pick the language your team already writes.

## What production adds around this

- **Environment variables** for anything that differs between machines: `DATABASE_URL`, `SECRET_KEY`, `PORT`. Read them with `os.environ` / `process.env`; keep a `.env` file locally and out of git.
- **Logging** — every request, every error, with timestamps. When something breaks at 02:00, logs are all you have.
- **A health check** — a `GET /health` returning 200, so load balancers and uptime monitors know you're alive.
- **A reverse proxy** (nginx, Caddy) or the platform's router terminates HTTPS in front of your app.
- **Docker** wraps your app and its exact dependencies into an image that runs the same everywhere: a `Dockerfile` lists the steps (`FROM python:3.12`, `COPY`, `RUN pip install…`, `CMD`), and hosts run the image.
- **Hosting** — platforms like Fly.io, Railway and Render take a repo or an image, set env vars in their dashboard, and give you a URL. Deployment is `git push`.

> The capstone next: the module-1 handler pattern plus the module-2 database plus the module-3 validation — one API, cleanly split across files.

def row_to_book(row):
    """(id, title, author, price, stock) -> dict."""
    return {
        "id": row[0], "title": row[1], "author": row[2],
        "price": row[3], "stock": row[4],
    }


def validate(body):
    """Return an error string, or None if the body is a valid book."""
    body = body or {}
    title = body.get("title")
    author = body.get("author")
    price = body.get("price")
    stock = body.get("stock")
    if not isinstance(title, str) or not title.strip():
        return "title is required"
    if not isinstance(author, str) or not author.strip():
        return "author is required"
    if not isinstance(price, (int, float)) or isinstance(price, bool) or price < 0:
        return "price must be a number >= 0"
    if not isinstance(stock, int) or isinstance(stock, bool) or stock < 0:
        return "stock must be an integer >= 0"
    return None


def get_book(conn, book_id):
    row = conn.execute(
        "SELECT id, title, author, price, stock FROM books WHERE id = ?",
        (book_id,),
    ).fetchone()
    return row_to_book(row) if row else None


def handle_request(conn, method, path, body=None):
    """Route a request to the right SQL and return (status, data)."""
    path, _, query = path.partition("?")
    parts = [p for p in path.split("/") if p]

    if parts == ["books"]:
        if method == "GET":
            if query.startswith("author="):
                author = query[len("author="):].replace("+", " ")
                rows = conn.execute(
                    "SELECT id, title, author, price, stock FROM books "
                    "WHERE LOWER(author) = LOWER(?) ORDER BY id",
                    (author,),
                ).fetchall()
            else:
                rows = conn.execute(
                    "SELECT id, title, author, price, stock FROM books ORDER BY id"
                ).fetchall()
            return (200, [row_to_book(r) for r in rows])
        if method == "POST":
            error = validate(body)
            if error:
                return (400, {"error": error})
            cursor = conn.execute(
                "INSERT INTO books (title, author, price, stock) VALUES (?, ?, ?, ?)",
                (body["title"], body["author"], body["price"], body["stock"]),
            )
            conn.commit()
            return (201, get_book(conn, cursor.lastrowid))
        return (405, {"error": "method not allowed"})

    if len(parts) >= 2 and parts[0] == "books" and parts[1].isdigit():
        book_id = int(parts[1])
        book = get_book(conn, book_id)

        if len(parts) == 3 and parts[2] == "purchase" and method == "POST":
            if book is None:
                return (404, {"error": "not found"})
            quantity = (body or {}).get("quantity")
            if not isinstance(quantity, int) or isinstance(quantity, bool) or quantity < 1:
                return (400, {"error": "quantity must be an integer >= 1"})
            if book["stock"] < quantity:
                return (409, {"error": "insufficient stock"})
            conn.execute(
                "UPDATE books SET stock = stock - ? WHERE id = ?",
                (quantity, book_id),
            )
            conn.commit()
            return (200, get_book(conn, book_id))

        if len(parts) == 2:
            if book is None:
                return (404, {"error": "not found"})
            if method == "GET":
                return (200, book)
            if method == "PUT":
                error = validate(body)
                if error:
                    return (400, {"error": error})
                conn.execute(
                    "UPDATE books SET title = ?, author = ?, price = ?, stock = ? "
                    "WHERE id = ?",
                    (body["title"], body["author"], body["price"], body["stock"], book_id),
                )
                conn.commit()
                return (200, get_book(conn, book_id))
            if method == "DELETE":
                conn.execute("DELETE FROM books WHERE id = ?", (book_id,))
                conn.commit()
                return (204, None)
            return (405, {"error": "method not allowed"})

    return (404, {"error": "not found"})

## Counting the work, not the seconds

Two correct programs can differ absurdly in speed. **Big O** notation describes how the amount of work grows as the input grows — the shape of the cost, ignoring constants.

| Growth | Name | Feel at n = 1,000,000 |
|---|---|---|
| `O(1)` | constant | instant, always |
| `O(log n)` | logarithmic | ~20 steps |
| `O(n)` | linear | a million steps — fine |
| `O(n log n)` | linearithmic | ~20 million — still fine |
| `O(n²)` | quadratic | a trillion — minutes to hours |
| `O(2ⁿ)` | exponential | forget it past n ≈ 40 |

## Reading code for its shape

```python
def total(prices):            # O(n): one pass
    result = 0
    for p in prices:
        result += p
    return result

def has_duplicate(items):     # O(n²): a pass inside a pass
    for i in range(len(items)):
        for j in range(i + 1, len(items)):
            if items[i] == items[j]:
                return True
    return False

def has_duplicate_fast(items):   # O(n): one pass + O(1) set lookups
    seen = set()
    for item in items:
        if item in seen:
            return True
        seen.add(item)
    return False
```

A loop over the input is `O(n)`. A loop *inside* a loop over the same input is `O(n²)`. Halving the problem each step — like binary search — is `O(log n)`.

## The lookup table every Python dev carries around

| Operation | Cost |
|---|---|
| `my_list[i]`, `my_list.append(x)` | O(1) |
| `x in my_list`, `my_list.remove(x)` | O(n) — scans |
| `x in my_set`, `my_dict[key]` | O(1) — hashed |
| `my_list.insert(0, x)` | O(n) — shifts everything |
| `sorted(my_list)` | O(n log n) |

The single most common real-world fix: a membership test inside a loop using a **list** (`O(n²)` overall) rewritten with a **set** (`O(n)`). Same code shape, thousand-fold speedup.

## Space counts too

`seen = set()` above trades `O(n)` extra memory for the speed. Most optimisations are exactly this trade; name it when you make it.

> Big O is a ceiling for *growth*, not a stopwatch. For n = 10, the "slow" version is often faster and clearer. Reach for the analysis when inputs can get big — which, in real systems, they eventually do.

**`binary_search(items, target)`** returns the index of `target`, or `-1` if it's absent.

Keep two pointers, `low` and `high`. Look at the middle element: too small → search the right half; too big → the left half; equal → done. Loop while `low <= high`.

One of the checks searches a list of 100,000 numbers through a wrapper that counts how many elements you look at — a linear scan reads thousands, binary search reads at most 17. Write it iteratively (no recursion needed).

@@ cs-1-2.solution.main.py
def binary_search(items, target):
    """Return the index of target in the sorted list, or -1."""
    low = 0
    high = len(items) - 1
    while low <= high:
        mid = (low + high) // 2
        value = items[mid]
        if value == target:
            return mid
        if value < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1


print(binary_search([1, 3, 5, 7, 9, 11], 7))    # 3
print(binary_search([1, 3, 5, 7, 9, 11], 4))    # -1

@@ cs-1-3
## Stack: last in, first out

A stack is a pile — you only touch the top. Python lists already are one:

```python
stack = []
stack.append("a")     # push
stack.append("b")
top = stack.pop()     # "b" — pop returns the most recent
```

Undo history, the browser's back button, matching brackets, and the *call stack* your functions live on — all stacks. When you see "most recent thing first", think stack.

## Queue: first in, first out

A queue is a line at the till. `list.pop(0)` works but is O(n); use `deque`:

```python
from collections import deque
queue = deque()
queue.append("first")        # join the back
queue.append("second")
next_up = queue.popleft()    # "first" — O(1)
```

Print jobs, message processing, breadth-first search. "Fairness / arrival order" → queue.

## Hash maps: why dict is O(1)

A dict runs the key through a **hash function** to compute *where* the value sits, so lookup doesn't scan — it jumps. That's why `in` on a dict or set is O(1) while `in` on a list is O(n), and why keys must be immutable (strings, numbers, tuples — not lists).

```python
index = {}
for i, word in enumerate(words):
    index.setdefault(word, []).append(i)   # word -> every position it appears
```

Grouping, counting, caching, de-duplicating: hash maps are the answer to most "make it faster" questions.

## Recursion: functions that call themselves

A recursive function solves a problem by solving a smaller version of it, until the version is trivial.

```python
def countdown(n):
    if n == 0:            # base case: where it stops
        print("Lift off")
        return
    print(n)
    countdown(n - 1)      # recursive case: smaller problem
```

Two rules: there must be a **base case**, and every call must move **toward** it. Miss either and you get `RecursionError: maximum recursion depth exceeded` — the call stack's polite version of an infinite loop.

Recursion shines on recursive *data*: trees, nested folders, JSON of unknown depth.

## Memoization: don't solve the same subproblem twice

Naive recursive Fibonacci recomputes the same values exponentially many times:

```python
def fib(n):                      # O(2^n) — fib(35) already crawls
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
```

Cache results and it collapses to O(n):

```python
from functools import lru_cache

@lru_cache(maxsize=None)
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
```

Or skip recursion entirely and iterate with two variables. You'll do both in the next tasks — and *measure* the difference.

@@ cs-1-4.solution.main.py
def is_balanced(text):
    """True if all (), [] and {} in text are balanced."""
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for char in text:
        if char in "([{":
            stack.append(char)
        elif char in pairs:
            if not stack or stack[-1] != pairs[char]:
                return False
            stack.pop()
    return len(stack) == 0


print(is_balanced("(a[b]{c})"))   # True
print(is_balanced("(]"))          # False

import time


def fib_naive(n):
    """Recursive definition, no caching. O(2^n)."""
    if n < 2:
        return n
    return fib_naive(n - 1) + fib_naive(n - 2)


def fib(n):
    """Fast version: iterative. O(n)."""
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a


start = time.time()
print("fib_naive(25) =", fib_naive(25))
print(f"  took {time.time() - start:.3f}s")

start = time.time()
print("fib(90) =", fib(90))
print(f"  took {time.time() - start:.4f}s")

## Git: a save system for projects

Git records snapshots (**commits**) of your whole project, with a message, an author and a timestamp. You can look back, compare, undo, and work on parallel versions without copying folders around.

```bash
git init                      # turn this folder into a repository (once)
git status                    # what changed since the last commit?
git add inventory.py          # stage: choose what goes in the next snapshot
git add .                     # ...or stage everything
git commit -m "Add low-stock report"
git log --oneline             # history
git diff                      # exactly what changed, line by line
```

The rhythm is `status → add → commit`, several times a day. Commit when one coherent thing works: "Add JSON persistence", not "stuff" and not a week of changes at once. Message convention: imperative mood, under ~60 characters, saying *what the commit does*.

## .gitignore

Some files don't belong in history: virtual environments, `node_modules/`, secrets, build output. List them in a `.gitignore` file at the repo root:

```text
venv/
node_modules/
__pycache__/
.env
dist/
```

`.env` in particular — that's where secrets live, and secrets in git history are practically public.

## Branches: parallel versions

A branch is a movable label on a line of commits. Work on features without touching the working version:

```bash
git switch -c report-feature   # create and switch to a branch
# ...commits...
git switch main
git merge report-feature       # bring the work into main
```

If both branches changed the same lines, git stops and marks a **conflict** in the file between `<<<<<<<` and `>>>>>>>`. Edit it to what it should be, `git add`, commit. Conflicts are normal, not emergencies.

## Remotes: GitHub and friends

A remote is a copy of the repository on a server.

```bash
git clone https://github.com/user/repo.git   # get a project
git pull                                     # fetch others' commits
git push                                     # publish yours
```

Team flow on GitHub: push a branch, open a **pull request**, teammates review the diff, then it merges into `main`. Even solo, PRs give you a place to review your own work before it lands.

## Undoing things

```bash
git restore file.py            # discard uncommitted changes to a file
git restore --staged file.py   # unstage, keep the changes
git revert abc123              # new commit that undoes an old one — safe on shared history
git stash                      # shelve work-in-progress; git stash pop brings it back
```

> Commit early, commit often, push daily. The only unrecoverable mistakes in git are in work you never committed.

## The terminal: talking to the computer directly

Every tool in this trade — git, package managers, servers, deploys — lives on the command line. The core moves:

```bash
pwd                # where am I?
ls                 # what's here?  (dir on Windows)
cd projects/shop   # go there;  cd .. goes up
mkdir tools        # make a folder
cat main.py        # print a file
python main.py     # run a program
node app.js
```

Two keys do half the work: **Tab** completes names, **↑** replays previous commands. `Ctrl+C` stops a running program.

## Python projects: venv + pip

Different projects need different library versions, so each project gets its own **virtual environment**:

```bash
python -m venv venv               # create it (once per project)
source venv/bin/activate          # enter it (Windows: venv\Scripts\activate)
pip install requests fastapi      # install into it
pip freeze > requirements.txt     # write down exact versions
pip install -r requirements.txt   # ...so others can recreate it
```

The `venv/` folder itself stays out of git; `requirements.txt` goes in.

## JavaScript projects: npm

```bash
npm init -y                # creates package.json
npm install express        # adds it to package.json, installs into node_modules/
npm run dev                # runs a script defined in package.json
```

`package.json` is the project manifest: dependencies, scripts, metadata. `node_modules/` stays out of git; `package.json` and the lockfile go in.

## Environment variables

Configuration that changes between machines — database URLs, API keys, ports — lives in the **environment**, not in code:

```bash
export DATABASE_URL="sqlite:///shop.db"    # set for this shell
```

```python
import os
url = os.environ.get("DATABASE_URL", "sqlite:///dev.db")
```

Locally, a `.env` file (git-ignored) holds them and libraries like `python-dotenv` load it. In production, the hosting platform's dashboard sets them.

## A layout that scales

```text
shop/
├── README.md            what it is, how to run it
├── .gitignore
├── requirements.txt     (or package.json)
├── src/                 the code
│   ├── main.py
│   ├── db.py
│   └── api.py
└── tests/
    └── test_api.py
```

The README answers three questions in its first screen: what is this, how do I run it, how do I run the tests. Write it as if for a stranger — in six months, that stranger is you.

## Tests: code that checks your code

You already know what tests feel like — every task on this platform runs them against your work. Writing your own is the same idea: for each behaviour, a tiny function that calls your code and asserts on the result.

The standard Python tool is **pytest**. Files named `test_*.py`, functions named `test_*`, plain `assert` inside:

```python
# test_inventory.py
from inventory import Inventory, Item

def test_add_merges_duplicates():
    inv = Inventory()
    inv.add(Item("Torch", 249.0, 2))
    inv.add(Item("Torch", 249.0, 3))
    assert inv.items["Torch"].quantity == 5

def test_remove_unknown_item_raises():
    inv = Inventory()
    with pytest.raises(KeyError):
        inv.remove("Ghost", 1)
```

```bash
pip install pytest
pytest            # finds and runs everything, prints green dots or red details
```

Structure each test as **arrange, act, assert**: set up the world, do the one thing, check the outcome. One behaviour per test, named after the behaviour — a failing `test_remove_unknown_item_raises` tells you what broke before you read a line.

Test the boundaries: empty input, zero, one, the maximum, the thing that should raise. Bugs live at edges.

**The habit that compounds:** when you find a bug, first write a test that fails because of it, then fix the code until the test passes. That bug can never sneak back.

## Debugging: a method, not a mood

1. **Reproduce it.** Find the smallest input that triggers the problem, every time. Half of all bugs die during this step.
2. **Read the traceback, bottom-up.** Last line: what went wrong. First frame that's *your* file: where. The error is honest; start from what it literally says.
3. **Make the invisible visible.** `print(f"{order=}")` at suspicious points — the `=` inside f-strings prints name and value. Or run under a debugger (`breakpoint()` in Python, `debugger;` in JS with DevTools open) and step through, watching variables.
4. **Isolate.** Cut the failing behaviour out into a five-line script. If the bug follows, you've cornered it; if it doesn't, the problem is in what you removed.
5. **Explain it out loud** — to a colleague, or a rubber duck. Saying "it can't be the cache because—" is reliably the moment you hear it.

When it's fixed: delete the debug prints, keep the regression test, and log properly instead — `logging.warning("stock below zero for %s", name)` with timestamps beats `print` the moment code runs anywhere but your machine.

> Slow is smooth: guessing randomly at fixes feels fast and isn't. Every bug has a mechanism; your job is to see it, not to appease it.

hints: [
'while low <= high: mid = (low + high) // 2.',
'items[mid] < target → the answer is right of mid: low = mid + 1. Too big → high = mid - 1.',
'Only ever read items[mid] — anything that scans (in, .index, loops) fails the efficiency check.',
],
tests: [
{ name: 'Finds every present value', code: `
            _xs = [1, 3, 5, 7, 9, 11]
            assert [binary_search(_xs, v) for v in _xs] == [0, 1, 2, 3, 4, 5], "Each value should map to its index"` },
{ name: 'Absent values give -1', code: `
            assert binary_search([1, 3, 5], 4) == -1, "4 is not in the list"
            assert binary_search([], 7) == -1, "The empty list has nothing"
            assert binary_search([5], 4) == -1 and binary_search([5], 5) == 0, "Single-element lists work too"` },
{ name: 'Handles the ends of a big list', code: `
            _big = list(range(0, 200000, 2))
            assert binary_search(_big, 0) == 0, "First element"
            assert binary_search(_big, 199998) == 99999, "Last element"
            assert binary_search(_big, 3) == -1, "Odd numbers are absent"` },
{ name: 'Actually O(log n)', code: `
            class _Probe:
                def __init__(self, n):
                    self.n = n
                    self.reads = 0
                def __len__(self):
                    return self.n
                def __getitem__(self, i):
                    if not isinstance(i, int):
                        raise TypeError("index must be an int")
                    if i < 0 or i >= self.n:
                        raise IndexError(i)
                    self.reads += 1
                    return i * 2
            _p = _Probe(100000)
            assert binary_search(_p, 135790) == 67895, "The probe list is 0, 2, 4, ... — 135790 sits at index 67895"
            assert _p.reads <= 25, f"Looked at {_p.reads} elements for n=100000 — halve the window each step (about 17 reads)"` },
] },
