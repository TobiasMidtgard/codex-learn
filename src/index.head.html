<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Codex Learn — design tokens
   Dark is the design's own world; light is derived from the same
   hues so the theme toggle keeps working.
   ============================================================ */
:root{
  --ground:#08090B;
  --surface:rgba(16,18,22,0.72);
  --surface-solid:#101216;
  --surface-2:rgba(255,255,255,0.02);
  --nav:rgba(13,15,18,0.72);
  --head:rgba(10,11,14,0.60);
  --editor:#0A0B0E;
  --sunk:rgba(8,9,11,0.60);

  --ink:#EDEFF3;
  --ink-2:#B7BCC6;
  --ink-3:#8A909C;
  --ink-4:#565C68;
  --ink-5:#3A3F49;

  --line:rgba(255,255,255,0.06);
  --line-2:rgba(255,255,255,0.09);
  --line-3:rgba(255,255,255,0.14);

  --lime:#C7F751;
  --lime-hi:#DFFF8F;
  --lime-deep:#8FD32B;
  --on-lime:#0A0C07;
  --lime-05:rgba(199,247,81,0.05);
  --lime-08:rgba(199,247,81,0.08);
  --lime-12:rgba(199,247,81,0.12);
  --lime-22:rgba(199,247,81,0.22);
  --lime-30:rgba(199,247,81,0.30);
  --lime-glow:0 0 14px rgba(199,247,81,0.50);

  --blue:#6E9BFF;
  --purple:#A78BFA;
  --amber:#FFC66D;
  --rose:#FF8A94;
  --blue-12:rgba(110,155,255,0.12);
  --purple-12:rgba(167,139,250,0.12);
  --amber-08:rgba(255,198,109,0.08);
  --amber-22:rgba(255,198,109,0.22);

  --ok:var(--lime);
  --bad:#FF8A94;
  --warn:var(--amber);

  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --r-sm:6px; --r:9px; --r-md:12px; --r-lg:16px; --r-xl:18px;
  --rail-icon:72px; --topbar-h:60px; --rail-w:262px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --pop:cubic-bezier(.2,.9,.3,1.4);
  color-scheme:dark;
}
[data-theme=light]{
  --ground:#F4F6F1;
  --surface:rgba(255,255,255,0.88);
  --surface-solid:#FFFFFF;
  --surface-2:rgba(15,20,10,0.02);
  --nav:rgba(255,255,255,0.80);
  --head:rgba(255,255,255,0.72);
  --editor:#12151A;              /* code stays dark in both themes */
  --sunk:rgba(15,20,10,0.04);

  --ink:#131712;
  --ink-2:#3D4539;
  --ink-3:#616B59;
  --ink-4:#89927F;
  --ink-5:#AEB6A5;

  --line:rgba(15,25,5,0.09);
  --line-2:rgba(15,25,5,0.14);
  --line-3:rgba(15,25,5,0.22);

  --lime:#5F8A0B;                /* legible on light ground */
  --lime-hi:#4C7005;
  --lime-deep:#87C22A;
  --on-lime:#0A0C07;
  --lime-05:rgba(95,138,11,0.05);
  --lime-08:rgba(95,138,11,0.09);
  --lime-12:rgba(95,138,11,0.13);
  --lime-22:rgba(95,138,11,0.22);
  --lime-30:rgba(95,138,11,0.32);
  --lime-glow:0 0 12px rgba(135,194,42,0.35);

  --blue:#2C5BD0; --purple:#6D48C7; --amber:#9A6512; --rose:#C1373F;
  --blue-12:rgba(44,91,208,0.10);
  --purple-12:rgba(109,72,199,0.10);
  --amber-08:rgba(154,101,18,0.08);
  --amber-22:rgba(154,101,18,0.22);
  --bad:#C1373F;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
a{color:var(--lime);text-decoration:none}
a:hover{color:var(--lime-hi)}
::selection{background:rgba(199,247,81,0.25)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ed-ta:focus-visible{outline:none}
code,pre,kbd{font-family:var(--mono)}
[hidden]{display:none!important}
input{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:10px;border:3px solid var(--ground)}
::-webkit-scrollbar-track{background:transparent}
[data-theme=light] ::-webkit-scrollbar-thumb{background:rgba(15,25,5,0.16)}

/* ---------- the design's motion vocabulary ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{from{stroke-dashoffset:999}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes barGrow{from{width:0}}

/* ---------- shell ---------- */
/* grid-template-rows must be stated: without it the single implicit row is
   auto-sized to its content, so a tall screen grows past 100dvh and .app's
   overflow:hidden clips it — .main never becomes the scroll container. */
.app{display:grid;grid-template-columns:var(--rail-icon) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;position:relative;overflow:hidden}
.blob{position:absolute;pointer-events:none;z-index:0}
.blob.a{top:-260px;left:180px;width:820px;height:520px;filter:blur(30px);
  background:radial-gradient(ellipse at center,rgba(199,247,81,0.10),transparent 62%);
  animation:drift 22s ease-in-out infinite}
.blob.b{bottom:-300px;right:-120px;width:760px;height:600px;filter:blur(40px);
  background:radial-gradient(ellipse at center,rgba(110,155,255,0.10),transparent 62%);
  animation:drift 28s ease-in-out infinite reverse}
[data-theme=light] .blob{opacity:.55}

/* icon rail */
.iconrail{
  grid-row:1/-1;width:var(--rail-icon);border-right:1px solid var(--line);
  background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;gap:22px;
  position:relative;z-index:6;
}
.logo{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--lime),var(--lime-deep));
  box-shadow:0 6px 22px rgba(199,247,81,0.30);
  animation:popIn .5s var(--pop) both;
}
.logo span{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--on-lime)}
.iconnav{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.inav{
  position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-4);transition:color .18s,background .18s;
}
.inav:hover{color:var(--ink);background:rgba(255,255,255,0.05)}
.inav.active{color:var(--lime);background:var(--lime-08)}
.inav.active::before{
  content:"";position:absolute;left:-17px;top:50%;transform:translateY(-50%);
  width:2px;height:20px;border-radius:2px;background:var(--lime);
  box-shadow:0 0 10px rgba(199,247,81,0.8);
}
.inav svg{width:19px;height:19px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail-foot .div{width:30px;height:1px;background:var(--line-2)}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));
  font-size:12px;font-weight:600;color:#0B0C0E;border:1px solid var(--line-3);cursor:pointer;
}

/* header */
.frame{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--topbar-h) minmax(0,1fr);min-width:0;min-height:0;position:relative;z-index:2}
.topbar{
  height:var(--topbar-h);display:flex;align-items:center;gap:16px;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--head);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.screen-id{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.screen-id b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.screen-id span{font-family:var(--mono);font-size:11px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;width:220px;
  border-radius:var(--r);border:1px solid var(--line-2);background:rgba(255,255,255,0.03);
}
[data-theme=light] .search{background:rgba(15,25,5,0.03)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:12.5px}
.search input::placeholder{color:var(--ink-4)}
.search .kbd{font-family:var(--mono);font-size:10px;color:var(--ink-4);border:1px solid var(--line-2);border-radius:4px;padding:1px 4px}
.metric{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);white-space:nowrap}
.metric.streak{border:1px solid var(--amber-22);background:var(--amber-08)}
.metric.streak b{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--amber)}
.metric.streak .fl{font-size:13px;display:inline-block;animation:flame 2.4s ease-in-out infinite}
.metric.xp{border:1px solid var(--lime-22);background:var(--lime-08)}
.metric.xp b{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--lime)}
.metric span{font-size:11px;color:var(--ink-3)}
.tbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);color:var(--ink-3);font-size:14px}
.tbtn:hover{background:rgba(255,255,255,0.06);color:var(--ink)}
[data-theme=light] .tbtn:hover{background:rgba(15,25,5,0.06)}
.save-state{font-size:11px;font-family:var(--mono);color:var(--ink-4);min-width:44px;text-align:right}
.save-state.bad{color:var(--amber);font-weight:600}
.menu-btn{display:none;width:32px;height:32px;border-radius:var(--r);place-items:center;color:var(--ink-3)}
.rail-btn{flex:none;color:var(--ink-4)}
.rail-btn svg{width:17px;height:17px}
.rail-btn.on{color:var(--lime);background:var(--lime-08)}
@media (max-width:980px){.rail-btn{display:none}}
.menu-btn svg{width:18px;height:18px}

/* body + tree rail */
.body{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0;min-width:0;overflow:hidden}
.body.no-rail{grid-template-columns:minmax(0,1fr)}
.body.no-rail .rail{display:none}
.rail{
  border-right:1px solid var(--line);overflow:auto;padding:14px 0 30px;
  background:rgba(11,12,15,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
[data-theme=light] .rail{background:rgba(255,255,255,0.5)}
.main{min-width:0;min-height:0;overflow:auto}
.main.split{overflow:hidden}
.scrim{display:none;position:fixed;inset:0;background:rgba(4,5,7,.6);z-index:8}

.rail-sec{
  margin:6px 0 4px;padding:10px 18px 6px;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);
}
.rail-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rail-track{margin:1px 0}
.rail-track>button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;text-align:left;border-radius:0}
.rail-track>button:hover{background:rgba(255,255,255,0.04)}
[data-theme=light] .rail-track>button:hover{background:rgba(15,25,5,0.04)}
.rail-track .t-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;
  background:var(--surface-2);border:1px solid var(--line)}
.rail-track .t-name{font-weight:600;font-size:13.5px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-track .t-pct{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.rail-module{padding:4px 0 6px}
.rail-module h4{margin:8px 18px 5px 44px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.rail-lesson,.rail-course{
  display:grid;align-items:center;width:100%;text-align:left;font-size:13px;color:var(--ink-3);
  padding:5px 16px;border-left:2px solid transparent;
}
.rail-lesson{grid-template-columns:30px 26px 1fr}
.rail-course{grid-template-columns:32px 26px 1fr auto}
.rail-lesson:hover,.rail-course:hover{background:rgba(255,255,255,0.04);color:var(--ink)}
[data-theme=light] .rail-lesson:hover,[data-theme=light] .rail-course:hover{background:rgba(15,25,5,0.04)}
.rail-lesson.active,.rail-course.active{background:var(--lime-08);color:var(--ink);border-left-color:var(--lime)}
.rail-lesson .num,.rail-course .cid{font-family:var(--mono);font-size:10px;color:var(--ink-4);text-align:right;padding-right:9px}
.rail-lesson .ttl,.rail-course .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-course .lk{font-family:var(--mono);font-size:10px;color:var(--ink-4);padding-left:6px}

/* status marks */
.gmark{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-3);display:inline-block;justify-self:center;position:relative;flex:none}
.gmark.done{background:var(--lime);border-color:var(--lime);box-shadow:0 0 8px rgba(199,247,81,.35)}
.gmark.done::after{content:"";position:absolute;left:3.5px;top:1.5px;width:3px;height:6px;border:solid var(--on-lime);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.gmark.now{border-color:var(--lime);background:var(--lime);box-shadow:0 0 0 3px var(--lime-12)}
.gmark.part{border-color:var(--lime);background:linear-gradient(90deg,var(--lime) 50%,transparent 50%)}
.gmark.fail{border-color:var(--bad);background:var(--bad)}
.gmark.fail::after,.gmark.fail::before{content:"";position:absolute;left:5.5px;top:2.5px;width:1.5px;height:7px;background:#fff}
.gmark.fail::after{transform:rotate(45deg)}
.gmark.fail::before{transform:rotate(-45deg)}
.gmark.run{border-color:var(--amber);border-style:dashed}
.gmark.lock{border-style:dotted;opacity:.55}

/* ---------- buttons, chips ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  height:36px;padding:0 16px;border-radius:var(--r);font-size:12.5px;font-weight:600;
  border:1px solid var(--line-2);color:var(--ink-3);background:transparent;
  transition:transform .18s var(--pop),box-shadow .18s,border-color .18s,color .18s,background .18s;
}
.btn:hover{border-color:var(--line-3);color:var(--ink)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(199,247,81,0.28);color:var(--on-lime)}
.btn.accent{background:var(--lime-12);border-color:var(--lime-30);color:var(--lime)}
.btn.accent:hover{background:var(--lime-22);color:var(--lime)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,0.05)}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.dark{background:rgba(255,255,255,0.05);border-color:var(--line-2);color:var(--ink-2)}
.btn.dark:hover{background:rgba(255,255,255,0.09);color:var(--ink)}
.btn.run{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.btn.run:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(199,247,81,0.28)}
.btn.run:disabled{background:rgba(255,255,255,0.06);border-color:var(--line-2);color:var(--ink-4);transform:none;box-shadow:none}
.btn.success{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-4)}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-sm);
  font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;
}
.chip.mono{font-family:var(--mono);font-size:10.5px;font-weight:500}
.chip.read{color:var(--blue);border-color:rgba(110,155,255,.28);background:var(--blue-12)}
.chip.sandbox{background:rgba(110,155,255,.14);color:#9CD5FF}
.chip.derive{background:rgba(167,139,250,.16);color:#C084FC}
.chip.blanks{background:rgba(255,176,32,.16);color:#FFB020}
.chip.quiz{color:var(--purple);border-color:rgba(167,139,250,.28);background:var(--purple-12)}
.chip.code,.chip.lab{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.project,.chip.capstone{color:var(--amber);border-color:var(--amber-22);background:var(--amber-08)}
.chip.done{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.level{color:var(--lv);border-color:var(--lv-b);background:var(--lv-s)}
.chip.stack{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-3)}
.chip.prereq{font-family:var(--mono);font-size:10.5px;font-weight:700;cursor:pointer;color:var(--ink-3)}
.chip.prereq:hover{border-color:var(--line-3);color:var(--ink)}
.chip.prereq.met{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.prereq.unmet{color:var(--bad);border-color:rgba(255,138,148,.28);background:rgba(255,138,148,.08)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);z-index:60;
  background:var(--surface-solid);border:1px solid var(--line-2);color:var(--ink);
  padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--lime-30);background:var(--lime-12);color:var(--lime)}

/* ---------- page scaffolding ---------- */
.page{max-width:1240px;margin:0 auto;padding:34px 40px 60px;animation:fadeUp .5s var(--ease) both}
.page.wide{max-width:1320px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.section-h span{font-size:12px;color:var(--ink-4)}

/* dashboard hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.hero h1{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p.lede{margin:10px 0 0;font-size:14.5px;color:var(--ink-3);max-width:520px;text-wrap:pretty}
.hero .acts{display:flex;gap:8px}

/* resume card */
.resume{
  display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--line-2);border-radius:var(--r-xl);
  overflow:hidden;margin-bottom:22px;cursor:pointer;position:relative;
  background:linear-gradient(120deg,var(--lime-08),rgba(16,18,22,0.9) 46%,rgba(110,155,255,0.06));
  animation:fadeUp .55s .05s var(--ease) both;
}
[data-theme=light] .resume{background:linear-gradient(120deg,var(--lime-08),rgba(255,255,255,.94) 46%,rgba(44,91,208,.06))}
.resume .rl{padding:26px 30px;display:flex;flex-direction:column;gap:16px;min-width:0}
.resume .tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resume .flag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--on-lime);background:var(--lime);padding:3px 8px;border-radius:5px}
.resume .where{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.resume h3{margin:0;font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.resume p{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink-3);max-width:400px;text-wrap:pretty}
.resume .foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.resume .foot .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.resume .foot .r em{font-style:normal;color:var(--lime)}
.resume .rr{
  border-left:1px solid var(--line);background:var(--sunk);padding:22px 24px;overflow:hidden;position:relative;
  font-family:var(--mono);font-size:12.5px;line-height:1.85;color:var(--ink-3);
}
.resume .rr::before{
  content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(199,247,81,0.06),transparent);
  animation:sweep 4.5s 1s ease-in-out infinite;
}
.caret{display:inline-block;width:8px;height:15px;background:var(--lime);margin-left:6px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}

/* progress bars */
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,0.07);overflow:hidden}
[data-theme=light] .bar{background:rgba(15,25,5,.09)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime-deep),var(--lime));box-shadow:var(--lime-glow);animation:barGrow 1s .2s var(--ease) both}

/* stat cards + sparkline */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)}
.stat .delta{font-size:11px;font-weight:600;color:var(--lime)}
.stat .val{display:flex;align-items:flex-end;gap:6px}
.stat .val b{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat .val span{font-size:12px;color:var(--ink-4);padding-bottom:3px}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px}
.spark i{flex:1;border-radius:2px;background:var(--lime-22);transform-origin:bottom;animation:growUp .6s var(--ease) both}
.spark i.hi{background:var(--lime);box-shadow:0 0 8px rgba(199,247,81,.4)}

/* week chart */
.weekchart{display:flex;align-items:flex-end;gap:10px;height:110px}
.weekchart .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.weekchart .d i{width:100%;border-radius:6px 6px 3px 3px;background:var(--lime-22);transform-origin:bottom;animation:growUp .7s var(--ease) both;min-height:3px}
.weekchart .d.today i{background:linear-gradient(180deg,var(--lime),var(--lime-deep));box-shadow:0 0 12px rgba(199,247,81,.4)}
.weekchart .d span{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.weekchart .d.today span{color:var(--lime)}

/* generic panel */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px}
.panel .hr{height:1px;background:var(--line);margin:16px 0}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.rowlink .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--purple-12);border:1px solid rgba(167,139,250,.25);color:var(--purple)}
.rowlink .tx{flex:1;min-width:0}
.rowlink .tx b{display:block;font-size:13px;font-weight:600}
.rowlink .tx span{font-size:11.5px;color:var(--ink-4)}
.rowlink .go{color:var(--ink-4)}

/* track cards (dashboard) */
.tracks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.track-card{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;
  display:flex;flex-direction:column;gap:0;text-align:left;color:var(--ink);
  transition:border-color .18s,transform .18s var(--pop),box-shadow .18s;
}
.track-card:hover{border-color:var(--lime-30);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.track-card .head{display:flex;align-items:center;justify-content:space-between}
.track-card .t-icon{width:auto;height:auto;background:none;border:0;font-size:15px}
.track-card h3{margin:14px 0 0;font-size:14px;font-weight:600;letter-spacing:-.015em}
.track-card .tag{margin:4px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink-4);min-height:0}
.track-card .foot{display:none}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.strip i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.07)}
[data-theme=light] .strip i{background:rgba(15,25,5,.10)}
.strip i.done{background:var(--lime)}
.strip i.now{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.7)}
.strip i.proj{border-radius:50%}

/* progress ring */
.ringwrap{position:relative;width:38px;height:38px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap circle.trk{stroke:rgba(255,255,255,0.08)}
[data-theme=light] .ringwrap circle.trk{stroke:rgba(15,25,5,.10)}
.ringwrap circle.val{stroke:var(--lime);animation:ringIn 1.2s .15s var(--ease) both}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
.ring{--pct:0;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--lime) calc(var(--pct)*1%),rgba(255,255,255,.07) 0)}
[data-theme=light] .ring{background:conic-gradient(var(--lime) calc(var(--pct)*1%),rgba(15,25,5,.09) 0)}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--ground);display:grid;place-items:center;text-align:center;line-height:1.15}
.ring b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ring span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.deg-progress{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px;display:flex;gap:20px;align-items:center}
.deg-progress .pl{min-width:0}
.deg-progress h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.deg-progress p{margin:0 0 12px;color:var(--ink-3);font-size:13px}

/* ---------- degree catalog ---------- */
.lv-Beginner{--lv:var(--lime);--lv-s:var(--lime-08);--lv-b:var(--lime-30)}
.lv-Intermediate{--lv:var(--blue);--lv-s:var(--blue-12);--lv-b:rgba(110,155,255,.30)}
.lv-Advanced{--lv:var(--purple);--lv-s:var(--purple-12);--lv-b:rgba(167,139,250,.30)}
.lv-Expert{--lv:var(--amber);--lv-s:var(--amber-08);--lv-b:var(--amber-22)}

.deg-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:26px;margin-bottom:28px;align-items:start}
.deg-hero h1{margin:0 0 12px;font-size:clamp(28px,4vw,38px);line-height:1.06;font-weight:600;letter-spacing:-.03em}
.deg-hero h1 em{font-style:normal;color:var(--lime)}
.deg-hero p{margin:0 0 18px;font-size:14.5px;color:var(--ink-3);max-width:56ch;text-wrap:pretty}
.deg-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.deg-stats .stat{padding:13px 15px;gap:6px}
.deg-stats .stat b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.deg-stats .stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 22px}
.filters input[type=search]{
  flex:1;min-width:170px;max-width:300px;height:34px;padding:0 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--ink);font:13px var(--sans);
}
[data-theme=light] .filters input[type=search]{background:rgba(15,25,5,.03)}
.filters .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
[data-theme=light] .seg{background:rgba(15,25,5,.04)}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;transition:all .16s}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--lime);color:var(--on-lime)}

/* ---------- mathematics ---------- */
math{font-size:1.06em}
math[display=block]{display:block;margin:14px 0;overflow-x:auto;overflow-y:hidden;text-align:center}
.article math[display=block]{padding:4px 0}
.math-raw{font-family:var(--mono);font-size:.9em;color:var(--amber);
  background:var(--amber-08);padding:1px 6px;border-radius:4px}

/* ---------- sandbox ---------- */
.sbx-host{margin:18px 0 6px}
.sbx{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--sunk);padding:14px}
.sbx-canvas{min-height:280px;height:320px;border-radius:var(--r);overflow:hidden;background:var(--editor)}
.sbx-canvas canvas{display:block}
.sbx-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sbx-params{display:flex;flex-direction:column;gap:12px}
.sbx-p{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:baseline}
.sbx-l{font-size:12px;color:var(--ink-3)}
.sbx-v{font-family:var(--mono);font-size:12px;color:var(--lime);text-align:right}
.sbx-p input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--lime);height:18px;cursor:pointer}
.sbx-read{font-size:12.5px;line-height:1.65;color:var(--ink-3);
  padding-top:12px;border-top:1px solid var(--line);text-wrap:pretty}
.sbx-read b{color:var(--ink);font-weight:600}
.sbx-read em{color:var(--ink-2);font-style:italic}
.sbx-notice{margin:14px 0 0;padding:14px 16px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface)}
.sbx-notice h4{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lime)}
.sbx-notice ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sbx-notice li{font-size:13.5px;line-height:1.6;color:var(--ink-3)}
@media (max-width:820px){
  .sbx{grid-template-columns:1fr}
  .sbx-canvas{height:260px}
}

/* ---------- guided derivation ---------- */
.dv-prog{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.dv-prog .bar{flex:1;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.dv-prog .bar i{display:block;height:100%;background:var(--lime);transition:width .3s var(--ease)}
.dv-prog span{font-family:var(--mono);font-size:11px;color:var(--ink-4);white-space:nowrap}
.dv-steps{display:flex;flex-direction:column;gap:12px}
.dv-step{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px}
.dv-step.active{border-color:var(--lime-30);background:var(--lime-04,var(--surface))}
.dv-step.solved{opacity:.9}
.dv-step.locked{opacity:.5}
.dv-head{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.dv-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);color:var(--ink-3)}
.dv-step.solved .dv-n{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.dv-step.active .dv-n{border-color:var(--lime);color:var(--lime)}
.dv-ask{font-size:14px;line-height:1.65;color:var(--ink-2)}
.dv-ask p{margin:0 0 6px}.dv-ask p:last-child{margin:0}
.dv-hidden{font-size:12.5px;color:var(--ink-5);font-style:italic}
.dv-given{margin:12px 0 0 38px;padding:10px 14px;border-radius:var(--r);
  background:var(--sunk);border:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.dv-answer{margin:10px 0 0 38px;padding:8px 14px;border-radius:var(--r);
  background:var(--lime-08);border:1px solid var(--lime-22)}
.dv-work{margin:14px 0 0 38px;display:flex;flex-direction:column;gap:10px}
.dv-in{display:flex;flex-direction:column;gap:5px}
.dv-in span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-5)}
.dv-in input{height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--editor);color:var(--ink);font:13.5px var(--mono);outline:none;transition:border-color .16s}
.dv-in input:focus{border-color:var(--lime)}
.dv-preview{min-height:26px;display:flex;align-items:center;color:var(--ink-2)}
.dv-acts{display:flex;gap:8px;flex-wrap:wrap}
.dv-msg{font-size:13px;line-height:1.6;color:var(--ink-3);min-height:1px}
.dv-msg.bad{color:var(--amber)}
.dv-msg.hint{color:var(--blue)}
.dv-sub{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r);
  background:var(--sunk);border:1px solid var(--line)}
.dv-substep{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:13px;
  line-height:1.6;color:var(--ink-3)}
.dv-substep b{font-family:var(--mono);font-size:11px;color:var(--lime)}
.dv-substep p{margin:0}
.dv-left{font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
.dv-closing{margin:18px 0 0;padding:16px 18px;border-radius:var(--r-lg);
  border:1px solid var(--lime-22);background:var(--lime-08);font-size:13.5px;
  line-height:1.65;color:var(--ink-2)}
.dv-closing p{margin:0}
@media (max-width:620px){
  .dv-given,.dv-answer,.dv-work{margin-left:0}
}

.build-acts{display:flex;gap:10px;margin:16px 0 14px;flex-wrap:wrap}
#build-checks{margin-bottom:8px}
#build-mount{margin-top:16px}

/* ---------- fill in the blanks ----------
   The state colours are Voltaic's: green for right, pink for wrong, amber for a slot
   waiting to be filled. They are used only for answer state, so they never compete
   with the lime the rest of the app uses for progress. */
:root{
  --ans-ok:#5BE58A;
  --ans-no:#FF5C7A;
  --ans-wait:#FFB020;
}
[data-theme=light]{
  --ans-ok:#1E7F45;
  --ans-no:#C0264A;
  --ans-wait:#9A5B00;
}
.blk-wrap{margin:18px 0 14px;border:1px solid var(--line-3);border-radius:var(--r-lg);
  background:var(--editor);overflow:hidden}
.blk-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
  background:var(--sunk)}
.blk-file{font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
.blk-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-5)}
.blk-listing{margin:0;padding:18px 20px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:2.05;color:var(--ink-2);white-space:pre}
.blk{
  display:inline-block;min-width:92px;padding:1px 10px;margin:0 1px;
  border-radius:6px;border:1px dashed var(--ans-wait);
  background:color-mix(in srgb,var(--ans-wait) 12%,transparent);
  color:var(--ans-wait);font:inherit;font-size:.95em;cursor:pointer;text-align:center;
  transition:background .14s,border-color .14s,color .14s;
}
.blk:hover{background:color-mix(in srgb,var(--ans-wait) 22%,transparent)}
.blk.open{outline:2px solid var(--ans-wait);outline-offset:1px}
.blk.filled{border-style:solid;border-color:var(--line-3);
  background:var(--surface-2);color:var(--ink)}
.blk.right{border-style:solid;border-color:var(--ans-ok);
  background:color-mix(in srgb,var(--ans-ok) 14%,transparent);color:var(--ans-ok)}
.blk.wrong{border-style:solid;border-color:var(--ans-no);
  background:color-mix(in srgb,var(--ans-no) 14%,transparent);color:var(--ans-no)}
.blk-pick{margin:0 0 14px;padding:14px 16px;border:1px solid var(--line-3);
  border-radius:var(--r-lg);background:var(--surface);animation:fadeUp .18s var(--ease) both}
.blk-pick-h{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.blk-opt{display:inline-block;margin:0 8px 8px 0;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
  font:13px var(--mono);cursor:pointer;transition:border-color .14s,background .14s}
.blk-opt:hover{border-color:var(--ink-4);color:var(--ink)}
.blk-opt.on{border-color:var(--lime);background:var(--lime-12);color:var(--ink)}
.blk-acts{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.blk-fb{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.blk-row{display:grid;grid-template-columns:18px 1fr;gap:11px;padding:12px 14px;
  border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.blk-row.right{border-color:color-mix(in srgb,var(--ans-ok) 30%,transparent)}
.blk-row.wrong{border-color:color-mix(in srgb,var(--ans-no) 30%,transparent)}
.blk-row b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.blk-yours{font-family:var(--mono);font-size:11.5px;color:var(--ans-no)}
.blk-row p{margin:5px 0 0;font-size:13px;line-height:1.6;color:var(--ink-3);text-wrap:pretty}

/* ---------- circuit editor ---------- */
.ckt{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.ckt-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--sunk);flex-wrap:wrap}
.ckt-bar .spacer{flex:1}
.ckt-tools{display:flex;gap:4px;flex-wrap:wrap}
.ckt-t{height:28px;min-width:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-2);
  background:transparent;color:var(--ink-3);font:600 11.5px var(--mono);cursor:pointer;
  transition:background .14s,color .14s,border-color .14s}
.ckt-t:hover{color:var(--ink);border-color:var(--line-3)}
.ckt-t.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.ckt-main{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:340px}
.ckt-canvas{position:relative;background:var(--editor);min-height:340px;cursor:crosshair}
.ckt-canvas canvas{display:block}
.ckt-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ckt-panel{padding:12px 14px;border-bottom:1px solid var(--line)}
.ckt-panel h4{margin:0 0 9px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lime)}
.ckt-hint{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-4);text-wrap:pretty}
.ckt-f{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;margin-bottom:8px}
.ckt-f span{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap}
.ckt-f input{height:28px;padding:0 8px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--editor);color:var(--ink);font:12px var(--mono);outline:none;min-width:0}
.ckt-f input:focus{border-color:var(--lime)}
.ckt-modes{margin-bottom:10px;flex-wrap:wrap}
.ckt-modes button{font-size:10.5px;padding:0 8px}
.ckt-opts{margin-bottom:10px}
.ckt-run{width:100%;height:32px}
.ckt-out{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.ckt-tab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.ckt-tab td{padding:3px 0;color:var(--ink-2)}
.ckt-tab td:first-child{color:var(--ink-5)}
.ckt-tab td:last-child{text-align:right;color:var(--lime)}
.ckt-nodes{flex-wrap:wrap}
.ckt-nodes button{font-size:10.5px;padding:0 8px}
.ckt-err{font-size:12px;line-height:1.6;color:var(--amber);text-wrap:pretty}
.ckt-plot{border-top:1px solid var(--line);background:var(--editor);padding:8px}
.ckt-plot canvas{display:block}
.ckt-note{margin:12px 2px 0;font-size:12px;line-height:1.6;color:var(--ink-4);max-width:70ch;text-wrap:pretty}
@media (max-width:860px){
  .ckt-main{grid-template-columns:1fr}
  .ckt-side{border-left:0;border-top:1px solid var(--line)}
}

/* ---------- the majors ---------- */
.page-head{margin-bottom:26px}
.page-head h1{margin:0 0 8px;font-size:30px;font-weight:600;letter-spacing:-0.03em;text-wrap:balance}
.page-head p{margin:0;font-size:14px;color:var(--ink-3);max-width:62ch;text-wrap:pretty}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.prog-card{
  display:block;width:100%;text-align:left;padding:22px 24px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
  transition:border-color .18s,transform .18s,background .18s;animation:fadeUp .45s var(--ease) both;
}
.prog-card:hover{border-color:var(--lime-30);transform:translateY(-2px)}
.prog-card.empty{opacity:.82}
.pc-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px}
.pc-head>div{flex:1;min-width:0}
.pc-head h2{margin:0 0 7px;font-size:20px;font-weight:600;letter-spacing:-0.025em;color:var(--ink);text-wrap:balance}
.pc-head h2 em{color:var(--lime);font-style:normal}
.pc-head p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-3);text-wrap:pretty}
.pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pc-stats .stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--ink);letter-spacing:-.02em}
.pc-stats .stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-5)}
.pc-levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pc-bands{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.pc-bands li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--ink-2)}
.pc-bands li+li{border-top:1px solid var(--line)}
.pb-icon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;
  background:color-mix(in srgb,var(--tt,#fff) 22%,transparent);color:var(--ink-2)}
.pb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-n{font-family:var(--mono);font-size:10.5px;color:var(--ink-5);white-space:nowrap}
@media (max-width:560px){.pc-stats{grid-template-columns:repeat(2,1fr)}}

.year-band{margin:0 0 30px}
.year-head{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.year-badge{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:15px;color:var(--ink);
  background:color-mix(in srgb,var(--tt,var(--lime)) 20%,transparent);border:1px solid color-mix(in srgb,var(--tt,var(--lime)) 42%,transparent)}
.year-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.year-head p{margin:2px 0 0;color:var(--ink-4);font-size:13px}
.year-head .yr-prog{margin-left:auto;text-align:right;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.year-head .yr-prog b{display:block;color:var(--ink);font-size:14px}
.year-head .bar{width:110px;margin-top:5px}

.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:13px}
.course-card{
  position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:16px 18px;display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--ink);
  transition:border-color .18s,transform .18s var(--pop),box-shadow .18s;
}
.course-card:hover{border-color:var(--lv-b);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.course-card .cc-top{display:flex;align-items:center;gap:9px}
.course-card .cc-icon{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--lv-s);border:1px solid var(--lv-b);color:var(--lv)}
.course-card .cc-id{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-4);letter-spacing:.04em}
.course-card h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.course-card p{margin:0;color:var(--ink-3);font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.course-card .cc-chips{display:flex;flex-wrap:wrap;gap:5px}
.course-card .cc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.course-card .cc-foot .spacer{flex:1}
.course-card.locked{opacity:.55}
.course-card.locked:hover{opacity:.85}
.course-card .lock-note{font-family:var(--sans);font-size:11px;color:var(--amber)}
.course-card.done-all{border-color:var(--lime-30)}

/* course page */
.course-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:26px;margin-bottom:24px;align-items:start}
.ch-id{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.ch-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--lv-s);border:1px solid var(--lv-b);color:var(--lv)}
.course-head h1{margin:0 0 9px;font-size:clamp(24px,3.2vw,31px);font-weight:600;letter-spacing:-.03em;line-height:1.08}
.course-head .lede{margin:0 0 16px;color:var(--ink-3);font-size:14.5px;max-width:60ch;text-wrap:pretty}
.meta-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;font-size:13px}
.meta-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:baseline}
.meta-card dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap}
.meta-card dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.meta-card dd.plain{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

.gate{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:13px 16px;margin:0 0 22px;font-size:13.5px;
  border:1px solid var(--amber-22);background:var(--amber-08);color:var(--amber)}
.gate.ok{border-color:var(--lime-30);background:var(--lime-08);color:var(--lime)}
.gate b{display:block;margin-bottom:3px;color:var(--ink)}
.gate .g-icon{font-size:15px;line-height:1.4}

.outcomes{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px 20px;margin:0 0 24px}
.outcomes h3{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.outcomes ul{margin:0;padding-left:18px;columns:2;column-gap:30px}
.outcomes li{margin:4px 0;break-inside:avoid;font-size:13.5px;color:var(--ink-2)}

.mod-list{display:flex;flex-direction:column;gap:10px;margin:0 0 24px}
.mod{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.mod>.mod-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;text-align:left}
.mod>.mod-head:hover{background:rgba(255,255,255,.03)}
.mod .mnum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-4);flex:none}
.mod .mtitle{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.015em}
.mod .msum{display:block;margin-top:3px;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--ink-4)}
.mod .caret{color:var(--ink-4);font-size:11px;transition:transform .18s;flex:none}
.mod.open .caret{transform:rotate(90deg)}
.mod-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.mod-body h4{margin:15px 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.mod-body ul{margin:0;padding-left:17px}
.mod-body li{margin:5px 0;font-size:13.5px;color:var(--ink-2)}
.lab-row{
  display:flex;align-items:center;gap:12px;width:100%;margin-top:15px;padding:13px 15px;text-align:left;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);transition:all .18s;
}
.lab-row:hover{border-color:var(--lime-30);background:var(--lime-08)}
.lab-row .lab-t{flex:1;min-width:0}
.lab-row .lab-t b{display:block;font-size:14px;font-weight:600}
.lab-row .lab-t span{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.lab-row .go{font-family:var(--mono);font-size:11px;color:var(--lime);white-space:nowrap}

.capstone-card{border:1px solid var(--line);border-top:2px solid var(--amber);border-radius:var(--r-lg);background:var(--surface);padding:20px 22px;margin:0 0 24px}
.cap-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.capstone-card h2{margin:7px 0 12px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.cap-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:14px}
.cap-cols h4{margin:0 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.cap-cols ul{margin:0;padding-left:17px}
.cap-cols li{margin:5px 0;font-size:13.5px;color:var(--ink-2)}
.rubric{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
.rubric th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.rubric td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.rubric td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.rubric td.w{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.rubric tr:last-child td{border-bottom:0}
.wbar{display:inline-block;width:48px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-left:8px;vertical-align:middle;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--amber);border-radius:99px}

.depmap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px 20px;margin:0 0 24px;overflow-x:auto}
.depmap h3{margin:0 0 14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.depmap svg{display:block;min-width:640px}
.depmap .dn{cursor:pointer}
.depmap .dn rect{fill:var(--surface-2);stroke:var(--line-2)}
.depmap .dn.done rect{fill:var(--lime-08);stroke:var(--lime-30)}
.depmap .dn.here rect{fill:var(--lime-12);stroke:var(--lime);stroke-width:1.6}
.depmap .dn text{font:600 10px var(--mono);fill:var(--ink-3)}
.depmap .dn.here text{fill:var(--ink)}
.depmap .de{stroke:var(--line-2);fill:none}
.depmap .de.hot{stroke:var(--lime-30)}

/* track page */
.track-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px}
.track-head .t-icon{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface);border:1px solid var(--line)}
.track-head h1{margin:0 0 8px;font-size:clamp(25px,3.6vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.06}
.track-head p{margin:0 0 14px;color:var(--ink-3);font-size:14.5px;max-width:58ch}
.module{margin:0 0 22px}
.module h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.module h2 .mnum{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--lime);background:var(--lime-08);border:1px solid var(--lime-30);padding:3px 7px;border-radius:5px}
.module .desc{margin:0 0 10px;color:var(--ink-4);font-size:13px}
.lesson-row{
  display:grid;grid-template-columns:26px 40px 1fr auto auto;align-items:center;gap:12px;width:100%;
  padding:11px 16px;margin:6px 0;text-align:left;color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:all .18s;
}
.lesson-row:hover{border-color:var(--lime-30);background:var(--lime-05)}
.lesson-row .num{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.lesson-row .ttl{font-size:13.5px;font-weight:500}
.lesson-row .min{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

/* ---------- lesson: article ---------- */
.lesson-read{max-width:780px;margin:0 auto;padding:32px 40px 70px;animation:fadeUp .45s var(--ease) both}
.crumb{display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-bottom:12px;flex-wrap:wrap}
.crumb button{color:var(--ink-3)}
.crumb button:hover{color:var(--lime)}
.lesson-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.lesson-title h1{margin:0;font-size:clamp(24px,3.2vw,31px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.lesson-title .lnum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--lime);background:var(--lime-08);border:1px solid var(--lime-30);padding:4px 8px;border-radius:5px}
.lesson-meta{display:flex;gap:9px;align-items:center;color:var(--ink-4);font-size:12.5px;margin-bottom:24px;flex-wrap:wrap}
.article{font-size:15px;line-height:1.72;color:var(--ink-2)}
.article>*:first-child{margin-top:0}
.article h2{margin:32px 0 10px;font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.2;color:var(--ink)}
.article h3{margin:24px 0 8px;font-size:16.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.article h4{margin:20px 0 6px;font-size:14px;font-weight:600;color:var(--ink)}
.article p{margin:0 0 14px;text-wrap:pretty}
.article ul,.article ol{margin:0 0 14px;padding-left:22px}
.article li{margin:5px 0}
.article li p{margin:0}
.article b,.article strong{color:var(--ink);font-weight:600}
.article code{font-size:.88em;color:var(--lime);background:var(--lime-08);padding:1px 5px;border-radius:4px}
.article pre code{background:none;padding:0;color:inherit;font-size:inherit}
.article blockquote{margin:16px 0;padding:2px 0 2px 16px;border-left:2px solid var(--lime);color:var(--ink-2)}
.article blockquote p:last-child{margin:0}
.article hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.article table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:13.5px}
.article th,.article td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.article th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
/* A runnable example: header strip, the code, and an output drawer that opens
   underneath it. Running never navigates away, so the reader keeps their place. */
.cbx{position:relative;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--sunk);overflow:hidden}
.cb-head{display:flex;align-items:center;gap:6px;padding:5px 7px 5px 14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
[data-theme=light] .cb-head{background:rgba(15,25,5,0.025)}
.cb-head .lang{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.cb-head .sp{flex:1}
.cb-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;font-weight:600;color:var(--ink-3);
  background:transparent;border:1px solid transparent;padding:3px 8px;border-radius:5px;white-space:nowrap;
  transition:color .15s,background .15s,border-color .15s}
.cb-btn:hover{color:var(--ink);background:rgba(255,255,255,0.06)}
[data-theme=light] .cb-btn:hover{background:rgba(15,25,5,0.06)}
.cb-btn.cb-run{color:var(--lime);background:var(--lime-08);border-color:var(--lime-30)}
.cb-btn.cb-run:hover{color:var(--lime-hi);background:var(--lime-12)}
.cb-btn[disabled]{opacity:.45;pointer-events:none}
.md-code{position:relative;margin:0;padding:14px 16px;overflow:auto;color:var(--ink-2);
  font-size:12.5px;line-height:1.9;white-space:pre;-webkit-overflow-scrolling:touch}
.cb-out{border-top:1px solid var(--line);background:var(--ground);animation:fadeIn .2s both}
.cb-out-head{display:flex;align-items:center;gap:10px;padding:5px 7px 5px 14px;border-bottom:1px solid var(--line)}
.cb-out-head b{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-4)}
.cb-out-head .st{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.cb-out-head .st.ok{color:var(--lime)}
.cb-out-head .st.bad{color:var(--bad)}
.cb-out-head .sp{flex:1}
.cb-console{max-height:264px;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:12px;
  line-height:1.72;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.cb-console .ln{display:block}
.cb-console .empty{color:var(--ink-5)}
.cb-preview{height:min(300px,52vh);background:#fff}
.cb-preview iframe{width:100%;height:100%;border:0;display:block}
.article-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.article-foot .spacer{flex:1}
.done-note{display:flex;align-items:center;gap:8px;color:var(--lime);font-weight:600;font-size:13px}

/* quiz */
.quiz-q{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px 22px;margin:0 0 14px}
.quiz-q .qn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.quiz-q .qt{margin:0 0 14px;font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.5;color:var(--ink)}
.quiz-q .qt code{color:var(--lime);background:var(--lime-08);padding:1px 5px;border-radius:4px;font-size:.9em}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);
  font-size:13.5px;line-height:1.5;color:var(--ink-2);transition:all .16s;
}
.opt:hover:not(:disabled){border-color:var(--line-3);background:rgba(255,255,255,.04)}
.opt .k{font-family:var(--mono);font-size:10.5px;font-weight:700;min-width:19px;height:19px;flex:none;margin-top:1px;
  border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-4)}
.opt code{color:var(--lime);background:var(--lime-08);padding:0 4px;border-radius:3px;font-size:.9em}
.opt.correct{border-color:var(--lime-30);background:var(--lime-08)}
.opt.correct .k{background:var(--lime-12);border-color:var(--lime-30);color:var(--lime)}
.opt.wrong{border-color:rgba(255,138,148,.32);background:rgba(255,138,148,.07)}
.explain{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.explain.good{border-color:var(--lime-30);background:var(--lime-08)}
.explain.bad{border-color:rgba(255,138,148,.28);background:rgba(255,138,148,.07)}
.quiz-result{border:1px solid var(--lime-30);background:var(--lime-08);border-radius:var(--r-lg);padding:22px;margin:12px 0 0;animation:popIn .45s var(--pop) both}
.quiz-result .score{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.quiz-result p{margin:8px 0 14px;color:var(--ink-3);font-size:13px}

/* ---------- profile ---------- */
.prof-head{display:flex;align-items:center;gap:22px;margin-bottom:28px;flex-wrap:wrap}
.prof-av{
  width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));color:#0B0C0E;
  font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--line-3);animation:popIn .5s var(--pop) both;
}
.prof-id{flex:1;min-width:260px}
.prof-id .eyebrow{margin-bottom:6px}
.prof-name{
  width:100%;max-width:420px;background:none;border:0;border-bottom:1px solid var(--line-2);
  color:var(--ink);font:600 26px/1.2 var(--sans);letter-spacing:-.03em;padding:2px 0 6px;outline:none;
  transition:border-color .16s;
}
.prof-name::placeholder{color:var(--ink-5)}
.prof-name:focus{border-bottom-color:var(--lime)}
.prof-sub{margin:10px 0 0;font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.pcard{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:20px 22px;margin:0 0 14px;max-width:760px;
}
.pcard-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pcard-h b{font-size:14.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.pcard p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-3);max-width:64ch;text-wrap:pretty}
.pcard .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-4)}
.pcard.good{border-color:var(--lime-22)}
.pcard.good .dot{background:var(--lime);box-shadow:var(--lime-glow)}
.pcard.warn{border-color:var(--amber-22);background:var(--amber-08)}
.pcard.warn .dot{background:var(--amber);box-shadow:0 0 10px rgba(255,198,109,.6)}
.pcard-acts{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.prof-warn{font-family:var(--mono);font-size:11px;color:var(--amber)}
.acc-form{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acc-in{flex:1;min-width:200px;height:34px;padding:0 12px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font:13px var(--sans);outline:none;transition:border-color .16s}
[data-theme=light] .acc-in{background:rgba(15,25,5,0.03)}
.acc-in::placeholder{color:var(--ink-5)}
.acc-in:focus{border-color:var(--lime-30)}
.sync-line{font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.pcard code{font-family:var(--mono);font-size:.88em;color:var(--lime);
  background:var(--lime-08);padding:1px 5px;border-radius:4px}

/* ---------- lesson: code (split) ---------- */
.lesson-code{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);height:100%;min-height:0;animation:fadeIn .35s both}
.task-pane{overflow:auto;padding:22px 28px 40px;border-right:1px solid var(--line);background:rgba(11,12,15,0.60)}
[data-theme=light] .task-pane{background:rgba(255,255,255,.5)}
.task-pane .article{font-size:14.5px;line-height:1.7}
.task-pane .article h2{font-size:17px;margin:22px 0 8px}
.task-pane .article h3{font-size:15px;margin:18px 0 6px}
.task-pane .lesson-title h1{font-size:23px;letter-spacing:-.025em}

.checks{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.checks h3{display:flex;justify-content:space-between;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.checks h3 b{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:600}
.checks h3 b.allgood{color:var(--lime)}
.check{display:grid;grid-template-columns:28px 1fr;align-items:start;padding:9px 14px 9px 10px;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .gmark{margin-top:3px}
.check .name{color:var(--ink-2)}
.check.pass .name{color:var(--ink)}
.check .msg{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.check.pass{animation:fadeIn .3s ease}

.helpers{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.helper{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.helper>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 15px;text-align:left;font-size:13.5px;font-weight:600}
.helper>button:hover{background:rgba(255,255,255,.03)}
.helper>button span.k{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);font-weight:500}
.helper .hint-body{padding:0 15px 13px;font-size:13.5px;color:var(--ink-2)}
.hint-item{padding:10px 12px;margin:7px 0 0;border-left:2px solid var(--amber);background:var(--amber-08);border-radius:0 8px 8px 0;line-height:1.6}
.helper .sol-body{padding:0 15px 13px}
.helper .sol-body .fname{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin:10px 0 6px}
/* the solution viewer emits a bare <pre class=md-code>, outside any .cbx, so it
   needs the frame that moved onto the wrapper */
.helper .sol-body .md-code{border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk)}
.sol-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* workbench */
.workbench{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--editor)}
.wb-bar{display:flex;align-items:center;gap:6px;min-height:42px;padding:5px 10px 5px 8px;border-bottom:1px solid var(--line);background:rgba(16,18,22,.70);flex-wrap:wrap}
.ftabs{display:flex;gap:2px;flex:1;min-width:0;overflow:auto}
.ftab{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--ink-4);white-space:nowrap;transition:all .16s}
.ftab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
.ftab:hover{color:var(--ink-2);background:rgba(255,255,255,.04)}
.ftab.active{color:var(--ink);background:rgba(255,255,255,.06)}
.ftab.active::before{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.8)}
.ftab.ro{opacity:.65}
.ftab .ro-tag{font-size:9.5px;color:var(--ink-5)}
.wb-actions{display:flex;gap:7px;align-items:center}
.wb-actions .btn{height:30px;padding:0 13px;font-size:12px}
.rt-status{display:flex;align-items:center;gap:6px;padding:0 6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.rt-status i{width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
.rt-status.ready i{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.8)}
.rt-status.loading i{background:var(--amber);animation:blink 1s steps(1) infinite}
.rt-status.error i{background:var(--bad)}
.wb-editor{flex:1 1 58%;min-height:140px;position:relative}
.wb-panel{flex:0 0 42%;min-height:130px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:rgba(13,15,18,.80)}
.wb-resize{height:6px;flex:none;cursor:row-resize;margin:-3px 0;position:relative;z-index:2;background:transparent}
.wb-resize:hover{background:var(--lime-22)}
.ptabs{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line)}
.ptab{height:26px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-4);display:flex;align-items:center;transition:all .16s}
.ptab:hover{color:var(--ink-2)}
.ptab.active{color:var(--ink);background:rgba(255,255,255,.06)}
.ptab .badge{font-family:var(--mono);font-size:10px;margin-left:7px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--ink-3)}
.ptab .badge.good{background:var(--lime);color:var(--on-lime)}
.ptab .badge.bad{background:rgba(255,138,148,.2);color:var(--bad)}
.ptabs .spacer{flex:1}
.ptabs .note{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);padding-right:6px}
.pbody{flex:1;min-height:0;position:relative}
.console{position:absolute;inset:0;overflow:auto;padding:12px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.console .ln{display:block}
.console .ln.error,.cb-console .ln.error{color:var(--bad)}
.console .ln.warn,.cb-console .ln.warn{color:var(--amber)}
.console .ln.info,.cb-console .ln.info{color:var(--blue)}
.console .ln.sys,.cb-console .ln.sys{color:var(--ink-4);font-style:italic}
.console .ln.ok,.cb-console .ln.ok{color:var(--lime)}
.console .empty{color:var(--ink-5);font-style:italic}
.preview-wrap{position:absolute;inset:0;background:#fff}
.preview-frame{width:100%;height:100%;border:0;display:block;background:#fff}
.checks-mini{position:absolute;inset:0;overflow:auto;padding:8px 12px}
.checks-mini .check{grid-template-columns:26px 1fr;border-bottom-color:var(--line)}
.wb-foot{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:rgba(16,18,22,.7);font-size:12px;color:var(--ink-4);flex-wrap:wrap}
.wb-foot .spacer{flex:1}
.mobile-tabs{display:none;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(16,18,22,.7)}
.mobile-tabs button{flex:1;height:30px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);background:rgba(255,255,255,.05)}
.mobile-tabs button.active{background:var(--lime);color:var(--on-lime)}
.mobile-tabs .badge{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.85}

/* editor */
.cw-editor{position:absolute;inset:0;display:flex;background:var(--editor)}
.ed-gutter{width:54px;flex:none;padding:14px 18px 14px 0;text-align:right;user-select:none;overflow:hidden;
  color:var(--ink-5);font-family:var(--mono);font-size:12.5px;line-height:1.62}
.ed-gutter div{height:21.9px}
.ed-body{position:relative;flex:1;min-width:0}
.ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:14px 18px 14px 2px;border:0;border-radius:0;
  font-family:var(--mono);font-size:13.5px;line-height:1.62;white-space:pre;overflow:auto;tab-size:4;
  letter-spacing:0;word-break:normal;overflow-wrap:normal}
.ed-hl{pointer-events:none;overflow:hidden;color:var(--ink-2);background:transparent}
.ed-ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--lime);outline:0;resize:none;appearance:none}
.ed-ta::selection{background:rgba(199,247,81,.22)}
.ed-ta.ro{caret-color:transparent}

/* syntax — the design's own palette */
/* ---------- syntax palette ----------
   Roles, not shapes. Declarations and control flow are different colours because
   they answer different questions; a name being defined is brighter than the same
   name being read; parameters, properties and methods each stay recognisable. The
   accent lime is reserved for strings so literal data always reads as data. */
.tk-kw-ctl{color:#FF8AB8}                 /* if for return while — flow */
.tk-kw-decl{color:#A78BFA}                /* def class const import — binding */
.tk-kw-op{color:#C084FC;font-style:italic}/* in not and typeof — word operators */
.tk-const{color:#FFC66D}                  /* True None NaN UPPER_CASE */
.tk-self{color:#FF9E64;font-style:italic} /* self this cls */
.tk-str{color:#C7F751}
.tk-str-esc{color:#8FD32B;font-weight:600}
.tk-interp-b{color:#FFC66D;font-weight:600}
.tk-num{color:#FFC66D}
.tk-unit{color:#D8A657}
.tk-color{color:#FFC66D;text-decoration:underline dotted}
.tk-cm{color:#565C68;font-style:italic}
.tk-cm-doc{color:#6E7787;font-style:italic}
.tk-fn{color:#6E9BFF}                     /* a call */
.tk-fn-def{color:#8FD3FF;font-weight:600} /* the name being defined */
.tk-method{color:#6E9BFF}
.tk-prop{color:#9CD5FF}
.tk-param{color:#FFB4A2;font-style:italic}
.tk-var-def{color:#E6E9F0}
.tk-type{color:#7FDBFF}
.tk-type-def{color:#7FDBFF;font-weight:600}
.tk-bi{color:#7FDBFF}
.tk-dec{color:#C084FC}
.tk-op{color:#B7BCC6}
.tk-bracket{color:#8A909C}
.tk-punc{color:#6E7787}
.tk-tag{color:#FF8A94}
.tk-attr{color:#FFC66D}
.tk-attr-val{color:#C7F751}
.tk-entity{color:#C084FC}
.tk-at-rule{color:#A78BFA}
.tk-css-prop{color:#9CD5FF}
.tk-css-var{color:#FFB4A2}
.tk-selector{color:#FF8A94}
.tk-pseudo{color:#C084FC}
[data-theme=light]{
  --tk-dim:#6B7280;
}
[data-theme=light] .tk-kw-ctl{color:#B0126B}
[data-theme=light] .tk-kw-decl{color:#6D28D9}
[data-theme=light] .tk-kw-op{color:#7C3AED}
[data-theme=light] .tk-const{color:#9A5B00}
[data-theme=light] .tk-self{color:#B4530A}
[data-theme=light] .tk-str{color:#3F6212}
[data-theme=light] .tk-str-esc{color:#2C4A0B}
[data-theme=light] .tk-interp-b{color:#9A5B00}
[data-theme=light] .tk-num{color:#9A5B00}
[data-theme=light] .tk-unit{color:#8A5A12}
[data-theme=light] .tk-color{color:#9A5B00}
[data-theme=light] .tk-cm{color:var(--tk-dim)}
[data-theme=light] .tk-cm-doc{color:#5B6472}
[data-theme=light] .tk-fn,[data-theme=light] .tk-method{color:#1D4ED8}
[data-theme=light] .tk-fn-def{color:#1E40AF}
[data-theme=light] .tk-prop{color:#0E63A8}
[data-theme=light] .tk-param{color:#B4432A}
[data-theme=light] .tk-var-def{color:#131712}
[data-theme=light] .tk-type,[data-theme=light] .tk-type-def,[data-theme=light] .tk-bi{color:#0B6E80}
[data-theme=light] .tk-dec{color:#7C3AED}
[data-theme=light] .tk-op{color:#3D4539}
[data-theme=light] .tk-bracket{color:#616B59}
[data-theme=light] .tk-punc{color:#7A8474}
[data-theme=light] .tk-tag,[data-theme=light] .tk-selector{color:#B3261E}
[data-theme=light] .tk-attr{color:#9A5B00}
[data-theme=light] .tk-attr-val{color:#3F6212}
[data-theme=light] .tk-entity,[data-theme=light] .tk-pseudo,[data-theme=light] .tk-at-rule{color:#7C3AED}
[data-theme=light] .tk-css-prop{color:#0E63A8}
[data-theme=light] .tk-css-var{color:#B4432A}

/* ---------- completion ---------- */
.ac-menu{
  position:absolute;z-index:9;min-width:260px;max-width:420px;max-height:250px;overflow:auto;
  padding:4px;border-radius:10px;border:1px solid var(--line-3);background:var(--surface-solid);
  box-shadow:0 18px 46px rgba(0,0,0,.55);font-family:var(--mono);font-size:12.5px;
  animation:fadeIn .1s both;scrollbar-width:thin;
}
[data-theme=light] .ac-menu{box-shadow:0 18px 46px rgba(15,25,5,.16)}
.ac-item{
  display:grid;grid-template-columns:18px minmax(0,auto) minmax(0,1fr);gap:8px;align-items:center;
  padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.ac-item.sel{background:var(--lime-12);color:var(--ink)}
.ac-item:hover:not(.sel){background:rgba(255,255,255,.05)}
[data-theme=light] .ac-item:hover:not(.sel){background:rgba(15,25,5,.05)}
.ac-ic{width:18px;text-align:center;font-size:11px;line-height:1;flex:none}
.ac-n{overflow:hidden;text-overflow:ellipsis}
.ac-n b{color:var(--lime);font-weight:700}
.ac-item.sel .ac-n b{color:var(--lime-hi)}
.ac-d{color:var(--ink-5);font-size:11px;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ac-item.sel .ac-d{color:var(--ink-4)}

/* one colour per kind, shared by the list icon and the detail card */
.k-variable .ac-ic,.ac-ic.k-variable{color:#9CD5FF}
.k-parameter .ac-ic,.ac-ic.k-parameter{color:#FFB4A2}
.k-function .ac-ic,.ac-ic.k-function{color:#6E9BFF}
.k-method .ac-ic,.ac-ic.k-method{color:#6E9BFF}
.k-property .ac-ic,.ac-ic.k-property{color:#9CD5FF}
.k-field .ac-ic,.ac-ic.k-field{color:#9CD5FF}
.k-type .ac-ic,.ac-ic.k-type{color:#7FDBFF}
.k-interface .ac-ic,.ac-ic.k-interface{color:#7FDBFF}
.k-keyword .ac-ic,.ac-ic.k-keyword{color:#C084FC}
.k-constant .ac-ic,.ac-ic.k-constant{color:#FFC66D}
.k-snippet .ac-ic,.ac-ic.k-snippet{color:#C7F751}
.k-module .ac-ic,.ac-ic.k-module{color:#FF9E64}
/* the icons are small glyphs, so the light theme needs darker inks to stay legible */
[data-theme=light] .k-variable .ac-ic,[data-theme=light] .ac-ic.k-variable,
[data-theme=light] .k-property .ac-ic,[data-theme=light] .ac-ic.k-property,
[data-theme=light] .k-field .ac-ic,[data-theme=light] .ac-ic.k-field{color:#0E63A8}
[data-theme=light] .k-parameter .ac-ic,[data-theme=light] .ac-ic.k-parameter{color:#B4432A}
[data-theme=light] .k-function .ac-ic,[data-theme=light] .ac-ic.k-function,
[data-theme=light] .k-method .ac-ic,[data-theme=light] .ac-ic.k-method{color:#1D4ED8}
[data-theme=light] .k-type .ac-ic,[data-theme=light] .ac-ic.k-type,
[data-theme=light] .k-interface .ac-ic,[data-theme=light] .ac-ic.k-interface{color:#0B6E80}
[data-theme=light] .k-keyword .ac-ic,[data-theme=light] .ac-ic.k-keyword{color:#7C3AED}
[data-theme=light] .k-constant .ac-ic,[data-theme=light] .ac-ic.k-constant{color:#9A5B00}
[data-theme=light] .k-snippet .ac-ic,[data-theme=light] .ac-ic.k-snippet{color:#4D7C0F}
[data-theme=light] .k-module .ac-ic,[data-theme=light] .ac-ic.k-module{color:#B4530A}
[data-theme=light] .ac-n b{color:#4D7C0F}
[data-theme=light] .ac-item.sel .ac-n b{color:#3F6212}
[data-theme=light] .ac-sig-l b{color:#4D7C0F}

.ac-doc{
  position:absolute;z-index:9;width:290px;max-height:230px;overflow:auto;
  padding:11px 13px;border-radius:10px;border:1px solid var(--line-3);
  background:var(--surface-solid);box-shadow:0 18px 46px rgba(0,0,0,.5);
  font-size:12px;line-height:1.6;color:var(--ink-3);animation:fadeIn .12s both;
}
[data-theme=light] .ac-doc{box-shadow:0 18px 46px rgba(15,25,5,.14)}
.ac-doc-h{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ac-doc-h b{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.ac-kind{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-5)}
.ac-sig{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  padding:5px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);
  white-space:pre-wrap;word-break:break-word}
.ac-ty{color:var(--ink-4)}
.ac-doc p{margin:8px 0 0;text-wrap:pretty}

.ac-sighint{
  position:absolute;z-index:9;max-width:440px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line-3);background:var(--surface-solid);
  box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);animation:fadeIn .12s both;
}
[data-theme=light] .ac-sighint{box-shadow:0 10px 30px rgba(15,25,5,.12)}
.ac-sig-l{color:var(--ink-2)}
.ac-sig-l b{color:var(--lime);font-weight:700}
.ac-sig-d{display:block;margin-top:3px;color:var(--ink-5);font-family:var(--sans);font-size:11.5px}

/* ---------- responsive ---------- */
@media (max-width:1180px){.lesson-code{grid-template-columns:minmax(300px,46%) minmax(0,1fr)}}
/* Between the mobile drawer and a roomy desktop there is not enough width for the
   curriculum column and a usable editor at once — the workspace wins. */
@media (min-width:981px) and (max-width:1199px){
  .body.split{grid-template-columns:minmax(0,1fr)}
  .body.split .rail{display:none}
}
@media (max-width:980px){
  :root{--rail-icon:60px;--rail-w:272px}
  .menu-btn{display:grid}
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:var(--topbar-h);left:var(--rail-icon);bottom:0;width:var(--rail-w);z-index:9;
    transform:translateX(-110%);transition:transform .22s var(--ease);background:var(--surface-solid)}
  .rail.open{transform:none;box-shadow:16px 0 48px rgba(0,0,0,.5)}
  /* .frame's z-index:2 traps the drawer in a stacking context below #scrim (z 8),
     which is .frame's sibling — every tap in the open drawer would hit the scrim
     and just close it. Dropping the context here lets .rail's z 9 win. */
  .frame{z-index:auto}
  .body.no-rail .rail{display:block}
  .scrim.open{display:block}
  .search{display:none}
  .page{padding:24px 20px 50px}
  .deg-hero,.course-head{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .resume{grid-template-columns:1fr}
  .resume .rr{border-left:0;border-top:1px solid var(--line)}
  .outcomes ul{columns:1}
  .lesson-read{padding:24px 20px 60px}
  .lesson-code{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .mobile-tabs{display:flex}
  .task-pane{border-right:0;padding:18px 18px 50px}
  .mob-hide{display:none!important}
  .workbench.mode-output .wb-editor{display:none}
  .workbench.mode-output .wb-panel{flex:1 1 auto;border-top:0}
  .workbench.mode-code .wb-panel{display:none}
  .workbench.mode-code .wb-editor{flex:1 1 auto}
  .wb-resize{display:none}
  .lesson-row{grid-template-columns:26px 1fr auto;gap:10px}
  .lesson-row .num,.lesson-row .min{display:none}
  .cap-cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .cb-btn.cb-open .lbl{display:none}
  .hero h1{font-size:27px}
  .stats{grid-template-columns:1fr 1fr}
  .metric.streak span,.metric.xp span{display:none}
  .save-state{display:none}
  .deg-progress{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<script>
try {
  var cwSaved = localStorage.getItem('codewright-progress-v1');
  var cwTheme = cwSaved ? JSON.parse(cwSaved).theme : null;
  if (cwTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
} catch (e) {}
</script>
</head>
