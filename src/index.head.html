.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus>.iconrail{display:none}
.app.focus .topbar{display:none}
.app.focus .frame{grid-template-rows:0 auto auto minmax(0,1fr) auto}
.app.focus .rail,.app.focus .scrim{display:none}
.app.focus .body{grid-template-columns:minmax(0,1fr)}
.app.focus .main{padding:0}
.app.focus .page,.app.focus .lesson-read{max-width:860px;margin:0 auto;padding:30px 26px 34px}
.app.focus .crumb{display:none}
.app.focus .lesson-title{margin-top:0}
/* Where the unit carries its own prompt, the lesson title is the same sentence
   printed a second time. Let the prompt be the headline and drop the echo; units
   with no prompt (quiz, derive, build) keep their title as the only heading. */
.app.focus .page:has(.q-prompt) .lesson-title{display:none}
.app.focus .page:has(.q-prompt) .lesson-meta{margin-bottom:2px}
.app.focus .lesson-title h1{font-size:29px;letter-spacing:-.03em}
/* the read-in text is background, not the question - available, not in the way */
.app.focus .article{font-size:var(--t-read);color:var(--ink-3);border-left:2px solid var(--line);
  padding-left:16px;margin:14px 0 6px}
.app.focus .q-prompt{font-size:25px;font-weight:600;letter-spacing:-.025em;line-height:1.25;
  margin:22px 0 4px}
.app.focus .q-note{font-size:var(--t-read);color:var(--ink-3)}
/* the figure is the thing being reasoned about, so give it the room */
.app.focus .numq{grid-template-columns:minmax(0,1fr);gap:18px}
.app.focus .numq-fig{min-height:300px}
.app.focus .numq-side{max-width:none}
.app.focus .nq-in input{font-size:20px}
.degrade{display:flex;align-items:center;gap:12px;padding:10px 18px;
  border-bottom:1px solid color-mix(in srgb,var(--amber) 40%,transparent);
  background:color-mix(in srgb,var(--amber) 12%,transparent);font-size:var(--t-ui);color:var(--ink-2)}
.degrade[hidden]{display:none}
.dg-i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  background:var(--amber);color:#1a1400;font-weight:700;font-size:var(--t-meta)}
.dg-t{flex:1;line-height:1.5;text-wrap:pretty}
.dg-t b{color:var(--ink)}
.badge.unknown{opacity:.45;border-style:dashed}
.boot-wait{display:grid;place-items:center;height:100%;gap:14px;color:var(--ink-4);font-size:var(--t-ui)}
.boot-wait .bw-bar{width:190px;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.boot-wait .bw-bar i{display:block;width:40%;height:100%;background:var(--lime);animation:bwslide 1.1s ease-in-out infinite}
@keyframes bwslide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
.btn.sm{padding:5px 11px;font-size:var(--t-meta)}
.prog-card.lost{opacity:.72}
.prog-card.lost .pc-stats b{color:var(--ink-5)}
.pc-lost{margin-top:10px;padding:8px 11px;border-radius:var(--r);font-size:var(--t-meta);
  color:var(--ink-3);border:1px solid color-mix(in srgb,var(--amber) 34%,transparent);
  background:color-mix(in srgb,var(--amber) 10%,transparent)}
.pc-lost b{color:var(--ink-2)}
/* .rail-miss moved up beside the rest of the rail; it was --ink-5, the placeholder and
   disabled tier, at 1.87:1 dark and 2.01:1 light — on the one line in the rail that
   tells the learner a whole programme failed to load. */

/* ---------- circuit editor ---------- */
/* In a lesson the editor sits in the flow at its natural height; in the Playground
   it is the whole screen. `min-height:340px` was doing both jobs badly — it is a
   floor, and nothing was giving it a ceiling to grow into. */
.ckt{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  overflow:hidden;display:flex;flex-direction:column;min-height:0}
#ckt-mount>.ckt{flex:1;min-height:0;border-radius:0;border-left:0;border-right:0}
/* Filling the screen. `fixed` rather than the Fullscreen API alone, because the API
   can be refused and this cannot; the two are applied together and the class is the
   one that does the layout. A backdrop of --bg, since the editor is now over a page
   that would otherwise show round its edges. */
.ckt.full{position:fixed;inset:0;z-index:70;border:0;border-radius:0;background:var(--ground)}
/* An animation that can touch transform makes its element a containing block for
   position:fixed, so .page's own entry animation was quietly scoping the overlay to
   the article it sits in. Off while an editor is expanded — and the page behind it
   does not scroll, since nothing on it is reachable. */
body.ckt-expanded{overflow:hidden}
body.ckt-expanded .page{animation:none;transform:none}
/* The side panel widens by its GRID TRACK, not by its own width: .ckt-main lays the
   two out with template columns, so a width on the child would simply overflow the
   250px track it was placed in. */
.ckt.full .ckt-main{min-height:0;flex:1;grid-template-columns:minmax(0,1fr) 300px}
.ckt.full .ckt-canvas{min-height:0}
/* The element the browser hands the screen to is the same one, so it needs no second
   layout — only the reminder that its own background is not the page's. */
.ckt:fullscreen{background:var(--ground)}
.ckt-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--sunk);flex-wrap:wrap}
.ckt-bar .spacer{flex:1}
.ckt-tools{display:flex;gap:4px;flex-wrap:wrap}
.ckt-t{height:28px;min-width:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-2);
  background:transparent;color:var(--ink-3);font:600 11.5px var(--mono);cursor:pointer;
  transition:background .14s,color .14s,border-color .14s}
.ckt-t:hover{color:var(--ink);border-color:var(--line-3)}
.ckt-t.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}

/* ---- the parts palette ----
   A drawer per category, opened by its own summary. The panel is absolutely
   positioned so opening one does not reflow the toolbar under the pointer that is
   about to click into it — a menu that moves as it opens is a menu you misclick. */
/* The two convention buttons on the profile each preview the resistor they would
   draw, so the choice is made by looking rather than by knowing what ANSI means. */
.pcard-acts [data-sym-style]{display:inline-flex;align-items:center;gap:10px}
.sym-eg{width:52px;height:22px;display:block;flex:none}

.ckt-cat{position:relative}
.ckt-cat>summary{display:flex;align-items:center;gap:5px;list-style:none;user-select:none}
.ckt-cat>summary::-webkit-details-marker{display:none}
.ckt-caret{font-size:var(--t-label);line-height:1;opacity:.7;transition:transform .14s}
.ckt-cat[open]>summary{color:var(--ink);border-color:var(--line-3);background:var(--sunk)}
.ckt-cat[open] .ckt-caret{transform:rotate(180deg)}
/* the category that holds the part in hand says so while it is shut */
.ckt-cat.holds>summary{border-color:var(--lime);color:var(--lime)}
.ckt-cat[open].holds>summary{color:var(--lime)}
.ckt-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:12;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:4px;
  width:max(392px,100%);padding:6px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-solid);
  box-shadow:0 14px 34px rgba(0,0,0,.34)}
/* A shadow tuned for a dark ground reads as a smudge on a light one — the account
   menu two hundred lines down carries the same pair for the same reason. */
[data-theme=light] .ckt-menu{box-shadow:0 14px 34px rgba(15,25,5,.14)}
.ckt-p{display:grid;grid-template-rows:auto auto;justify-items:center;
  gap:3px;padding:7px 6px 6px;border-radius:var(--r);border:1px solid transparent;
  background:transparent;color:var(--ink-3);cursor:pointer;
  transition:background .14s,color .14s,border-color .14s}
.ckt-p:hover{background:var(--sunk);border-color:var(--line-2);color:var(--ink)}
.ckt-p.on{border-color:var(--lime);color:var(--lime);background:var(--lime-08)}
.ckt-ico{width:100%;height:34px;display:block}
/* Name and shortcut on one line, wrapping together. The cap sat in the tile corner
   until the ramp's 11px floor made it collide with the icon — and beside the name it
   reads as what it is, the same part reached a second way. */
.ckt-pl{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:5px}
.ckt-pn{font-family:var(--mono);font-weight:600;font-size:var(--t-label);
  text-align:center;line-height:1.3}
.ckt-kb{font-family:var(--mono);font-weight:600;font-size:var(--t-label);
  color:var(--ink-4);letter-spacing:var(--tr-mono)}
.ckt-p:hover .ckt-kb,.ckt-p.on .ckt-kb{color:inherit;opacity:.75}
.ckt-main{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:340px;
  flex:1;min-width:0}
#ckt-mount .ckt-main{min-height:0}
.ckt-canvas{position:relative;background:var(--editor);min-height:340px;cursor:crosshair;
  overflow:hidden}
#ckt-mount .ckt-canvas{min-height:0}
.ckt-canvas canvas{display:block}
/* The canvas is a focus stop now — it is the only way to reach the editor without a
   mouse — so the ring has to be visible against --editor, which is dark in both themes
   and so does not take the page's own :focus-visible offset well. Inset instead. */
.ckt-canvas canvas:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
/* The key map and the status line: read by assistive technology, no box on the page.
   Not display:none, which would take both out of the accessibility tree — the mistake
   the metric pill labels shipped with until it was measured. */
.ckt-vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
.ckt-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ckt-panel{padding:12px 14px;border-bottom:1px solid var(--line)}
/* --accent-ink, not --lime: this is the accent used as ink, and cycle 5 minted the
   token for exactly this trap. --lime on --surface measures 4.06:1 in the light theme,
   under the 4.5 a 10px uppercase heading needs. */
.ckt-panel h4{margin:0 0 9px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);
  text-transform:uppercase;color:var(--accent-ink)}
.ckt-hint{margin:0;font-size:var(--t-meta);line-height:1.55;color:var(--ink-4);text-wrap:pretty}
.ckt-f{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;margin-bottom:8px}
.ckt-f span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);white-space:nowrap}
.ckt-f input{height:28px;padding:0 8px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--editor);color:var(--ink);font:12px var(--mono);outline:none;min-width:0}
.ckt-f input:focus{border-color:var(--lime)}
.ckt-modes{margin-bottom:10px;flex-wrap:wrap}
.ckt-modes button{font-size:var(--t-label);padding:0 8px}
.ckt-opts{margin-bottom:10px}
.ckt-run{width:100%;height:32px}
.ckt-out{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.ckt-tab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:var(--t-meta)}
.ckt-tab td{padding:3px 0;color:var(--ink-2)}
/* --ink-5 is the placeholder-and-disabled tier and measures about 2:1 in both themes;
   cycle 5 moved .rail-miss off it for the same reason. This column is not a
   placeholder, it is the half of the answer that says WHICH node the volts beside it
   belong to — the row is unreadable without it. */
.ckt-tab td:first-child{color:var(--ink-3)}
/* The number the whole editor exists to produce, at 4.06:1 in the light theme on the
   same token trap as the heading above. */
.ckt-tab td:last-child{text-align:right;color:var(--accent-ink)}
.ckt-nodes{flex-wrap:wrap}
.ckt-nodes button{font-size:var(--t-label);padding:0 8px}
.ckt-err{font-size:var(--t-meta);line-height:1.6;color:var(--amber);text-wrap:pretty}
.ckt-plot{border-top:1px solid var(--line);background:var(--editor);padding:8px}
/* The plot canvas is laid out by CSS and only its backing store is set in JS. paintPlot
   used to measure the PARENT and set style.width from it, which under border-box
   included the 8px of padding above: the canvas came out 16px wider than its box at
   every viewport size and .ckt's overflow:hidden clipped the right-hand end of the
   trace. min-width keeps the old JS floor's intent — it does not bite at 375px, where
   the column leaves about 359px. */
.ckt-plot canvas{display:block;width:100%;min-width:320px}
.ckt-note{margin:12px 2px 0;font-size:var(--t-meta);line-height:1.6;color:var(--ink-4);max-width:70ch;text-wrap:pretty}
@media (max-width:860px){
  .ckt-main{grid-template-columns:1fr}
  .ckt-side{border-left:0;border-top:1px solid var(--line)}
}

/* ---------- the majors ---------- */
.page-head{margin-bottom:26px}
.page-head h1{margin:0 0 8px;font-size:30px;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.page-head p{margin:0;font-size:var(--t-read);color:var(--ink-3);max-width:62ch;text-wrap:pretty}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.prog-card{
  display:block;width:100%;text-align:left;padding:22px 24px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
  transition:border-color .18s,transform .18s,background .18s;animation:fadeUp .45s var(--ease) both;
}
.prog-card:hover{border-color:var(--lime-30);transform:translateY(-2px)}
.prog-card.empty{opacity:.82}
.pc-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px}
.pc-head>div{flex:1;min-width:0}
.pc-head h2{margin:0 0 7px;font-size:20px;font-weight:600;letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.pc-head h2 em{color:var(--lime);font-style:normal}
.pc-head p{margin:0;font-size:var(--t-ui);line-height:1.6;color:var(--ink-3);text-wrap:pretty}
.pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pc-stats .stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--ink);letter-spacing:-.02em}
.pc-stats .stat span{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-5)}
.pc-levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pc-bands{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.pc-bands li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:var(--t-ui);color:var(--ink-2)}
.pc-bands li+li{border-top:1px solid var(--line)}
.pb-icon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:var(--t-label);
  background:color-mix(in srgb,var(--tt,#fff) 22%,transparent);color:var(--ink-2)}
.pb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-n{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5);white-space:nowrap}
@media (max-width:560px){.pc-stats{grid-template-columns:repeat(2,1fr)}}

.year-band{margin:0 0 30px}
.year-head{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.year-badge{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:var(--t-body);color:var(--ink);
  background:color-mix(in srgb,var(--tt,var(--lime)) 20%,transparent);border:1px solid color-mix(in srgb,var(--tt,var(--lime)) 42%,transparent)}
.year-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.year-head p{margin:2px 0 0;color:var(--ink-4);font-size:var(--t-ui)}
.year-head .yr-prog{margin-left:auto;text-align:right;flex:none;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.year-head .yr-prog b{display:block;color:var(--ink);font-size:var(--t-read)}
.year-head .bar{width:110px;margin-top:5px}

.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:13px}
.course-card{
  position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:16px 18px;display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--ink);
  transition:border-color .18s,transform .18s var(--pop),box-shadow .18s;
}
.course-card:hover{border-color:var(--lv-b);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.course-card .cc-top{display:flex;align-items:center;gap:9px}
.course-card .cc-icon{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:var(--t-body);background:var(--lv-s);border:1px solid var(--lv-b);color:var(--lv)}
.course-card .cc-id{font-family:var(--mono);font-size:var(--t-label);font-weight:700;color:var(--ink-4);letter-spacing:var(--tr-mono)}
.course-card h3{margin:0;font-size:var(--t-body);font-weight:600;letter-spacing:-.015em;line-height:1.25}
.course-card p{margin:0;color:var(--ink-3);font-size:var(--t-ui);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.course-card .cc-chips{display:flex;flex-wrap:wrap;gap:5px}
.course-card .cc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:5px;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.course-card .cc-foot .spacer{flex:1}
.course-card.locked{opacity:.55}
.course-card.locked:hover{opacity:.85}
.course-card .lock-note{font-family:var(--sans);font-size:var(--t-label);color:var(--amber)}
.course-card.done-all{border-color:var(--lime-30)}

/* course page */
.course-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:26px;margin-bottom:24px;align-items:start}
.ch-id{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.ch-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--lv-s);border:1px solid var(--lv-b);color:var(--lv)}
.course-head h1{margin:0 0 9px;font-size:clamp(24px,3.2vw,31px);font-weight:600;letter-spacing:-.03em;line-height:1.08}
.course-head .lede{margin:0 0 16px;color:var(--ink-3);font-size:var(--t-body);max-width:60ch;text-wrap:pretty}
.meta-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;font-size:var(--t-ui)}
.meta-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:baseline}
.meta-card dt{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);white-space:nowrap}
.meta-card dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.meta-card dd.plain{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-2)}

.gate{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:13px 16px;margin:0 0 22px;font-size:var(--t-read);
  border:1px solid var(--amber-22);background:var(--amber-08);color:var(--amber)}
.gate.ok{border-color:var(--lime-30);background:var(--lime-08);color:var(--lime)}
.gate b{display:block;margin-bottom:3px;color:var(--ink)}
.gate .g-icon{font-size:var(--t-body);line-height:1.4}

.outcomes{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px 20px;margin:0 0 24px}
.outcomes h3{margin:0 0 10px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.outcomes ul{margin:0;padding-left:18px;columns:2;column-gap:30px}
.outcomes li{margin:4px 0;break-inside:avoid;font-size:var(--t-read);color:var(--ink-2)}

.mod-list{display:flex;flex-direction:column;gap:10px;margin:0 0 24px}
.mod{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.mod>.mod-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;text-align:left}
/* the sixth and last instance of the white-on-white hover, and the only one outside the
   shell, the button component and the editor chrome: 1.06:1 dark, 1.00:1 light. Left
   alone it would have been the one exception to a defect class this cycle otherwise
   closed, which serves the scope boundary rather than the reader. */
.mod>.mod-head:hover{background:rgba(255,255,255,.06)}
[data-theme=light] .mod>.mod-head:hover{background:rgba(15,25,5,0.06)}
.mod .mnum{font-family:var(--mono);font-size:var(--t-label);font-weight:700;color:var(--ink-4);flex:none}
.mod .mtitle{flex:1;min-width:0;font-size:var(--t-body);font-weight:600;letter-spacing:-.015em}
.mod .msum{display:block;margin-top:3px;font-family:var(--sans);font-weight:400;font-size:var(--t-ui);color:var(--ink-4)}
.mod .caret{color:var(--ink-4);font-size:var(--t-label);transition:transform .18s;flex:none}
.mod.open .caret{transform:rotate(90deg)}
.mod-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.mod-body h4{margin:15px 0 8px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.mod-body ul{margin:0;padding-left:17px}
.mod-body li{margin:5px 0;font-size:var(--t-read);color:var(--ink-2)}
.lab-row{
  display:flex;align-items:center;gap:12px;width:100%;margin-top:15px;padding:13px 15px;text-align:left;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);transition:all .18s;
}
.lab-row:hover{border-color:var(--lime-30);background:var(--lime-08)}
.lab-row .lab-t{flex:1;min-width:0}
.lab-row .lab-t b{display:block;font-size:var(--t-read);font-weight:600}
.lab-row .lab-t span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.lab-row .go{font-family:var(--mono);font-size:var(--t-label);color:var(--lime);white-space:nowrap}

.capstone-card{border:1px solid var(--line);border-top:2px solid var(--amber);border-radius:var(--r-lg);background:var(--surface);padding:20px 22px;margin:0 0 24px}
.cap-eyebrow{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--amber);font-weight:700}
.capstone-card h2{margin:7px 0 12px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.cap-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:14px}
.cap-cols h4{margin:0 0 7px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.cap-cols ul{margin:0;padding-left:17px}
.cap-cols li{margin:5px 0;font-size:var(--t-read);color:var(--ink-2)}
.rubric{width:100%;border-collapse:collapse;margin-top:16px;font-size:var(--t-read)}
.rubric th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.rubric td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.rubric td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.rubric td.w{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.rubric tr:last-child td{border-bottom:0}
.wbar{display:inline-block;width:48px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-left:8px;vertical-align:middle;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--amber);border-radius:99px}

.depmap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px 20px;margin:0 0 24px;overflow-x:auto}
.depmap h3{margin:0 0 14px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.depmap svg{display:block;min-width:640px}
.depmap .dn{cursor:pointer}
.depmap .dn rect{fill:var(--surface-2);stroke:var(--line-2)}
.depmap .dn.done rect{fill:var(--lime-08);stroke:var(--lime-30)}
.depmap .dn.here rect{fill:var(--lime-12);stroke:var(--lime);stroke-width:1.6}
.depmap .dn text{font:600 10px var(--mono);fill:var(--ink-3)}
.depmap .dn.here text{fill:var(--ink)}
.depmap .de{stroke:var(--line-2);fill:none}
.depmap .de.hot{stroke:var(--lime-30)}

/* track page */
.track-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px}
.track-head .t-icon{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface);border:1px solid var(--line)}
.track-head h1{margin:0 0 8px;font-size:clamp(25px,3.6vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.06}
.track-head p{margin:0 0 14px;color:var(--ink-3);font-size:var(--t-body);max-width:58ch}
.module{margin:0 0 22px}
.module h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:var(--t-body);font-weight:600;letter-spacing:-.01em}
.module h2 .mnum{font-family:var(--mono);font-size:var(--t-label);font-weight:700;color:var(--lime);background:var(--lime-08);border:1px solid var(--lime-30);padding:3px 7px;border-radius:5px}
.module .desc{margin:0 0 10px;color:var(--ink-4);font-size:var(--t-ui)}
.lesson-row{
  display:grid;grid-template-columns:26px 40px 1fr auto auto;align-items:center;gap:12px;width:100%;
  padding:11px 16px;margin:6px 0;text-align:left;color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:all .18s;
}
.lesson-row:hover{border-color:var(--lime-30);background:var(--lime-05)}
.lesson-row .num{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.lesson-row .ttl{font-size:var(--t-read);font-weight:500}
.lesson-row .min{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}

/* ---------- lesson: article ---------- */
.lesson-read{max-width:780px;margin:0 auto;padding:32px 40px 70px;animation:fadeUp .45s var(--ease) both}
.crumb{display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);margin-bottom:12px;flex-wrap:wrap}
.crumb button{color:var(--ink-3)}
.crumb button:hover{color:var(--lime)}
.lesson-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.lesson-title h1{margin:0;font-size:clamp(24px,3.2vw,31px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.lesson-title .lnum{font-family:var(--mono);font-size:var(--t-label);font-weight:700;color:var(--lime);background:var(--lime-08);border:1px solid var(--lime-30);padding:4px 8px;border-radius:5px}
.lesson-meta{display:flex;gap:9px;align-items:center;color:var(--ink-4);font-size:var(--t-ui);margin-bottom:24px;flex-wrap:wrap}
.article{font-size:var(--t-body);line-height:1.72;color:var(--ink-2)}
.article>*:first-child{margin-top:0}
/* The measure. .lesson-read is 780px wide with 40px of padding either side, so prose
   ran at 700px - about 93 characters at 15px, against the 45-75 a reader can track
   without losing the return sweep. The design already knew this: .pcard p caps at 64ch
   and .ckt-note at 70ch. The one surface carrying 1200-2500-word readings was the one
   that did not. Only prose is capped - code boxes, tables and display math keep the
   full column, so nothing that needs width loses it. */
.article>p,.article>ul,.article>ol,.article>blockquote,
.article>h2,.article>h3,.article>h4{max-width:66ch}
/* protectMath substitutes a display equation into the paragraph flow before renderMd
   ever sees it, so a $$...$$ line arrives as a <p> and would inherit the prose cap.
   MathML.render stamps display="block" (studio.js:293), which is the one hook that
   tells the two apart. A display equation gets the whole column, as it did before. */
.article>p:has(math[display=block]){max-width:none}
.article h2{margin:32px 0 10px;font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.2;color:var(--ink)}
.article h3{margin:24px 0 8px;font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;color:var(--ink)}
/* was 14px, i.e. smaller than the 15px body it introduces */
.article h4{margin:20px 0 6px;font-size:var(--t-body);font-weight:600;color:var(--ink)}
.article p{margin:0 0 14px;text-wrap:pretty}
.article ul,.article ol{margin:0 0 14px;padding-left:22px}
.article li{margin:5px 0}
.article li p{margin:0}
.article b,.article strong{color:var(--ink);font-weight:600}
/* var(--lime) on var(--lime-08) is 3.41:1 in the light theme, and inline code is the
   most repeated element in a reading. --code-ink is legible in both. */
.article code{font-size:.88em;color:var(--code-ink);background:var(--lime-08);padding:1px 5px;border-radius:4px}
.article pre code{background:none;padding:0;color:inherit;font-size:inherit}
/* A link in prose was hue alone, and the hue is 1.53:1 against the body text beside it
   in dark and 2.40:1 in light - under WCAG 1.4.1 that is not a distinguishable link.
   No authored reading contains one yet, which is exactly why nothing has caught it. */
.article a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:2px;transition:text-decoration-thickness .12s var(--ease)}
.article a:hover{color:var(--link);text-decoration-thickness:2px}
.article blockquote{margin:16px 0;padding:2px 0 2px 16px;border-left:2px solid var(--lime);color:var(--ink-2)}
.article blockquote p:last-child{margin:0}
.article hr{border:0;border-top:1px solid var(--line);margin:26px 0}
/* renderMd emits a bare <table> and .main is the page's scroll container, so a table
   wider than the column scrolled the whole pane sideways and took every line of prose
   with it. MA111's convergence tables are three columns of ten-significant-figure
   MathML, which cannot wrap: about 348px of cells against 335px of column at 375px.
   The table scrolls inside its own box now, and the box is focusable so that the
   scroll is reachable without a pointer. */
.article .tw{max-width:100%;overflow-x:auto;margin:0 0 16px;-webkit-overflow-scrolling:touch}
.article .tw>table{margin:0}
.article table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:var(--t-read)}
.article th,.article td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
/* 9.5px uppercase at .13em is under the legibility floor for the label that says what
   a column means - and it is the label a reader needs most when the cells are numbers. */
.article th{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
/* A runnable example: header strip, the code, and an output drawer that opens
   underneath it. Running never navigates away, so the reader keeps their place. */
.cbx{position:relative;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--sunk);overflow:hidden}
.cb-head{display:flex;align-items:center;gap:6px;padding:5px 7px 5px 14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
[data-theme=light] .cb-head{background:rgba(15,25,5,0.025)}
.cb-head .lang{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4)}
.cb-head .sp{flex:1}
.cb-btn{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-mono);font-weight:600;color:var(--ink-3);
  background:transparent;border:1px solid transparent;padding:3px 8px;border-radius:5px;white-space:nowrap;
  transition:color .15s,background .15s,border-color .15s}
.cb-btn:hover{color:var(--ink);background:rgba(255,255,255,0.06)}
[data-theme=light] .cb-btn:hover{background:rgba(15,25,5,0.06)}
.cb-btn.cb-run{color:var(--lime);background:var(--lime-08);border-color:var(--lime-30)}
.cb-btn.cb-run:hover{color:var(--lime-hi);background:var(--lime-12)}
.cb-btn[disabled]{opacity:.45;pointer-events:none}
.md-code{position:relative;margin:0;padding:14px 16px;overflow:auto;color:var(--ink-2);
  font-size:var(--t-ui);line-height:1.9;white-space:pre;-webkit-overflow-scrolling:touch}
.cb-out{border-top:1px solid var(--line);background:var(--ground);animation:fadeIn .2s both}
.cb-out-head{display:flex;align-items:center;gap:10px;padding:5px 7px 5px 14px;border-bottom:1px solid var(--line)}
.cb-out-head b{font-family:var(--mono);font-size:var(--t-label);font-weight:500;letter-spacing:var(--tr-caps);
  text-transform:uppercase;color:var(--ink-4)}
.cb-out-head .st{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.cb-out-head .st.ok{color:var(--lime)}
.cb-out-head .st.bad{color:var(--bad)}
.cb-out-head .sp{flex:1}
.cb-console{max-height:264px;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:var(--t-meta);
  line-height:1.72;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.cb-console .ln{display:block}
.cb-console .empty{color:var(--ink-5)}
.cb-preview{height:min(300px,52vh);background:#fff}
.cb-preview iframe{width:100%;height:100%;border:0;display:block}
.article-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.article-foot .spacer{flex:1}
.done-note{display:flex;align-items:center;gap:8px;color:var(--lime);font-weight:600;font-size:var(--t-ui)}

/* quiz */
.quiz-q{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px 22px;margin:0 0 14px}
.quiz-q .qn{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.quiz-q .qt{margin:0 0 14px;font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;line-height:1.5;color:var(--ink)}
/* --code-ink, not --lime: the light theme's --lime is #5F8A0B on its own 8% tint, which
   measures 3.65:1 as text. .explain code below has been on --code-ink since cycle 3 and
   these two were left with the note that changing them was Track 5's call. It is. */
.quiz-q .qt code{color:var(--code-ink);background:var(--lime-08);padding:1px 5px;border-radius:4px;font-size:.9em}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);
  font-size:var(--t-read);line-height:1.5;color:var(--ink-2);
  transition:border-color .16s,background .16s,color .16s;
}
/* .04 over an .02 card is a 2% step: 1.10:1, the faintest state in the application and
   under the 1.1 floor cycle 5 set for exactly this. .07 makes it a 5% step. */
.opt:hover:not(:disabled){border-color:var(--line-3);background:rgba(255,255,255,.07)}
/* a white wash over a white card is not a hover state */
[data-theme=light] .opt:hover:not(:disabled){background:rgba(15,25,5,.05)}
/* Answering disables all four, and two of them get no class at all — so the options
   nobody picked and nobody was told about kept the exact styling of a live button, with
   only the missing hover to say otherwise. They lose the raised fill and their key chip
   and sit flat on the card instead. Deliberately NOT opacity: at .62 the option text
   measured 4.41 / 3.38:1 and its A/B/C/D key 2.91 / 2.47, which would have made three
   quarters of every answered question harder to read than before — a repair that breaks
   what it was fixing. Here the option's own ink is untouched at 10.03 / 9.86 and the key
   goes to --ink-4 at 4.95 / 4.62, still over the floor. Two channels, because the fill
   alone is only 1.04:1 against the card. */
.opt:disabled{cursor:default}
.opt:disabled:not(.correct):not(.wrong){background:transparent;border-color:var(--line)}
.opt:disabled:not(.correct):not(.wrong) .k{background:transparent;border-color:var(--line);color:var(--ink-4)}
.opt .k{font-family:var(--mono);font-size:var(--t-label);font-weight:700;min-width:19px;height:19px;flex:none;margin-top:1px;
  border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-3)}
.opt code{color:var(--code-ink);background:var(--lime-08);padding:0 4px;border-radius:3px;font-size:.9em}
.opt.correct{border-color:var(--lime-30);background:var(--lime-08)}
/* --code-ink, not --accent-ink: this key sits on --lime-12 over the option's own
   --lime-08, two tints deep, where --accent-ink still measures 4.47:1 — under the floor
   by three hundredths. The darker of the two accent inks clears it at 5.47. */
.opt.correct .k{background:var(--lime-12);border-color:var(--lime-30);color:var(--code-ink)}
/* the dark theme's rose, hard-coded - a wrong answer in the light theme was painted
   from the wrong palette while var(--bad) beside it was the right one */
.opt.wrong{border-color:var(--bad-32);background:var(--bad-08)}
.explain{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:var(--t-ui);line-height:1.6;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.explain.good{border-color:var(--lime-30);background:var(--lime-08)}
.explain.bad{border-color:var(--bad-28);background:var(--bad-08)}
.explain p{margin:8px 0 0}
.explain .ex-head + p,.explain .ex-picked + p{margin-top:10px}
/* the sentence written for the option that was actually picked, above the account of
   the question as a whole. Weighted so it reads first without shouting. */
.explain .ex-picked{margin-top:10px;color:var(--ink);font-weight:500;
  border-left:2px solid var(--line-3);padding-left:10px}
.explain .ex-picked p{margin:0 0 6px}
.explain .ex-picked p:last-child{margin-bottom:0}
.explain.good .ex-picked{border-left-color:var(--lime-30)}
.explain.bad .ex-picked{border-left-color:var(--bad-28)}
/* A question stem may be a fenced block — EE131 M2 asks what five Python snippets
   print. Whitespace is the meaning there, so it is preserved and the box scrolls
   rather than letting the card do it. No Run button: see quizProse(). */
.quiz-q .qt p{margin:0 0 10px}
.quiz-q .qt p:last-child{margin:0}
/* --editor is dark in both themes, so the ink comes from --on-editor-2 rather than
   the page's, the same discipline palette() applies on a canvas */
.qcode{margin:10px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--editor);
  border:1px solid var(--on-editor-line);overflow-x:auto;font-family:var(--mono);
  font-size:var(--t-ui);line-height:1.65;color:var(--on-editor-2);white-space:pre;font-weight:400}
/* the same trap .article pre code already closes: the inline-code chip above would
   otherwise paint every token in the listing lime on a lime ground, with padding */
.qcode code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}
/* an explanation is full of `self.tail.next` and `& 0xFFFFFFFF`, and had no code
   style at all — browser-default monospace at full size, mid-sentence */
.explain code{font-family:var(--mono);font-size:.88em;color:var(--code-ink);
  background:var(--lime-08);padding:1px 5px;border-radius:4px}
.quiz-result{border:1px solid var(--lime-30);background:var(--lime-08);border-radius:var(--r-lg);padding:22px;margin:12px 0 0;animation:popIn .45s var(--pop) both}
.quiz-result .score{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.quiz-result p{margin:8px 0 14px;color:var(--ink-3);font-size:var(--t-ui)}

/* ---------- profile ---------- */
.prof-head{display:flex;align-items:center;gap:22px;margin-bottom:28px;flex-wrap:wrap}
.prof-av{
  width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));color:var(--on-avatar);
  font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--line-3);animation:popIn .5s var(--pop) both;
}
.prof-id{flex:1;min-width:260px}
.prof-id .eyebrow{margin-bottom:6px}
.prof-name{
  width:100%;max-width:420px;background:none;border:0;border-bottom:1px solid var(--line-2);
  color:var(--ink);font:600 26px/1.2 var(--sans);letter-spacing:-.03em;padding:2px 0 6px;outline:none;
  transition:border-color .16s;
}
.prof-name::placeholder{color:var(--ink-5)}
.prof-name:focus{border-bottom-color:var(--lime)}
.prof-sub{margin:10px 0 0;font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-4)}
.pcard{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:20px 22px;margin:0 0 14px;max-width:760px;
}
.pcard-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pcard-h b{font-size:var(--t-body);font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.pcard p{margin:0;font-size:var(--t-read);line-height:1.65;color:var(--ink-3);max-width:64ch;text-wrap:pretty}
.pcard .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-4)}
.pcard.good{border-color:var(--lime-22)}
.pcard.good .dot{background:var(--lime);box-shadow:var(--lime-glow)}
.pcard.warn{border-color:var(--amber-22);background:var(--amber-08)}
.pcard.warn .dot{background:var(--amber);box-shadow:0 0 10px rgba(255,198,109,.6)}
.pcard-acts{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.prof-warn{font-family:var(--mono);font-size:var(--t-label);color:var(--amber)}
.acc-form{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acc-in{flex:1;min-width:200px;height:34px;padding:0 12px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font:13px var(--sans);outline:none;transition:border-color .16s}
[data-theme=light] .acc-in{background:rgba(15,25,5,0.03)}
.acc-in::placeholder{color:var(--ink-5)}
.acc-in:focus{border-color:var(--lime-30)}
.sync-line{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-4)}
.pcard code{font-family:var(--mono);font-size:.88em;color:var(--lime);
  background:var(--lime-08);padding:1px 5px;border-radius:4px}

/* ---------- lesson: code (split) ---------- */
.lesson-code{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);height:100%;min-height:0;animation:fadeIn .35s both}
.task-pane{overflow:auto;padding:22px 28px 40px;border-right:1px solid var(--line);background:rgba(11,12,15,0.60)}
[data-theme=light] .task-pane{background:rgba(255,255,255,.5)}
.task-pane .article{font-size:var(--t-body);line-height:1.7}
.task-pane .article h2{font-size:var(--t-title);margin:22px 0 8px}
.task-pane .article h3{font-size:var(--t-body);margin:18px 0 6px}
.task-pane .lesson-title h1{font-size:23px;letter-spacing:-.025em}

.checks{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.checks h3{display:flex;justify-content:space-between;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-3);font-weight:500}
.checks h3 b{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:600}
.checks h3 b.allgood{color:var(--lime)}
.check{display:grid;grid-template-columns:28px 1fr;align-items:start;padding:9px 14px 9px 10px;border-bottom:1px solid var(--line);font-size:var(--t-ui)}
.check:last-child{border-bottom:0}
.check .gmark{margin-top:3px}
.check .name{color:var(--ink-2)}
.check.pass .name{color:var(--ink)}
.check .msg{font-family:var(--mono);font-size:var(--t-meta);color:var(--bad);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.check.pass{animation:fadeIn .3s ease}

.helpers{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.helper{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.helper>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 15px;text-align:left;font-size:var(--t-read);font-weight:600}
.helper>button:hover{background:rgba(255,255,255,.03)}
[data-theme=light] .helper>button:hover{background:rgba(15,25,5,.04)}
.helper>button span.k{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);font-weight:500}

/* ---------- responsive ---------- */
@media (max-width:1180px){.lesson-code{grid-template-columns:minmax(300px,46%) minmax(0,1fr)}}
/* Between the mobile drawer and a roomy desktop there is not enough width for the
   curriculum column and a usable editor at once — the workspace wins. */
@media (min-width:981px) and (max-width:1199px){
  .body.split{grid-template-columns:minmax(0,1fr)}
  .body.split .rail{display:none}
}
@media (max-width:980px){
  :root{--rail-icon:60px;--rail-w:272px}
  .menu-btn{display:grid}
  .body{grid-template-columns:minmax(0,1fr)}
  /* A closed drawer is translated off-screen, and a transform does not take anything
     out of the tab order. So on a phone, Tab from the menu button walked the whole
     curriculum tree — every programme heading, every band, every course in an open
     band — before reaching a word of the lesson. visibility:hidden removes it from
     both the tab order and the accessibility tree with no script and no feature test;
     it is delayed by the length of the slide so the closing animation still plays,
     and dropped to 0s on the way in so the drawer is focusable the moment it moves. */
  .rail{position:fixed;top:var(--topbar-h);left:var(--rail-icon);bottom:0;width:var(--rail-w);z-index:9;
    transform:translateX(-110%);visibility:hidden;
    transition:transform .22s var(--ease),visibility 0s linear .22s;background:var(--surface-solid)}
  .rail.open{transform:none;visibility:visible;transition:transform .22s var(--ease),visibility 0s;
    box-shadow:16px 0 48px rgba(0,0,0,.5)}
  [data-theme=light] .rail.open{box-shadow:16px 0 48px rgba(15,25,5,.18)}
  /* .frame's z-index:2 traps the drawer in a stacking context below #scrim (z 8),
     which is .frame's sibling — every tap in the open drawer would hit the scrim
     and just close it. Dropping the context here lets .rail's z 9 win. */
  .frame{z-index:auto}
  .body.no-rail .rail{display:block}
  .scrim.open{display:block}
  .search{display:none}
  .page{padding:24px 20px 50px}
  .deg-hero,.course-head{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .resume{grid-template-columns:1fr}
  .resume .rr{border-left:0;border-top:1px solid var(--line)}
  .outcomes ul{columns:1}
  .lesson-read{padding:24px 20px 60px}
  .lesson-code{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .mobile-tabs{display:flex}
  .task-pane{border-right:0;padding:18px 18px 50px}
  .mob-hide{display:none!important}
  .workbench.mode-output .wb-editor{display:none}
  .workbench.mode-output .wb-panel{flex:1 1 auto;border-top:0}
  .workbench.mode-code .wb-panel{display:none}
  .workbench.mode-code .wb-editor{flex:1 1 auto}
  .wb-resize{display:none}
  .lesson-row{grid-template-columns:26px 1fr auto;gap:10px}
  .lesson-row .num,.lesson-row .min{display:none}
  .cap-cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  /* Each nav button carries a whole lesson title and .btn is white-space:nowrap, so
     one long title pushed the article foot wider than the column. Let it grow down. */
  .article-foot{gap:8px}
  .article-foot .btn{white-space:normal;height:auto;min-height:36px;padding:8px 12px;
    text-align:center;max-width:100%;line-height:1.35}
  .cb-btn.cb-open .lbl{display:none}
  .hero h1{font-size:27px}
  .stats{grid-template-columns:1fr 1fr}
  /* Turning the two knobs the token block describes: 24px of the bar's own padding
     instead of 44, and 60px of gaps instead of 96. */
  .topbar{--topbar-gap:10px;--topbar-pad:12px}
  .metric{--metric-pad:8px}
  /* Even turned down that far it does not fit: a six-figure XP pill and a three-figure
     streak are 273.8px of furniture in 291px of bar, which leaves the screen title 17px.
     The streak is the one that changes what a reader does today, and it is the narrower
     of the two; the XP figure is a running total that is also on the avatar's label, on
     Progress and on Profile. It stands down here, and the title gets 86.4px. */
  .metric.xp{display:none}
  /* The pill labels were display:none, which takes them out of the accessibility tree
     too: what remained was a lime bubble reading "1,250" and an amber one reading "4".
     Hidden visually, kept for a screen reader — same zero contribution to the layout. */
  .metric.streak span,.metric.xp span{position:absolute;width:1px;height:1px;padding:0;
    margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  .screen-id span{display:none}
  /* This was `.save-state{display:none}`, which took the element out of the
     accessibility tree as well as out of the layout. On every phone the one channel
     that says progress is not being stored was gone entirely — and a phone in a private
     tab is exactly where it is not being stored. There is genuinely no room for the
     word: the topbar gate's furniture arithmetic has no column for this element and
     291px of bar has none to spare. So the word stands down and the announcement stays,
     which costs nothing because #save-state-say is .vh and out of flow. */
  .save-state{min-width:0}
  .save-state .ss-txt{display:none}
  .deg-progress{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

     resolves an unset theme to light unless the OS asks for dark. Reading only the saved
     value here meant a fresh visit on a light machine painted the dark palette and then
     flipped, after app.js booted. Same condition, before first paint. */
  if (cwTheme !== 'dark' && (cwTheme === 'light' ||
      !window.matchMedia || !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
} catch (e) {}
</script>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
