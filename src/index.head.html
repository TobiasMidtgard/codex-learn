<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Codex Learn — design tokens
   Dark is the design's own world; light is derived from the same
   hues so the theme toggle keeps working.
   ============================================================ */
:root{
  --ground:#08090B;
  --surface:rgba(16,18,22,0.72);
  --surface-solid:#101216;
  --surface-2:rgba(255,255,255,0.02);
  --nav:rgba(13,15,18,0.72);
  --head:rgba(10,11,14,0.60);
  --editor:#0A0B0E;
  /* Ink for anything drawn on the editor surface. That surface is deliberately dark
     in BOTH themes (see the light block below), so its ink cannot come from --ink,
     which flips to near-black. Every canvas in the app — schematics, sandboxes, the
     tune plot — was drawing black on black the moment the light theme was selected.
     Defined only here, so both themes get the same values. */
  --on-editor:#EDEFF3;
  --on-editor-2:#9BA3B0;
  /* The bottom of this ramp was a hierarchy of illegibility. --on-editor-3 was #565C68
     (2.93:1 dark, 2.72 light) and --on-editor-4 was #3A3F49 (1.86 / 1.73), and between
     them they are Sandbox.palette()'s `dim` and `faint` — the ink of 62 paint sites
     across 13 visualisers, 3 tune models, the analysis plot, the schematic canvas and
     the breadboard. 47 of those sites draw TEXT: tick labels, axis captions, MCU pin
     names, the bar-graph range, the H/L pin tags. `dim` is also the stroke of every
     WIRE the learner draws (circuit.js, the `cur.wires` pass) and of every plot axis.
     Both tiers now clear WCAG AA for small text in BOTH themes, because both are used
     for small text in both themes. The old hierarchy is re-expressed below the text
     floor by --on-editor-rule, for marks that carry meaning without being read. */
  --on-editor-3:#868E9C;
  --on-editor-4:#78808E;
  --on-editor-rule:#6A7280;
  /* The one job on this surface that wants to sit BELOW AA on purpose: a placeholder
     that reaches 4.5:1 stops being distinguishable from a filled field, which is the
     decision cycle 5 recorded when it declined to darken --ink-5 and cycle 11 wrote a
     floor of 2.5 into the budget for. It used to share --on-editor-3 with the canvas,
     which is why raising the canvas could not be done without a name for this. The
     value is the old --on-editor-3, unchanged. */
  --on-editor-hint:#565C68;
  --on-editor-line:rgba(255,255,255,.10);
  /* The same argument, for the accent colours. The rule above was applied to the ink
     and stopped there, so every curve, marker and reference line on a canvas still
     came from --lime/--blue/--purple/--amber — which the light theme re-tints DARK,
     for use on a light ground, while the ground underneath them stays #12151A. Against
     that surface the light values measure lime 4.47:1, amber 3.09, blue 3.06 and purple
     2.96, the last of those under WCAG 1.4.11's 3:1 floor for a graphical object that
     carries meaning; the purple is the Nyquist line, the 1/f corner, the constant-VSWR
     circle and the sliding surface. Defined only here, so both themes get 14.7, 11.8,
     6.8 and 6.7 instead. */
  --on-editor-lime:#C7F751;
  --on-editor-blue:#6E9BFF;
  --on-editor-purple:#A78BFA;
  --on-editor-amber:#FFC66D;
  /* The same argument a third time, for the three answer-state colours. --ans-ok/no/wait
     flip dark in the light theme because they are drawn on cards; the blanks listing and
     the numeric answer box are on --editor, which does not flip. Measured on #12151A the
     flipped values are 3.21, 2.90 and 3.07:1, on a surface whose whole content is the
     learner's own answer. Defined only here, so both themes get 8.45, 5.17 and 8.02.
     A tinted fill and a small lifted panel on that surface, for the same reason: --sunk
     and --surface-2 follow the theme and would paint a near-white bar on a dark box. */
  --on-editor-ok:#5BE58A;
  --on-editor-no:#FF5C7A;
  --on-editor-wait:#FFB020;
  --on-editor-sunk:rgba(255,255,255,0.04);
  --on-editor-fill:rgba(255,255,255,0.06);
  --sunk:rgba(8,9,11,0.60);

  --ink:#EDEFF3;
  --ink-2:#B7BCC6;
  --ink-3:#8A909C;
  /* was #565C68 - 2.97:1 on --ground. This tier carries the breadcrumb, the lesson
     meta row, table headers and the code-block language label. None of that is
     decorative, and all of it is under 13px. 4.95:1. */
  --ink-4:#787F8D;
  --ink-5:#3A3F49;

  --line:rgba(255,255,255,0.06);
  --line-2:rgba(255,255,255,0.09);
  --line-3:rgba(255,255,255,0.14);

  --lime:#C7F751;
  --lime-hi:#DFFF8F;
  --lime-deep:#8FD32B;
  --on-lime:#0A0C07;
  --lime-05:rgba(199,247,81,0.05);
  --lime-08:rgba(199,247,81,0.08);
  --lime-12:rgba(199,247,81,0.12);
  --lime-22:rgba(199,247,81,0.22);
  --lime-30:rgba(199,247,81,0.30);
  --lime-glow:0 0 14px rgba(199,247,81,0.50);

  --blue:#6E9BFF;
  --purple:#A78BFA;
  --amber:#FFC66D;
  --rose:#FF8A94;
  /* sky, teal and pink existed only as literal hexes inside .chip rules, which is why
     seven of the eleven unit-type chips had no light theme at all. */
  --sky:#9CD5FF;
  --teal:#5EEAD4;
  --pink:#F472B6;
  --blue-12:rgba(110,155,255,0.12);
  --blue-28:rgba(110,155,255,0.28);
  --purple-12:rgba(167,139,250,0.12);
  --purple-28:rgba(167,139,250,0.28);
  --amber-08:rgba(255,198,109,0.08);
  --amber-22:rgba(255,198,109,0.22);
  --sky-12:rgba(156,213,255,0.12);
  --sky-28:rgba(156,213,255,0.28);
  --teal-12:rgba(94,234,212,0.12);
  --teal-28:rgba(94,234,212,0.28);
  --pink-12:rgba(244,114,182,0.12);
  --pink-28:rgba(244,114,182,0.28);
  --bad-08:rgba(255,138,148,0.08);
  --bad-28:rgba(255,138,148,0.28);
  --bad-32:rgba(255,138,148,0.32);
  --code-ink:var(--lime);
  --link:var(--lime);
  /* The accent used as ink ON its own tint, which is not the same job as --lime.
     --lime is also .btn.primary's BACKGROUND against --on-lime, so it cannot be
     darkened for the light theme without dropping the button. Every "current" and
     "on" affordance in the shell — the lit section icon, the rail-panel toggle, the
     XP figure, the rail's programme headings — is --lime drawn on --lime-08, and in
     the light theme that measured 3.61–3.93:1 while the IDLE state beside it measured
     4.82–4.95. The current section was fainter than the ones you are not on. */
  --accent-ink:var(--lime);
  /* Ink on the avatar's blue-to-purple gradient. Those two tokens are pale in the
     dark theme and dark in the light one, so a fixed near-black ink measured 7.2:1
     dark and 3.2:1 light on 12px text. Defined per theme, not once. */
  --on-avatar:#0B0C0E;
  /* The unfilled status ring. It was --line-3, the generic hairline, which is 1.43:1
     dark and 1.61:1 light on the rail — invisible, in a column whose whole job is to
     say "not started yet", and which renderBuild also uses for a check that has not
     run. Aimed at WCAG 1.4.11's 3:1 rather than past it, on every surface a .gmark is
     drawn on: 3.44 rail, 3.33 card, 3.27 mobile drawer here, and 3.22/3.33/3.36 in
     the light block. Quiet, and over the floor. */
  --mark-idle:#666666;

  --ok:var(--lime);
  --bad:#FF8A94;
  --warn:var(--amber);

  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --r-sm:6px; --r:9px; --r-md:12px; --r-lg:16px; --r-xl:18px;
  /* ---- the type ramp ----
     The application had 36 distinct type sizes and no scale. 285 of its 323 font-size
     declarations sat below 18px, spread over FIFTEEN values in half-pixel steps —
     9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 13.5, 14, 14.5, 15, 16, 16.5, 17 — whose
     adjacent ratios run 1.034 to 1.053. A 4% difference is not a distinction anyone
     perceives, so the hierarchy those fifteen values existed to express did not reach
     the screen: two elements meant to read as different levels rendered as the same
     one. Sixty-one rules were under 11px, nine of them at 9.5px in tracked uppercase
     mono — the smallest type in the file, on labels nobody can skip reading, on a
     canvas-free surface where a browser's text zoom is the only remedy and the layout
     around them was not built to take it.
     Six steps, every one a whole pixel, every adjacent ratio at least 1.071. Named for
     the job rather than numbered, because a size is chosen by what it labels. Held by
     the `type` section of tools/verify_theme.mjs, which is what stops a sixteenth value
     being added the way the first fifteen were. */
  --t-label:11px;   /* tracked mono labels, ids, keys, badges — the floor */
  --t-meta:12px;    /* counts, captions, secondary meta */
  --t-ui:13px;      /* dense controls: chips, buttons, rail rows */
  --t-read:14px;    /* prose and question text */
  --t-body:15px;    /* the document's own size */
  --t-title:17px;   /* card and panel titles */
  /* Tracking is the other half of a type scale, and it had the same defect: all 36
     positive letter-spacing declarations sit on --t-label doing one job — a small mono
     label, 33 of them uppercase — and they carried TWELVE values between .01em and
     .16em, with .1em and .10em written separately for the same number. Uppercase mono
     at 11px needs to be opened up or the caps close into a block; that is one decision,
     so it is one token. .14em is where 13 of the 36 already were, the largest group. */
  --tr-caps:.14em;  /* uppercase mono micro-labels — eyebrows, captions, table heads */
  --tr-mono:.03em;  /* mono that is not uppercase: ids and code buttons */
  --rail-icon:72px; --topbar-h:60px; --rail-w:262px;
  /* The topbar's furniture is fixed-width and it did not fit a phone. At 375px the
     icon rail takes 60, the bar's own padding 44 and its six gaps 96, leaving 131 for
     three 32px buttons and two metric pills whose padding alone is 48 — 275.4px of
     content in 271px of bar, before a single character of the screen title. .screen-id
     has min-width:0 and the largest flex base, so it absorbed the whole overflow and
     the title vanished; the bar was still over, so the buttons shrank below their
     32px box. These two knobs are what the 640px block turns down. */
  --topbar-gap:16px; --topbar-pad:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --pop:cubic-bezier(.2,.9,.3,1.4);
  color-scheme:dark;
}
[data-theme=light]{
  --ground:#F4F6F1;
  --surface:rgba(255,255,255,0.88);
  --surface-solid:#FFFFFF;
  --surface-2:rgba(15,20,10,0.02);
  --nav:rgba(255,255,255,0.80);
  --head:rgba(255,255,255,0.72);
  --editor:#12151A;              /* code stays dark in both themes */
  --sunk:rgba(15,20,10,0.04);

  --ink:#131712;
  --ink-2:#3D4539;
  --ink-3:#616B59;
  --ink-4:#69725F;               /* was #89927F - also 2.97:1; now 4.62:1 */
  --ink-5:#AEB6A5;

  --line:rgba(15,25,5,0.09);
  --line-2:rgba(15,25,5,0.14);
  --line-3:rgba(15,25,5,0.22);

  --lime:#5F8A0B;                /* legible on light ground */
  --lime-hi:#4C7005;
  --lime-deep:#87C22A;
  --on-lime:#0A0C07;
  --lime-05:rgba(95,138,11,0.05);
  --lime-08:rgba(95,138,11,0.09);
  --lime-12:rgba(95,138,11,0.13);
  --lime-22:rgba(95,138,11,0.22);
  --lime-30:rgba(95,138,11,0.32);
  --lime-glow:0 0 12px rgba(135,194,42,0.35);

  /* --amber was #9A6512: 4.54:1 on the ground, but 4.15:1 on its own --amber-08 tint,
     which is where .chip.blanks and .chip.project actually sit. #8A5A12 is 4.97:1
     there, and is already this palette's .tk-unit. */
  --blue:#2C5BD0; --purple:#6D48C7; --amber:#8A5A12; --rose:#C1373F;
  --sky:#0B6382;
  --teal:#0B6B5E;
  --pink:#A81F6B;
  --blue-12:rgba(44,91,208,0.10);
  --blue-28:rgba(44,91,208,0.28);
  --purple-12:rgba(109,72,199,0.10);
  --purple-28:rgba(109,72,199,0.28);
  --amber-08:rgba(138,90,18,0.08);
  --amber-22:rgba(138,90,18,0.22);
  --sky-12:rgba(11,99,130,0.10);
  --sky-28:rgba(11,99,130,0.28);
  --teal-12:rgba(11,107,94,0.10);
  --teal-28:rgba(11,107,94,0.28);
  --pink-12:rgba(168,31,107,0.10);
  --pink-28:rgba(168,31,107,0.28);
  --bad-08:rgba(193,55,63,0.08);
  --bad-28:rgba(193,55,63,0.28);
  --bad-32:rgba(193,55,63,0.32);
  /* var(--lime) is 3.41:1 as text on var(--lime-08). Inline code is the most repeated
     element in a 2000-word reading; #3F6212 is this palette's .tk-str and 5.9:1. */
  --code-ink:#3F6212;
  --link:#4C7005;                /* var(--lime) is 3.76:1 on the ground; this is 5.3:1 */
  /* the same ink the links use: 5.13:1 on --lime-08 over the icon rail, 5.10 over the
     topbar, 5.01 over the rail, 5.55 on the rail's own ground. No new hue enters the
     palette — this is --lime-hi, named for the job it is doing. */
  --accent-ink:#4C7005;
  --on-avatar:#FFFFFF;           /* 5.98:1 on the blue end, 6.17:1 on the purple */
  --mark-idle:#8C8C8C;           /* 3.22 rail, 3.33 card, 3.36 drawer */
  --bad:#C1373F;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:var(--t-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
/* Same look as :disabled, without the blur. A button that disables itself while a
   request is in flight takes focus with it — the browser will not keep focus on a
   disabled element — so the keyboard user who pressed it is thrown to the top of the
   document and has to find their way back to read the answer. aria-disabled says the
   same thing to assistive technology and leaves focus where the learner put it; the
   handler's own re-entry guard is what actually refuses the second press. */
button[aria-disabled=true],.is-busy{cursor:default;opacity:.5}
a{color:var(--lime);text-decoration:none}
a:hover{color:var(--lime-hi)}
::selection{background:rgba(199,247,81,0.25)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ed-ta:focus-visible{outline:none}
code,pre,kbd{font-family:var(--mono)}
[hidden]{display:none!important}
input{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:10px;border:3px solid var(--ground)}
::-webkit-scrollbar-track{background:transparent}
[data-theme=light] ::-webkit-scrollbar-thumb{background:rgba(15,25,5,0.16)}

/* ---------- the design's motion vocabulary ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{from{stroke-dashoffset:999}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes barGrow{from{width:0}}

/* ---------- shell ---------- */
/* grid-template-rows must be stated: without it the single implicit row is
   auto-sized to its content, so a tall screen grows past 100dvh and .app's
   overflow:hidden clips it — .main never becomes the scroll container. */
.app{display:grid;grid-template-columns:var(--rail-icon) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;position:relative;overflow:hidden}
/* On every screen the DOM runs brand, four section icons, avatar, drawer, panel
   toggle, search, notepad, theme — and then, before a word of the lesson, the entire
   curriculum rail. With one band open that is upwards of forty controls between the
   keyboard and the content, on every page. */
.skip{position:absolute;left:8px;top:-60px;z-index:20;height:34px;display:inline-flex;align-items:center;
  padding:0 14px;border-radius:var(--r);font-size:var(--t-ui);font-weight:600;
  background:var(--lime);color:var(--on-lime);text-decoration:none;
  transition:top .16s var(--ease)}
.skip:focus{top:8px}
.skip:hover{color:var(--on-lime)}
#main:focus{outline:none}
.blob{position:absolute;pointer-events:none;z-index:0}
.blob.a{top:-260px;left:180px;width:820px;height:520px;filter:blur(30px);
  background:radial-gradient(ellipse at center,rgba(199,247,81,0.10),transparent 62%);
  animation:drift 22s ease-in-out infinite}
.blob.b{bottom:-300px;right:-120px;width:760px;height:600px;filter:blur(40px);
  background:radial-gradient(ellipse at center,rgba(110,155,255,0.10),transparent 62%);
  animation:drift 28s ease-in-out infinite reverse}
[data-theme=light] .blob{opacity:.55}

/* icon rail */
.iconrail{
  grid-row:1/-1;width:var(--rail-icon);border-right:1px solid var(--line);
  background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;gap:22px;
  position:relative;z-index:6;
}
.logo{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--lime),var(--lime-deep));
  box-shadow:0 6px 22px color-mix(in srgb,var(--lime) 30%,transparent);
  animation:popIn .5s var(--pop) both;
}
.logo span{font-family:var(--mono);font-weight:700;font-size:var(--t-title);color:var(--on-lime)}
.iconnav{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.inav{
  position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-4);transition:color .18s,background .18s;
}
/* The wash was rgba(255,255,255,0.05) with no light override, over --nav, which the
   light theme makes rgba(255,255,255,0.80). White on white: the hover state on the
   primary navigation measured 1.00:1 against its own idle state — not faint, absent.
   .tbtn, .rail-track>button and the rail rows all carry the override; this one was
   missed, and it is the only nav on the screen. */
.inav:hover{color:var(--ink);background:rgba(255,255,255,0.05)}
[data-theme=light] .inav:hover{background:rgba(15,25,5,0.06)}
/* --lime-08 separated the current section from the others by 1.17:1 in the dark theme
   and 1.11:1 in the light one. --lime-22 makes that 1.77 and 1.30 while the icon,
   which is a graphical object and not text, still measures 8.78:1 and 4.38:1. */
.inav.active{color:var(--accent-ink);background:var(--lime-22)}
.inav.active::before{
  content:"";position:absolute;left:-17px;top:50%;transform:translateY(-50%);
  width:2px;height:20px;border-radius:2px;background:var(--lime);
  box-shadow:0 0 10px color-mix(in srgb,var(--lime) 80%,transparent);
}
.inav svg{width:19px;height:19px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail-foot .div{width:30px;height:1px;background:var(--line-2)}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--blue),var(--purple));
  font-size:var(--t-meta);font-weight:600;color:var(--on-avatar);border:1px solid var(--line-3);
  cursor:pointer;flex:none;
}
.avatar[aria-current]{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--lime)}

/* header */
.frame{display:grid;grid-template-columns:minmax(0,1fr);/* topbar, then the degraded-state banner (auto: zero when it is display:none),   then the body. Adding a child without adding a row put the banner in the   body’s 1fr track and pushed the body into an implicit one. */grid-template-rows:var(--topbar-h) auto auto minmax(0,1fr) auto;min-width:0;min-height:0;position:relative;z-index:2}
.topbar{
  height:var(--topbar-h);display:flex;align-items:center;gap:var(--topbar-gap);padding:0 var(--topbar-pad);
  border-bottom:1px solid var(--line);background:var(--head);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
/* min-width:0 was already here and is what lets this shrink; it does not need to grow,
   and giving it flex-grow would split the free space with .spacer and stop the metrics
   and tool buttons sitting against the right edge on a wide screen. */
.screen-id{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
/* b was nowrap with no overflow rule of its own, so a long title was clipped mid-glyph
   at .screen-id's edge rather than ellipsised. */
.screen-id b{font-size:var(--t-read);font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.screen-id span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;width:220px;
  border-radius:var(--r);border:1px solid var(--line-2);background:rgba(255,255,255,0.03);
}
[data-theme=light] .search{background:rgba(15,25,5,0.03)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:var(--t-ui)}
.search input::placeholder{color:var(--ink-4)}
.search .kbd{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);border:1px solid var(--line-2);border-radius:4px;padding:1px 4px}
/* flex:none on every fixed control in the bar. A flex item's automatic minimum size
   is its min-content, which for .tbtn is one 14px glyph and for .menu-btn an 18px
   svg — so under pressure the theme, notepad and drawer buttons shrank straight
   through WCAG 2.5.8's 24x24 floor. They are the affordances, not the slack. */
.metric{display:flex;align-items:center;gap:6px;height:32px;padding:0 var(--metric-pad,12px);
  border-radius:var(--r);white-space:nowrap;flex:none}
.metric.streak{border:1px solid var(--amber-22);background:var(--amber-08)}
.metric.streak b{font-family:var(--mono);font-size:var(--t-meta);font-weight:700;color:var(--amber)}
.metric.streak .fl{font-size:var(--t-ui);display:inline-block;animation:flame 2.4s ease-in-out infinite}
.metric.xp{border:1px solid var(--lime-22);background:var(--lime-08)}
.metric.xp b{font-family:var(--mono);font-size:var(--t-meta);font-weight:700;color:var(--accent-ink)}
.metric span{font-size:var(--t-label);color:var(--ink-3)}
.tbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);
  color:var(--ink-3);font-size:var(--t-read);flex:none}
.tbtn:hover{background:rgba(255,255,255,0.06);color:var(--ink)}
[data-theme=light] .tbtn:hover{background:rgba(15,25,5,0.06)}
.save-state{font-size:var(--t-label);font-family:var(--mono);color:var(--ink-4);min-width:44px;text-align:right;flex:none}
.save-state.bad{color:var(--amber);font-weight:600}
/* Read by assistive technology, no box on the page. Not display:none, which takes the
   node out of the accessibility tree along with the layout — the mistake the topbar's
   own metric pills shipped with until they were measured, and the one the 640px rule
   below made with the whole save indicator. */
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
.menu-btn{display:none;width:32px;height:32px;border-radius:var(--r);place-items:center;color:var(--ink-3);flex:none}
.rail-btn{flex:none;color:var(--ink-4)}
.rail-btn svg{width:17px;height:17px}
.rail-btn.on{color:var(--accent-ink);background:var(--lime-22)}
@media (max-width:980px){.rail-btn{display:none}}
.menu-btn svg{width:18px;height:18px}

/* body + tree rail */
.body{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0;min-width:0;overflow:hidden}
.body.no-rail{grid-template-columns:minmax(0,1fr)}
.body.no-rail .rail{display:none}
.rail{
  border-right:1px solid var(--line);overflow:auto;padding:14px 0 30px;
  background:rgba(11,12,15,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
[data-theme=light] .rail{background:rgba(255,255,255,0.5)}
.main{min-width:0;min-height:0;overflow:auto}
/* the planner is a full-bleed layout that scrolls its own columns, so the pane
   must not scroll or pad around it */
.main.bleed{overflow:hidden;padding:0}
.main.split{overflow:hidden}
.scrim{display:none;position:fixed;inset:0;background:rgba(4,5,7,.6);z-index:8}

.rail-sec{
  margin:6px 0 4px;padding:10px 18px 6px;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--accent-ink);
}
.rail-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rail-track{margin:1px 0}
.rail-track>button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;text-align:left;
  border-radius:0;transition:background .15s var(--ease)}
/* 0.04 separated a hovered row from an unhovered one by 1.07:1 dark and 1.08:1 light,
   while .tbtn two hundred lines up used 0.06 and reached 1.12/1.13. Same wash, same
   number, so the whole shell answers a pointer with the same weight. */
.rail-track>button:hover{background:rgba(255,255,255,0.06)}
[data-theme=light] .rail-track>button:hover{background:rgba(15,25,5,0.06)}
/* The band's tint is authored in the spine, passed into this element as --tt by
   renderRail, and was then dropped: the rule read --surface-2 and every band icon in
   the rail was the same grey, while .year-badge and .pb-icon — the same icon, the same
   band, two screens away — carried the colour. The tint layers OVER --surface-2 rather
   than replacing it, and the border stays neutral, because the six spine tints are
   pale (#E4EEFA, #FFE9DC …) and tuned for a dark ground: against the rail they measure
   1.56–1.59:1 in the dark theme and 1.01–1.02:1 in the light one, so replacing the
   grey outright would have traded a visible chip for an invisible one on half the
   installs. This way dark goes 1.03 -> 1.62 and light stays where it was. */
.rail-track .t-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:var(--t-ui);flex:none;
  background-color:var(--surface-2);
  background-image:linear-gradient(color-mix(in srgb,var(--tt,transparent) 18%,transparent),
                                   color-mix(in srgb,var(--tt,transparent) 18%,transparent));
  border:1px solid var(--line)}
.rail-track .t-name{font-weight:600;font-size:var(--t-read);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-track .t-pct{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.rail-module{padding:4px 0 6px}
/* a track nested inside a band: its lessons indent one step further than a course, and
   its id cell carries the disclosure chevron rather than a course id. It was 9px — the
   only expand/collapse affordance in the rail, at the smallest size in the file. */
.rail-sub>button .cid{font-size:var(--t-label)}
.rail-module.sub{padding:2px 0 4px}
.rail-module.sub h4{margin-left:67px}
.rail-module.sub .rail-lesson{padding-left:12px}
/* was 9.5px, the smallest type in the application, on a module title — the same
   inversion the reading surface's 9.5px table headers were raised out of. */
.rail-module h4{margin:9px 18px 5px 55px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4);font-weight:500}
.rail-lesson,.rail-course{
  display:grid;align-items:center;width:100%;text-align:left;font-size:var(--t-ui);color:var(--ink-3);
  padding:5px 16px;border-left:2px solid transparent;
  transition:background .15s var(--ease),color .15s var(--ease);
}
/* 30px against an 8px right pad held 22px of glyph, which is 3.6 characters of
   JetBrains Mono at the 10px this row used to be. A lesson number is written by
   app.js in one of two forms — "<module>·<kind><n>" for a catalogue course
   (app.js:181), "<module>.<lesson>" for a foundation track (app.js:23) — and 596
   of the 1990 the rail can draw are four or five characters ("1·r2", "10·r2").
   Because the cell is text-align:right inside overflow:hidden it does not
   ellipsise, it cuts the LEADING glyph: "10·r2" was drawn as "0·r2", the number
   of a different module. 30% of the rail showed a number belonging to another
   lesson, and the id column one rule below had been measured against its own
   longest string for two cycles while this one was never measured at all.
   41px holds the longest five glyphs at --t-label (33px) plus the 8px pad. */
.rail-lesson{grid-template-columns:41px 22px minmax(0,1fr)}
/* The id track was 32px against a 9px right pad, so it held 23px of text. Fifteen of
   the sixty-two course ids are seven characters (CTRL510, VLSI510, ELEC430 …), which
   at 10px JetBrains Mono — 0.6em per glyph — is 42px: text-align:right spilled 19px
   leftwards, through the row's 16px padding and 3px past the rail's own edge. */
.rail-course{grid-template-columns:55px 22px minmax(0,1fr) auto}
.rail-lesson:hover,.rail-course:hover{background:rgba(255,255,255,0.06);color:var(--ink)}
[data-theme=light] .rail-lesson:hover,[data-theme=light] .rail-course:hover{background:rgba(15,25,5,0.06)}
/* same argument as .inav.active: 1.16/1.11 against the rail becomes 1.75/1.29, and the
   row's own title still measures 9.83:1 and 13.42:1 on it. */
.rail-lesson.active,.rail-course.active{background:var(--lime-22);color:var(--ink);border-left-color:var(--lime)}
.rail-lesson .num,.rail-course .cid{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);text-align:right;padding-right:8px;overflow:hidden}
.rail-lesson .ttl,.rail-course .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-course .lk{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);padding-left:6px}
.rail-miss{padding:6px 14px 12px;font-size:var(--t-meta);color:var(--ink-3);font-style:italic}

/* status marks */
.gmark{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--mark-idle);display:inline-block;justify-self:center;position:relative;flex:none}
.gmark.done{background:var(--lime);border-color:var(--lime);box-shadow:0 0 8px color-mix(in srgb,var(--lime) 35%,transparent)}
.gmark.done::after{content:"";position:absolute;left:3.5px;top:1.5px;width:3px;height:6px;border:solid var(--on-lime);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.gmark.now{border-color:var(--lime);background:var(--lime);box-shadow:0 0 0 3px var(--lime-12)}
.gmark.part{border-color:var(--lime);background:linear-gradient(90deg,var(--lime) 50%,transparent 50%)}
.gmark.fail{border-color:var(--bad);background:var(--bad)}
.gmark.fail::after,.gmark.fail::before{content:"";position:absolute;left:5.5px;top:2.5px;width:1.5px;height:7px;background:#fff}
.gmark.fail::after{transform:rotate(45deg)}
.gmark.fail::before{transform:rotate(-45deg)}
.gmark.run{border-color:var(--amber);border-style:dashed}
.gmark.lock{border-style:dotted;opacity:.55}

/* ---------- buttons, chips ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  height:36px;padding:0 16px;border-radius:var(--r);font-size:var(--t-ui);font-weight:600;
  border:1px solid var(--line-2);color:var(--ink-3);background:transparent;
  transition:transform .18s var(--pop),box-shadow .18s,border-color .18s,color .18s,background .18s;
}
.btn:hover{border-color:var(--line-3);color:var(--ink)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(199,247,81,0.28);color:var(--on-lime)}
/* The same accent-on-its-own-tint as the shell's XP figure and lit toggles: a --lime
   label on --lime-12 measures 3.48:1 in the light theme. --accent-ink makes it 4.92. */
.btn.accent{background:var(--lime-12);border-color:var(--lime-30);color:var(--accent-ink)}
.btn.accent:hover{background:var(--lime-22);color:var(--accent-ink)}
.btn.ghost{border-color:transparent}
/* and the same white-on-white as .inav:hover, three more times. In the light theme
   .btn.dark had NO fill (1.00:1 against the card it sits on), its hover was invisible
   (1.00:1), and so was .btn.ghost's. .btn.dark ships inside the shell's own degraded
   -state banner as the "Try again" button, which is why they are in this cycle. */
.btn.ghost:hover{background:rgba(255,255,255,0.05)}
[data-theme=light] .btn.ghost:hover{background:rgba(15,25,5,0.06)}
.btn.sm{height:30px;padding:0 12px;font-size:var(--t-meta);border-radius:8px}
.btn.dark{background:rgba(255,255,255,0.05);border-color:var(--line-2);color:var(--ink-2)}
[data-theme=light] .btn.dark{background:rgba(15,25,5,0.05)}
.btn.dark:hover{background:rgba(255,255,255,0.09);color:var(--ink)}
[data-theme=light] .btn.dark:hover{background:rgba(15,25,5,0.10)}
.btn.run{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.btn.run:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(199,247,81,0.28)}
.btn.run:disabled{background:rgba(255,255,255,0.06);border-color:var(--line-2);color:var(--ink-4);transform:none;box-shadow:none}
.btn.success{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
kbd{font-family:var(--mono);font-size:var(--t-label);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-4)}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-sm);
  font-size:var(--t-label);font-weight:600;letter-spacing:0;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;
}
.chip.mono{font-family:var(--mono);font-size:var(--t-label);font-weight:500}
/* Ten of these render on every lesson page, in .lesson-meta, and again in the rail.
   Seven carried a dark-theme pastel as a literal hex with no light override - and
   effectiveTheme() (app.js:558) returns 'light' whenever the OS is not set to dark,
   so the first thing a new visitor on a light machine saw was a `Tune` chip at 1.28:1
   and a `Fill in` chip at 1.56:1. Each chip now takes its hue from a token that has a
   value in both themes. The hue families are the ones the original author picked. */
.chip.read{color:var(--blue);border-color:var(--blue-28);background:var(--blue-12)}
.chip.sandbox{color:var(--sky);border-color:var(--sky-28);background:var(--sky-12)}
.chip.derive{color:var(--purple);border-color:var(--purple-28);background:var(--purple-12)}
.chip.blanks{color:var(--amber);border-color:var(--amber-22);background:var(--amber-08)}
.chip.tune{color:var(--teal);border-color:var(--teal-28);background:var(--teal-12)}
.chip.match{color:var(--purple);border-color:var(--purple-28);background:var(--purple-12)}
.chip.numeric{color:var(--blue);border-color:var(--blue-28);background:var(--blue-12)}
/* `build` had no colour of its own, so a circuit-building unit rendered as an
   unstyled chip among nine styled ones. Rose, because it is the only kind that
   asks the learner to draw rather than to answer. */
.chip.build{color:var(--pink);border-color:var(--pink-28);background:var(--pink-12)}
.chip.quiz{color:var(--purple);border-color:var(--purple-28);background:var(--purple-12)}
.chip.code,.chip.lab{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.project,.chip.capstone{color:var(--amber);border-color:var(--amber-22);background:var(--amber-08)}
.chip.done{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.level{color:var(--lv);border-color:var(--lv-b);background:var(--lv-s)}
.chip.stack{font-family:var(--mono);font-size:var(--t-label);font-weight:500;color:var(--ink-3)}
.chip.prereq{font-family:var(--mono);font-size:var(--t-label);font-weight:700;cursor:pointer;color:var(--ink-3)}
.chip.prereq:hover{border-color:var(--line-3);color:var(--ink)}
.chip.prereq.met{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}
.chip.prereq.unmet{color:var(--bad);border-color:var(--bad-28);background:var(--bad-08)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);z-index:60;
  background:var(--surface-solid);border:1px solid var(--line-2);color:var(--ink);
  padding:11px 18px;border-radius:99px;font-size:var(--t-read);font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--lime-30);background:var(--lime-12);color:var(--lime)}

/* ---------- page scaffolding ---------- */
.page{max-width:1240px;margin:0 auto;padding:34px 40px 60px;animation:fadeUp .5s var(--ease) both}
.page.wide{max-width:1320px}
.eyebrow{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:var(--t-body);font-weight:600;letter-spacing:-.01em}
.section-h span{font-size:var(--t-meta);color:var(--ink-4)}

/* dashboard hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.hero h1{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p.lede{margin:10px 0 0;font-size:var(--t-body);color:var(--ink-3);max-width:520px;text-wrap:pretty}
.hero .acts{display:flex;gap:8px}

/* resume card */
.resume{
  display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--line-2);border-radius:var(--r-xl);
  overflow:hidden;margin-bottom:22px;cursor:pointer;position:relative;
  background:linear-gradient(120deg,var(--lime-08),rgba(16,18,22,0.9) 46%,rgba(110,155,255,0.06));
  animation:fadeUp .55s .05s var(--ease) both;
}
[data-theme=light] .resume{background:linear-gradient(120deg,var(--lime-08),rgba(255,255,255,.94) 46%,rgba(44,91,208,.06))}
.resume .rl{padding:26px 30px;display:flex;flex-direction:column;gap:16px;min-width:0}
.resume .tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resume .flag{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;font-weight:700;color:var(--on-lime);background:var(--lime);padding:3px 8px;border-radius:5px}
.resume .where{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-3)}
.resume h3{margin:0;font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.resume p{margin:8px 0 0;font-size:var(--t-read);line-height:1.6;color:var(--ink-3);max-width:400px;text-wrap:pretty}
.resume .foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.resume .foot .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-3)}
.resume .foot .r em{font-style:normal;color:var(--lime)}
.resume .rr{
  border-left:1px solid var(--line);background:var(--sunk);padding:22px 24px;overflow:hidden;position:relative;
  font-family:var(--mono);font-size:var(--t-ui);line-height:1.85;color:var(--ink-3);
}
.resume .rr::before{
  content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(199,247,81,0.06),transparent);
  animation:sweep 4.5s 1s ease-in-out infinite;
}
.caret{display:inline-block;width:8px;height:15px;background:var(--lime);margin-left:6px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}

/* progress bars */
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,0.07);overflow:hidden}
[data-theme=light] .bar{background:rgba(15,25,5,.09)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime-deep),var(--lime));box-shadow:var(--lime-glow);animation:barGrow 1s .2s var(--ease) both}

/* stat cards + sparkline */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .lbl{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4)}
.stat .delta{font-size:var(--t-label);font-weight:600;color:var(--lime)}
.stat .val{display:flex;align-items:flex-end;gap:6px}
.stat .val b{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat .val span{font-size:var(--t-meta);color:var(--ink-4);padding-bottom:3px}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px}
.spark i{flex:1;border-radius:2px;background:var(--lime-22);transform-origin:bottom;animation:growUp .6s var(--ease) both}
.spark i.hi{background:var(--lime);box-shadow:0 0 8px rgba(199,247,81,.4)}

/* week chart */
.weekchart{display:flex;align-items:flex-end;gap:10px;height:110px}
.weekchart .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.weekchart .d i{width:100%;border-radius:6px 6px 3px 3px;background:var(--lime-22);transform-origin:bottom;animation:growUp .7s var(--ease) both;min-height:3px}
.weekchart .d.today i{background:linear-gradient(180deg,var(--lime),var(--lime-deep));box-shadow:0 0 12px rgba(199,247,81,.4)}
.weekchart .d span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.weekchart .d.today span{color:var(--lime)}

/* generic panel */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px}
.panel .hr{height:1px;background:var(--line);margin:16px 0}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.rowlink .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--purple-12);border:1px solid rgba(167,139,250,.25);color:var(--purple)}
.rowlink .tx{flex:1;min-width:0}
.rowlink .tx b{display:block;font-size:var(--t-ui);font-weight:600}
.rowlink .tx span{font-size:var(--t-meta);color:var(--ink-4)}
.rowlink .go{color:var(--ink-4)}

/* track cards (dashboard) */
.tracks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.track-card{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;
  display:flex;flex-direction:column;gap:0;text-align:left;color:var(--ink);
  transition:border-color .18s,transform .18s var(--pop),box-shadow .18s;
}
.track-card:hover{border-color:var(--lime-30);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.track-card .head{display:flex;align-items:center;justify-content:space-between}
.track-card .t-icon{width:auto;height:auto;background:none;border:0;font-size:var(--t-body)}
.track-card h3{margin:14px 0 0;font-size:var(--t-read);font-weight:600;letter-spacing:-.015em}
.track-card .tag{margin:4px 0 0;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);min-height:0}
.track-card .foot{display:none}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.strip i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.07)}
[data-theme=light] .strip i{background:rgba(15,25,5,.10)}
.strip i.done{background:var(--lime)}
.strip i.now{background:var(--lime);box-shadow:0 0 6px rgba(199,247,81,.7)}
.strip i.proj{border-radius:50%}

/* progress ring */
.ringwrap{position:relative;width:38px;height:38px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap circle.trk{stroke:rgba(255,255,255,0.08)}
[data-theme=light] .ringwrap circle.trk{stroke:rgba(15,25,5,.10)}
.ringwrap circle.val{stroke:var(--lime);animation:ringIn 1.2s .15s var(--ease) both}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:var(--t-label);font-weight:700;color:var(--ink)}
.ring{--pct:0;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--lime) calc(var(--pct)*1%),rgba(255,255,255,.07) 0)}
[data-theme=light] .ring{background:conic-gradient(var(--lime) calc(var(--pct)*1%),rgba(15,25,5,.09) 0)}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--ground);display:grid;place-items:center;text-align:center;line-height:1.15}
.ring b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ring span{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4)}
.deg-progress{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px;display:flex;gap:20px;align-items:center}
.deg-progress .pl{min-width:0}
.deg-progress h3{margin:0 0 4px;font-size:var(--t-title);font-weight:600;letter-spacing:-.02em}
.deg-progress p{margin:0 0 12px;color:var(--ink-3);font-size:var(--t-ui)}

/* ---------- degree catalog ---------- */
.lv-Beginner{--lv:var(--lime);--lv-s:var(--lime-08);--lv-b:var(--lime-30)}
.lv-Intermediate{--lv:var(--blue);--lv-s:var(--blue-12);--lv-b:rgba(110,155,255,.30)}
.lv-Advanced{--lv:var(--purple);--lv-s:var(--purple-12);--lv-b:rgba(167,139,250,.30)}
.lv-Expert{--lv:var(--amber);--lv-s:var(--amber-08);--lv-b:var(--amber-22)}

.deg-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:26px;margin-bottom:28px;align-items:start}
.deg-hero h1{margin:0 0 12px;font-size:clamp(28px,4vw,38px);line-height:1.06;font-weight:600;letter-spacing:-.03em}
.deg-hero h1 em{font-style:normal;color:var(--lime)}
.deg-hero p{margin:0 0 18px;font-size:var(--t-body);color:var(--ink-3);max-width:56ch;text-wrap:pretty}
.deg-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.deg-stats .stat{padding:13px 15px;gap:6px}
.deg-stats .stat b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.deg-stats .stat span{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-4)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 22px}
.filters input[type=search]{
  flex:1;min-width:170px;max-width:300px;height:34px;padding:0 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--ink);font:13px var(--sans);
}
[data-theme=light] .filters input[type=search]{background:rgba(15,25,5,.03)}
.filters .count{margin-left:auto;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
[data-theme=light] .seg{background:rgba(15,25,5,.04)}
.seg button{padding:5px 12px;border-radius:7px;font-size:var(--t-meta);font-weight:600;color:var(--ink-3);white-space:nowrap;transition:all .16s}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--lime);color:var(--on-lime)}

/* ---------- mathematics ---------- */
math{font-size:1.06em}
/* `display:block` alone replaces the element's MathML inner display type with
   ordinary flow layout, so an mfrac stops sizing to its content and stretches to
   the column: I = Q/t rendered with a fraction bar 700px wide. `block math` keeps
   the math layout and makes the box block-level. The plain `block` stays first as
   the fallback for engines that do not know the two-value syntax. */
math[display=block]{display:block;display:block math;margin:14px 0;
  overflow-x:auto;overflow-y:hidden;text-align:center}
.article math[display=block]{padding:4px 0}
.math-raw{font-family:var(--mono);font-size:.9em;color:var(--amber);
  background:var(--amber-08);padding:1px 6px;border-radius:4px}

/* ---------- sandbox ---------- */
.sbx-host{margin:18px 0 6px}
.sbx{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--sunk);padding:14px}
.sbx-canvas{min-height:280px;height:320px;border-radius:var(--r);overflow:hidden;background:var(--editor)}
.sbx-canvas canvas{display:block}
.sbx-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sbx-params{display:flex;flex-direction:column;gap:12px}
.sbx-p{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:baseline}
.sbx-l{font-size:var(--t-meta);color:var(--ink-3)}
.sbx-v{font-family:var(--mono);font-size:var(--t-meta);color:var(--lime);text-align:right}
.sbx-p input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--lime);height:18px;cursor:pointer}
.sbx-read{font-size:var(--t-ui);line-height:1.65;color:var(--ink-3);
  padding-top:12px;border-top:1px solid var(--line);text-wrap:pretty}
.sbx-read b{color:var(--ink);font-weight:600}
.sbx-read em{color:var(--ink-2);font-style:italic}
.sbx-notice{margin:14px 0 0;padding:14px 16px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface)}
.sbx-notice h4{margin:0 0 8px;font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);
  text-transform:uppercase;color:var(--lime)}
.sbx-notice ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sbx-notice li{font-size:var(--t-read);line-height:1.6;color:var(--ink-3)}
@media (max-width:820px){
  .sbx{grid-template-columns:1fr}
  .sbx-canvas{height:260px}
}

/* ---------- guided derivation ---------- */
.dv-prog{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.dv-prog .bar{flex:1;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.dv-prog .bar i{display:block;height:100%;background:var(--lime);transition:width .3s var(--ease)}
.dv-prog span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4);white-space:nowrap}
/* The label above is uppercased; this line is not, because it shows what to TYPE
   and `(A+B)/C` is not what anyone should type. */
.dv-in .dv-how{display:block;font-size:var(--t-meta);color:var(--ink-3);margin-top:3px;
  font-weight:400;text-transform:none;letter-spacing:0}
.dv-how code{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-3);
  background:var(--surface-2);border-radius:4px;padding:0 4px}
.dv-steps{display:flex;flex-direction:column;gap:12px}
.dv-step{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px}
.dv-step.active{border-color:var(--lime-30);background:var(--lime-04,var(--surface))}
.dv-step.solved{opacity:.9}
.dv-step.locked{opacity:.5}
.dv-head{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.dv-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:var(--t-label);border:1px solid var(--line-2);color:var(--ink-3)}
.dv-step.solved .dv-n{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.dv-step.active .dv-n{border-color:var(--lime);color:var(--lime)}
.dv-ask{font-size:var(--t-read);line-height:1.65;color:var(--ink-2)}
.dv-ask p{margin:0 0 6px}.dv-ask p:last-child{margin:0}
.dv-hidden{font-size:var(--t-ui);color:var(--ink-5);font-style:italic}
.dv-given{margin:12px 0 0 38px;padding:10px 14px;border-radius:var(--r);
  background:var(--sunk);border:1px solid var(--line);font-size:var(--t-ui);color:var(--ink-3)}
.dv-answer{margin:10px 0 0 38px;padding:8px 14px;border-radius:var(--r);
  background:var(--lime-08);border:1px solid var(--lime-22)}
.dv-work{margin:14px 0 0 38px;display:flex;flex-direction:column;gap:10px}
.dv-in{display:flex;flex-direction:column;gap:5px}
.dv-in span{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);
  text-transform:uppercase;color:var(--ink-5)}
.dv-in input{height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--editor);color:var(--ink);font:13.5px var(--mono);outline:none;transition:border-color .16s}
.dv-in input:focus{border-color:var(--lime)}
.dv-preview{min-height:26px;display:flex;align-items:center;color:var(--ink-2)}
.dv-acts{display:flex;gap:8px;flex-wrap:wrap}
.dv-msg{font-size:var(--t-ui);line-height:1.6;color:var(--ink-3);min-height:1px}
.dv-msg.bad{color:var(--amber)}
.dv-msg.hint{color:var(--blue)}
.dv-sub{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r);
  background:var(--sunk);border:1px solid var(--line)}
.dv-substep{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:var(--t-ui);
  line-height:1.6;color:var(--ink-3)}
.dv-substep b{font-family:var(--mono);font-size:var(--t-label);color:var(--lime)}
.dv-substep p{margin:0}
.dv-left{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-4)}
.dv-closing{margin:18px 0 0;padding:16px 18px;border-radius:var(--r-lg);
  border:1px solid var(--lime-22);background:var(--lime-08);font-size:var(--t-read);
  line-height:1.65;color:var(--ink-2)}
.dv-closing p{margin:0}
@media (max-width:620px){
  .dv-given,.dv-answer,.dv-work{margin-left:0}
}

.build-acts{display:flex;gap:10px;margin:16px 0 14px;flex-wrap:wrap}
#build-checks{margin-bottom:8px}
#build-mount{margin-top:16px}

/* ---------- fill in the blanks ----------
   The state colours are Voltaic's: green for right, pink for wrong, amber for a slot
   waiting to be filled. They are used only for answer state, so they never compete
   with the lime the rest of the app uses for progress. */
:root{
  --ans-ok:#5BE58A;
  --ans-no:#FF5C7A;
  --ans-wait:#FFB020;
}
[data-theme=light]{
  --ans-ok:#1E7F45;
  --ans-no:#C0264A;
  --ans-wait:#9A5B00;
}
/* This whole box is on --editor, so every colour in it comes from the on-editor family
   and none from the page's. It had the surface of one pattern and the ink of the other:
   the listing was --ink-2 (1.84:1 in the light theme), a filled hole was --ink on
   --surface-2 (1.01:1 — black on black), and the bar was --sunk, a near-white strip
   across the top of a dark box. See --on-editor-ok above for the measured set. */
.blk-wrap{margin:18px 0 14px;border:1px solid var(--line-3);border-radius:var(--r-lg);
  background:var(--editor);overflow:hidden}
.blk-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--on-editor-line);
  background:var(--on-editor-sunk)}
.blk-file{font-family:var(--mono);font-size:var(--t-meta);color:var(--on-editor-2)}
.blk-count{margin-left:auto;font-family:var(--mono);font-size:var(--t-label);color:var(--on-editor-2)}
.blk-listing{margin:0;padding:18px 20px;overflow-x:auto;font-family:var(--mono);
  font-size:var(--t-read);line-height:2.05;color:var(--on-editor-2);white-space:pre}
.blk{
  display:inline-block;min-width:92px;padding:1px 10px;margin:0 1px;
  border-radius:6px;border:1px dashed var(--on-editor-wait);
  background:color-mix(in srgb,var(--on-editor-wait) 12%,transparent);
  color:var(--on-editor-wait);font:inherit;font-size:.95em;cursor:pointer;text-align:center;
  transition:background .14s,border-color .14s,color .14s;
}
.blk:hover{background:color-mix(in srgb,var(--on-editor-wait) 22%,transparent)}
.blk.open{outline:2px solid var(--on-editor-wait);outline-offset:1px}
.blk.filled{border-style:solid;border-color:var(--on-editor-line);
  background:var(--on-editor-fill);color:var(--on-editor)}
.blk.right{border-style:solid;border-color:var(--on-editor-ok);
  background:color-mix(in srgb,var(--on-editor-ok) 14%,transparent);color:var(--on-editor-ok)}
.blk.wrong{border-style:solid;border-color:var(--on-editor-no);
  background:color-mix(in srgb,var(--on-editor-no) 14%,transparent);color:var(--on-editor-no)}
.blk-pick{margin:0 0 14px;padding:14px 16px;border:1px solid var(--line-3);
  border-radius:var(--r-lg);background:var(--surface);animation:fadeUp .18s var(--ease) both}
.blk-pick-h{font-size:var(--t-ui);color:var(--ink-2);margin-bottom:10px}
.blk-opt{display:inline-block;margin:0 8px 8px 0;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
  font:13px var(--mono);cursor:pointer;transition:border-color .14s,background .14s}
.blk-opt:hover{border-color:var(--ink-4);color:var(--ink)}
.blk-opt.on{border-color:var(--lime);background:var(--lime-12);color:var(--ink)}
.blk-acts{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.blk-fb{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
/* Check moves the keyboard here, so the score is the first thing read out. It is a
   heading in fact rather than in tag: the rows under it are what it counts. */
.blk-fb-h{font-size:var(--t-ui);color:var(--ink-2);font-weight:600}
.blk-fb:focus-visible{outline:2px solid var(--lime);outline-offset:4px;border-radius:var(--r-lg)}
.blk-row{display:grid;grid-template-columns:18px 1fr;gap:11px;padding:12px 14px;
  border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
/* 80%, and the same 80% on .q-verdict and .mt-card below. The three unit kinds drew one
   fact — right or wrong — at 30%, 34% and 45%, which measured 1.61 to 3.21:1 against the
   card and so was a state you could not see in the light theme. 80% is the lowest mix
   that clears 3:1 on all four of {ok,no} x {dark,light}: 7.82, 3.45, 4.45, 4.17. */
.blk-row.right{border-color:color-mix(in srgb,var(--ans-ok) 80%,transparent)}
.blk-row.wrong{border-color:color-mix(in srgb,var(--ans-no) 80%,transparent)}
.blk-row b{font-family:var(--mono);font-size:var(--t-ui);color:var(--ink)}
.blk-yours{font-family:var(--mono);font-size:var(--t-meta);color:var(--ans-no)}
.blk-row p{margin:5px 0 0;font-size:var(--t-ui);line-height:1.6;color:var(--ink-3);text-wrap:pretty}

/* ---------- a module's units ---------- */
.unit-list{display:flex;flex-direction:column;gap:7px}
.unit-list .lab-row{display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;
  align-items:center;gap:11px;text-align:left}
.mcount{flex:none;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5);
  margin-left:auto;padding-right:12px}

/* ---------- a module's units ---------- */
.unit-list{display:flex;flex-direction:column;gap:7px}
.unit-list .lab-row{display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;
  align-items:center;gap:11px;text-align:left}
.mcount{flex:none;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5);
  margin-left:auto;padding-right:12px}

/* ---------- interactive questions: solve, match, tune ----------
   One prompt, one thing to manipulate, one verdict. The shared pieces live here so a
   new question type inherits the rhythm rather than inventing its own. */
.q-prompt{font-size:21px;line-height:1.3;letter-spacing:-.02em;margin:26px 0 8px;text-wrap:balance}
.q-note{color:var(--ink-4);font-size:var(--t-ui);margin:0 0 18px;text-wrap:pretty}
.q-acts{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.q-count{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-4);margin-left:auto}
.q-hint{margin:0 0 14px;padding:12px 15px;border-radius:var(--r-lg);font-size:var(--t-ui);line-height:1.6;
  color:var(--ink-3);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
  background:color-mix(in srgb,var(--amber) 8%,transparent)}
.q-verdict{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:14px 16px;margin:16px 0 0;
  border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.q-verdict.ok{border-color:color-mix(in srgb,var(--ans-ok) 80%,transparent)}
.q-verdict.no{border-color:color-mix(in srgb,var(--ans-no) 80%,transparent)}
.q-verdict b{font-size:var(--t-read);color:var(--ink)}
.q-verdict p{margin:5px 0 0;font-size:var(--t-ui);line-height:1.6;color:var(--ink-3);text-wrap:pretty}

/* ---- find the value ---- */
.numq{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.numq-fig{border:1px solid var(--line-3);border-radius:var(--r-lg);background:var(--editor);
  overflow:hidden;min-height:340px}
.numq-fig .ckt-ro .ckt-main{grid-template-columns:minmax(0,1fr)}
.numq-fig .ckt-ro .ckt-canvas{min-height:340px}
.numq-nofig{padding:24px;color:var(--on-editor-2);font-size:var(--t-read);line-height:1.7}
.numq-side{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}
/* --ink-5 is the placeholder-and-disabled tier, roughly 2:1 in both themes. This is the
   label above the one input the unit exists for, not a disabled control. Same repair
   cycle 5 made on .rail-miss, and 11px for the same reason it raised the rail's 9.5px. */
.nq-lbl{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;
  color:var(--ink-4);margin-bottom:9px}
.nq-lbl.mt{margin-top:20px}
/* The box is --editor. The answer being typed into it was --ink: 17.09:1 in the dark
   theme and 1.01:1 in the light one, where --ink is #131712 and --editor is #12151A.
   The placeholder was --ink-5, which inverted the pair — 8.74:1 light against the
   value's 1.01, so the hint was legible and the answer was not. */
.nq-in{display:flex;align-items:stretch;border:1px solid var(--line-3);border-radius:var(--r-lg);
  overflow:hidden;background:var(--editor)}
.nq-in input{flex:1;min-width:0;padding:12px 14px;border:0;background:transparent;color:var(--on-editor);
  font-family:var(--mono);font-size:var(--t-title);outline:none}
/* 2.93 / 2.72:1 deliberately, and quieter than the 13.68:1 value it stands in for: a
   placeholder that reaches AA stops being distinguishable from a filled one, which is
   the decision cycle 5 recorded when it left --ink-5 alone rather than darkening it. */
.nq-in input::placeholder{color:var(--on-editor-hint)}
.nq-in:focus-within{border-color:var(--lime-30)}
.nq-u{display:grid;place-items:center;padding:0 14px;border-left:1px solid var(--on-editor-line);
  font-family:var(--mono);font-size:var(--t-ui);color:var(--on-editor-2);background:var(--on-editor-sunk)}
.nq-given{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:var(--t-meta)}
.nq-given td{padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-3)}
.nq-given tr:last-child td{border-bottom:0}
.nq-given td:last-child{text-align:right;color:var(--ink)}
.nq-aside{margin:16px 0 0;font-size:var(--t-meta);line-height:1.6;color:var(--ink-4);text-wrap:pretty}

/* ---- symbol drill ---- */
.mt-labels{display:flex;flex-wrap:wrap;gap:9px;padding:14px 16px;margin-bottom:18px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.mt-lb{padding:8px 15px;border-radius:999px;border:1px solid var(--line-2);background:transparent;
  color:var(--ink-2);font-size:var(--t-ui);cursor:pointer;transition:border-color .14s,background .14s,opacity .14s}
.mt-lb:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink)}
.mt-lb.armed{border-color:var(--lime);background:var(--lime-12);color:var(--ink)}
.mt-lb.spent{opacity:.3;cursor:default}
.mt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.mt-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;overflow:hidden;transition:border-color .14s,transform .14s}
.mt-card:hover{border-color:var(--line-3);transform:translateY(-1px)}
.mt-card.filled{border-color:var(--line-3)}
.mt-card.right{border-color:color-mix(in srgb,var(--ans-ok) 80%,transparent)}
.mt-card.wrong{border-color:color-mix(in srgb,var(--ans-no) 80%,transparent)}
.mt-cv{width:100%;height:130px;display:block}
.mt-slot{padding:10px;text-align:center;font-size:var(--t-ui);color:var(--ink-3);
  border-top:1px solid var(--line);font-family:var(--mono);min-height:38px}
.mt-card.right .mt-slot{color:var(--ans-ok)}
.mt-card.wrong .mt-slot{color:var(--ans-no)}
.mt-fb{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* ---- hit the target ---- */
.tune{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.tn-plot{position:relative;border:1px solid var(--line-3);border-radius:var(--r-lg);
  background:var(--editor);padding:12px;min-height:330px}
.tn-cap{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;
  color:var(--ink-5);margin-bottom:6px}
#tn-cv{width:100%;height:296px;display:block}
.tn-side{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}
/* a <label>, so the range input inside it has an accessible name; display:block keeps
   the layout identical to the <div> it replaced */
.tn-p{display:block;margin-bottom:16px}
.tn-ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;
  font-size:var(--t-ui);color:var(--ink-3)}
.tn-ph b{font-family:var(--mono);font-size:var(--t-ui);color:var(--ink)}
.tn-p input[type=range]{width:100%;accent-color:var(--lime)}
.tn-reads{border-top:1px solid var(--line);padding-top:13px;margin-top:4px}
.tn-r{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;
  font-size:var(--t-ui);color:var(--ink-4)}
.tn-r b{font-family:var(--mono);font-size:var(--t-ui);color:var(--ink)}
.tn-r.ok b{color:var(--ans-ok)}
.tn-r.no b{color:var(--ans-no)}
.tn-goal{margin-top:14px;padding:11px 13px;border-radius:var(--r);display:flex;flex-direction:column;
  gap:6px;border:1px solid var(--line-2);background:var(--sunk);font-family:var(--mono);font-size:var(--t-meta)}
.tn-goal.met{border-color:color-mix(in srgb,var(--ans-ok) 40%,transparent);
  background:color-mix(in srgb,var(--ans-ok) 8%,transparent)}
.tn-c{color:var(--ink-4)}
.tn-c.ok{color:var(--ans-ok)}

@media (max-width:900px){
  .numq,.tune{grid-template-columns:minmax(0,1fr)}
}

/* ---------- the degree planner ----------
   Three columns and a footer: which degree, which year and subject, what that
   subject needs first, and where the whole thing stands. The middle column is the
   only one that scrolls on its own, so the majors list and the chosen subject's
   prerequisites stay put while you browse a year. */
.planner{
  display:grid;height:100%;min-height:0;
  grid-template-columns:236px minmax(0,1fr) 380px;
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"majors main detail" "foot foot foot";
  /* Any area a media query adds beyond the two rows declared above lands in an
     implicit track, and an implicit track defaults to `auto` — which sizes to its
     content and starves the single minmax(0,1fr) row. That row is .pl-main, the
     year tabs and the subject grid: the whole point of the screen. It collapsed to
     0px below 820px. Same trap as .frame further down; make the default harmless. */
  grid-auto-rows:minmax(0,auto);
}
.pl-majors{grid-area:majors;border-right:1px solid var(--line);padding:22px 16px;overflow-y:auto;min-height:0}
.pl-main{grid-area:main;padding:26px 30px 30px;overflow-y:auto;min-height:0}
.pl-detail{grid-area:detail;border-left:1px solid var(--line);padding:24px 22px;overflow-y:auto;
  min-height:0;background:var(--surface)}
.pl-foot{grid-area:foot;border-top:1px solid var(--line);background:var(--sunk);
  display:flex;align-items:center;gap:20px;padding:14px 26px}

.pl-lbl{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;
  color:var(--ink-5);margin-bottom:11px}
.pl-lbl.mt{margin-top:26px}

/* ---- majors ---- */
.mj-list{display:flex;flex-direction:column;gap:7px}
.mj{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;
  text-align:left;transition:border-color .15s,background .15s}
.mj:hover{border-color:var(--line-3);background:var(--surface-2)}
.mj.on{border-color:var(--lime-30);background:var(--lime-08);color:var(--ink)}
.mj-i{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;
  background:var(--surface-2);font-size:var(--t-ui)}
.mj.on .mj-i{background:var(--lime-12);color:var(--lime)}
.mj-n{flex:1;font-size:var(--t-ui);font-weight:500;line-height:1.25;min-width:0}
.mj-c{flex:none;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5)}

.fnd{padding:2px 2px 0}
.fnd-h{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-meta);
  color:var(--ink-4);margin-bottom:9px}
.fnd-h b{color:var(--ink-2);font-family:var(--mono);font-size:var(--t-meta)}
.fnd-go{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;
  padding:10px 12px;border-radius:var(--r-lg);border:1px solid var(--line);background:transparent;
  color:var(--ink-3);font-size:var(--t-ui);cursor:pointer;transition:border-color .15s,color .15s}
.fnd-go:hover{border-color:var(--line-3);color:var(--ink)}
.fnd-go span{color:var(--ink-5)}

/* ---- segmented progress: countable, not estimated ---- */
.segs{display:flex;gap:3px;width:100%}
.segs i{flex:1;height:5px;border-radius:2px;background:var(--line-2)}
.segs i.on{background:var(--lime)}

/* ---- the middle column ---- */
.pl-eyebrow{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;
  color:var(--lime);margin-bottom:14px}
.pl-h1{font-size:34px;line-height:1.12;letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
.pl-sub{color:var(--ink-3);font-size:var(--t-read);margin:0 0 22px}
.yr-row{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:26px;max-width:560px}
.yr-lbl{display:grid;place-items:center;padding:0 16px;font-family:var(--mono);font-size:var(--t-label);
  letter-spacing:var(--tr-caps);color:var(--ink-5);border-right:1px solid var(--line);background:var(--sunk)}
.yr{flex:1;padding:11px 0;border:0;border-right:1px solid var(--line);background:transparent;
  color:var(--ink-3);font-family:var(--mono);font-size:var(--t-ui);cursor:pointer;transition:background .14s,color .14s}
.yr:last-child{border-right:0}
.yr:hover{background:var(--surface-2);color:var(--ink)}
.yr.on{background:var(--lime);color:var(--on-lime);font-weight:600}
.pl-h2{font-size:var(--t-body);font-weight:600;margin:0 0 14px;color:var(--ink)}
.pl-h2 span{color:var(--ink-4);font-weight:400}

.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{display:flex;flex-direction:column;gap:11px;padding:15px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;
  text-align:left;transition:border-color .15s,background .15s,transform .15s}
.subj:hover{border-color:var(--line-3);transform:translateY(-1px)}
.subj.on{border-color:var(--lime-30);background:var(--lime-05)}
.sj-top{display:flex;align-items:center;gap:11px}
.sj-icon{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
  background:var(--surface-2);font-size:var(--t-body);color:var(--ink-3)}
.subj.on .sj-icon{background:var(--lime-12);color:var(--lime)}
.sj-id{min-width:0}
.sj-id b{display:block;font-size:var(--t-read);font-weight:600;color:var(--ink);line-height:1.25}
.sj-id span{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5)}
.sj-meta{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:var(--t-label);color:var(--ink-4)}
.sj-meta .dot{color:var(--ink-5)}
.sj-state{display:flex;align-items:center;gap:7px;font-size:var(--t-meta);color:var(--ink-4)}
.sj-state i{width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
.sj-state.live i{background:var(--lime)}
.sj-state.live{color:var(--lime)}
.sj-state.done i{background:var(--ans-ok)}
.sj-state.done{color:var(--ans-ok)}
.pl-more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;
  padding:11px;border-radius:var(--r-lg);border:1px solid transparent;background:transparent;
  color:var(--ink-3);font-size:var(--t-ui);cursor:pointer}
.pl-more:hover{border-color:var(--line);color:var(--ink)}
.pl-more span{color:var(--ink-5)}

/* ---- the detail panel ---- */
.pd-eyebrow{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);color:var(--ink-5);
  margin-bottom:9px;line-height:1.5}
.pd-title{font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.pd-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.pd-chips span{padding:5px 10px;border-radius:var(--r);border:1px solid var(--line);
  font-family:var(--mono);font-size:var(--t-label);color:var(--ink-3)}
.pd-sum{font-size:var(--t-ui);line-height:1.65;color:var(--ink-3);margin:0 0 22px;text-wrap:pretty}
.pd-h{font-size:var(--t-read);font-weight:600;margin:0 0 12px}
.pq-row{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.pq{position:relative;flex:none;width:92px;display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:12px 8px;border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-3);cursor:pointer;text-align:center;
  transition:border-color .15s}
.pq:hover{border-color:var(--line-3)}
.pq.ok{border-color:color-mix(in srgb,var(--ans-ok) 34%,transparent)}
.pq.next{border-color:color-mix(in srgb,var(--amber) 46%,transparent);
  background:color-mix(in srgb,var(--amber) 8%,transparent)}
.pq.target{border-color:var(--line-3);background:var(--surface)}
.pq-b{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;font-size:var(--t-label);font-weight:700;border:1px solid var(--ground)}
.pq-b.ok{background:var(--ans-ok);color:#06240f}
.pq-b.next{background:var(--amber);color:#241a00}
.pq-g{font-size:var(--t-title);color:var(--ink-3)}
.pq.next .pq-g{color:var(--amber)}
.pq-n{font-size:var(--t-meta);font-weight:600;color:var(--ink);line-height:1.25}
.pq-c{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-5)}
.pq-s{font-size:var(--t-label);color:var(--ink-4);margin-top:2px}
.pq.next .pq-s{color:var(--amber)}
.pq.ok .pq-s{color:var(--ans-ok)}
.pq-arrow{flex:none;display:grid;place-items:center;color:var(--ink-5);font-size:var(--t-label);width:10px}
.pd-note{font-size:var(--t-meta);line-height:1.55;color:var(--ink-4);margin:0 0 18px;text-wrap:pretty}
.pd-acts{display:flex;flex-direction:column;gap:9px}
.pd-acts .btn{width:100%;justify-content:center}

/* ---- the footer ---- */
.pf-lbl{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--ink-5)}
.pf-pct{font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--lime);line-height:1}
.pf-cr{font-size:var(--t-ui);color:var(--ink-4);line-height:1.4}
.pf-cr b{color:var(--ink-2);font-family:var(--mono)}
.pf-ok{display:block;font-size:var(--t-label);color:var(--ans-ok)}
.pf-foot .segs,.pl-foot .segs{flex:1;min-width:120px}
.pf-go{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:transparent;color:var(--ink-3);font-size:var(--t-ui);cursor:pointer}
.pf-go:hover{border-color:var(--line-3);color:var(--ink)}
.pl-empty{color:var(--ink-4);font-size:var(--t-ui)}

/* Once the columns stack there is no longer one pane per column to scroll, so the
   whole planner scrolls as a page instead. Three independent scrollers stacked on a
   narrow screen is the wrong model even when the tracks are sized correctly. */
@media (max-width:1240px){
  .planner{grid-template-columns:200px minmax(0,1fr);
    grid-template-rows:auto auto auto;
    grid-template-areas:"majors main" "detail detail" "foot foot";
    height:auto}
  .main.bleed{overflow:auto}
  .pl-majors,.pl-main,.pl-detail{overflow:visible;min-height:auto}
  .pl-detail{border-left:0;border-top:1px solid var(--line)}
  .pl-foot{position:sticky;bottom:0;z-index:3}
}
@media (max-width:820px){
  .planner{grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto auto auto;
    grid-template-areas:"main" "majors" "detail" "foot"}
  .pl-majors{border-right:0;border-top:1px solid var(--line)}
  .pl-foot{flex-wrap:wrap;gap:12px}
}

/* ---------- a programme that did not load ---------- */
/* Explicit rows, because the banner is display:none most of the time and a
   display:none child is not a grid item at all — without this the body slid up
   into the auto row and the minmax(0,1fr) row it needs for internal scrolling
   was left empty. */
.frame>.topbar{grid-row:1}
.frame>.degrade{grid-row:2}
.frame>.runbar{grid-row:3}
.frame>.body{grid-row:4}
.frame>.runfoot{grid-row:5}

/* ---------- focus mode: the question is the screen ----------
   A question used to render as a small block partway down a scrolling article,
   with the icon rail, the top bar and the curriculum rail all still competing for
   attention. Here the chrome steps back, the prompt and the figure take the room,
   and Check sits in a bar that is always on screen. */
.runbar{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;
  border-bottom:1px solid var(--line);background:var(--surface-solid)}
.runbar[hidden]{display:none}
.rb-x{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line-2);color:var(--ink-3);font-size:var(--t-ui)}
.rb-x:hover{color:var(--ink);border-color:var(--ink-4)}
.rb-segs{flex:1;display:flex;gap:3px;max-width:560px}
.rb-segs i{height:4px;flex:1;border-radius:2px;background:var(--ink-5)}
.rb-segs i.on{background:var(--lime)}
.rb-segs i.now{background:var(--lime);opacity:.42}
.rb-who{font-family:var(--mono);font-size:var(--t-label);letter-spacing:var(--tr-caps);text-transform:uppercase;
  color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-at{font-family:var(--mono);font-size:var(--t-label);color:var(--ink-3);flex:none}
.rb-desk{width:32px;height:32px;border-radius:9px;flex:none;display:grid;
  place-items:center;border:1px solid var(--line-2);color:var(--ink-3);font-size:var(--t-ui)}
.rb-desk:hover{color:var(--lime);border-color:var(--lime-30);background:var(--lime-08)}

/* The answer bar is furniture, not content: every row it grows comes straight out of
   the question above it. Two buttons and a long next-lesson label were wrapping to
   three rows on a narrow window — 111px of a 569px viewport, which is what pushed the
   active derivation step behind it. It stays one row and the long label truncates. */
.runfoot{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:nowrap;
  border-top:1px solid var(--line);background:var(--surface-solid)}
.runfoot .run-next{min-width:0;max-width:34vw;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block}
@media (max-width:640px){
  .runfoot{padding:8px 12px;gap:8px}
  .runfoot .btn{min-width:0;padding:10px 14px}
  .runfoot .run-next{max-width:30vw}
}
.runfoot[hidden]{display:none}
.runfoot .spacer{flex:1}
.runfoot .q-acts,.runfoot .blk-acts,.runfoot .build-acts,.runfoot .dv-acts{
  margin:0;display:flex;gap:10px;align-items:center}
.runfoot .btn{min-width:132px;justify-content:center}
.runfoot .done-note{font-family:var(--mono);font-size:var(--t-meta);color:var(--lime)}

/* Hiding the icon rail takes it out of grid flow, so .frame auto-places into the
   72px track it used to occupy and the whole app renders 72px wide. Collapse the
   track as well as the element. */
